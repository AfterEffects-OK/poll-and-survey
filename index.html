<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投票・クイズ回答</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@600;700;800&family=Orbitron:wght@700&family=Oswald:wght@600&family=Share+Tech+Mono&family=Shippori+Mincho:wght@700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="dark"] {
      --font-main: "Noto Sans JP", system-ui, sans-serif;
      --font-num: "Noto Sans JP", sans-serif;
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --opt-bg: #334155;
      --opt-hover: #475569;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --muted: #94a3b8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --timer: #fbbf24;
      --radius: 16px;
      --btn-radius: 12px;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    [data-theme="neon"] {
      --font-main: "Dela Gothic One", "Noto Sans JP", sans-serif;
      --font-num: "Orbitron", sans-serif;
      --bg: #09090b;
      --card: #111118;
      --card-border: #ec4899;
      --opt-bg: #181825;
      --opt-hover: #27273a;
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.18);
      --text: #fdf4ff;
      --muted: #c084fc;
      --ok: #4ade80;
      --warn: #facc15;
      --timer: #f472b6;
      --radius: 6px;
      --btn-radius: 4px;
      --shadow: 0 0 28px rgba(236, 72, 153, 0.35);
    }

    [data-theme="pop"] {
      --font-main: "M PLUS Rounded 1c", sans-serif;
      --font-num: "Fredoka", "M PLUS Rounded 1c", sans-serif;
      --bg: #fef3c7;
      --card: #ffffff;
      --card-border: #1e293b;
      --opt-bg: #f1f5f9;
      --opt-hover: #e2e8f0;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.14);
      --text: #0f172a;
      --muted: #475569;
      --ok: #16a34a;
      --warn: #d97706;
      --timer: #ea580c;
      --radius: 24px;
      --btn-radius: 16px;
      --shadow: 0 10px 0 #1e293b;
    }

    [data-theme="cyber"] {
      --font-main: "DotGothic16", monospace;
      --font-num: "Share Tech Mono", monospace;
      --bg: #040d0a;
      --card: #071912;
      --card-border: #10b981;
      --opt-bg: #0b241b;
      --opt-hover: #103528;
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.2);
      --text: #ecfdf5;
      --muted: #6ee7b7;
      --ok: #a3e635;
      --warn: #fbbf24;
      --timer: #2dd4bf;
      --radius: 4px;
      --btn-radius: 2px;
      --shadow: 0 0 24px rgba(16, 185, 129, 0.3);
    }

    [data-theme="sakura"] {
      --font-main: "Zen Maru Gothic", sans-serif;
      --font-num: "Zen Maru Gothic", sans-serif;
      --bg: #fff1f2;
      --card: #ffffff;
      --card-border: #fda4af;
      --opt-bg: #ffe4e6;
      --opt-hover: #fecdd3;
      --accent: #e11d48;
      --accent-soft: rgba(225, 29, 72, 0.14);
      --text: #3f1d28;
      --muted: #881337;
      --ok: #059669;
      --warn: #d97706;
      --timer: #db2777;
      --radius: 26px;
      --btn-radius: 18px;
      --shadow: 0 14px 32px rgba(244, 114, 182, 0.22);
    }

    [data-theme="broadcast"] {
      --font-main: "Shippori Mincho", serif;
      --font-num: "Oswald", sans-serif;
      --bg: #0b132b;
      --card: #132247;
      --card-border: #ef4444;
      --opt-bg: #1c2f5e;
      --opt-hover: #263e7a;
      --accent: #f87171;
      --accent-soft: rgba(239, 68, 68, 0.2);
      --text: #ffffff;
      --muted: #cbd5e1;
      --ok: #38bdf8;
      --warn: #facc15;
      --timer: #fde047;
      --radius: 8px;
      --btn-radius: 6px;
      --shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .box {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 28px;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .timer-badge {
      font-family: var(--font-num);
      font-size: 14px;
      font-weight: 800;
      color: var(--timer);
    }
    .theme-select {
      font-family: "Noto Sans JP", sans-serif;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--opt-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      cursor: pointer;
    }
    h1 { font-size: 20px; margin: 0 0 20px; line-height: 1.4; }
    .options { display: grid; gap: 12px; }
    button.opt-btn {
      width: 100%;
      padding: 16px;
      font-family: var(--font-main);
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      background: var(--opt-bg);
      border: 2px solid transparent;
      border-radius: var(--btn-radius);
      cursor: pointer;
      text-align: left;
      transition: 0.15s;
    }
    button.opt-btn:hover:not(:disabled) {
      background: var(--opt-hover);
      border-color: var(--accent);
    }
    button.opt-btn.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    button.opt-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status-msg {
      margin-top: 16px;
      font-size: 14px;
      color: var(--muted);
      min-height: 22px;
    }
    .ok { color: var(--ok); font-weight: 600; }
    .warn { color: var(--warn); }
  </style>
</head>
<body>
  <div class="box">
    <div class="top-row">
      <div id="modeBadge" class="badge">読み込み中...</div>
      <div class="right-controls">
        <div id="timerBadge" class="timer-badge"></div>
        <select id="themeSelect" class="theme-select" aria-label="表示テーマ" onchange="applyTheme(this.value)">
          <option value="dark">ダーク</option>
          <option value="neon">ネオン</option>
          <option value="pop">ポップ</option>
          <option value="cyber">サイバー</option>
          <option value="sakura">サクラ</option>
          <option value="broadcast">ニュース風</option>
        </select>
      </div>
    </div>
    <h1 id="questionText">少々お待ちください</h1>
    <div id="optionsArea" class="options"></div>
    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script src="config.js"></script>
  <script>
    const ALLOWED_THEMES = ['dark', 'neon', 'pop', 'cyber', 'sakura', 'broadcast'];
    const THEME_STORAGE_KEY = 'obs_poll_voter_theme';

    function initTheme() {
      const params = new URLSearchParams(window.location.search);
      const queryTheme = params.get('theme');
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      const chosen = ALLOWED_THEMES.includes(queryTheme)
        ? queryTheme
        : (ALLOWED_THEMES.includes(savedTheme) ? savedTheme : 'dark');
      applyTheme(chosen, false);
      const sel = document.getElementById('themeSelect');
      if (sel) sel.value = chosen;
    }

    function applyTheme(theme, save = true) {
      const next = ALLOWED_THEMES.includes(theme) ? theme : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      if (save) {
        localStorage.setItem(THEME_STORAGE_KEY, next);
      }
    }

    function getVoterId() {
      let id = localStorage.getItem('obs_poll_voter_id');
      if (!id) {
        id = 'v_' + Math.random().toString(36).slice(2) + '_' + Date.now().toString(36);
        localStorage.setItem('obs_poll_voter_id', id);
      }
      return id;
    }

    function getVotedChoice(questionId) {
      return localStorage.getItem('obs_poll_voted_' + questionId) || '';
    }

    function setVotedChoice(questionId, choice) {
      localStorage.setItem('obs_poll_voted_' + questionId, choice);
    }

    const voterId = getVoterId();
    let isSubmitting = false;
    let currentState = { status: 'WAITING', deadlineAt: 0 };
    let expiredTriggered = false;

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('#optionsArea button.opt-btn').forEach(btn => {
        btn.disabled = disabled;
      });
    }

    function renderCountdown() {
      const el = document.getElementById('timerBadge');
      if (!el) return;

      if (currentState.status === 'VOTING' && currentState.deadlineAt) {
        const remainSec = Math.max(0, Math.ceil((Number(currentState.deadlineAt) - Date.now()) / 1000));
        el.textContent = `残り ${remainSec}秒`;
        if (remainSec === 0 && !expiredTriggered) {
          expiredTriggered = true;
          setButtonsDisabled(true);
          document.getElementById('statusMsg').innerHTML = '<span class="warn">制限時間に達しました。集計を確認中...</span>';
          setTimeout(refresh, 400);
        }
      } else {
        el.textContent = '';
      }
    }

    async function refresh() {
      try {
        const data = await fetchGas();
        if (!data.ok) return;

        const { state, question } = data;
        currentState = state;
        if (state.status === 'VOTING' && state.deadlineAt && Date.now() < Number(state.deadlineAt)) {
          expiredTriggered = false;
        }

        const isVoting = state.status === 'VOTING' && (!state.deadlineAt || Date.now() < Number(state.deadlineAt));
        const savedChoice = getVotedChoice(question.id);

        document.getElementById('modeBadge').textContent =
          question.type === 'quiz' ? 'QUIZ / クイズ' : 'POLL / アンケート';
        document.getElementById('questionText').textContent = question.question;

        const area = document.getElementById('optionsArea');
        area.innerHTML = '';

        question.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'opt-btn' + (savedChoice === opt ? ' selected' : '');
          btn.textContent = opt;
          btn.disabled = !isVoting || isSubmitting;
          btn.onclick = () => submitVote(question.id, opt);
          area.appendChild(btn);
        });

        const msgEl = document.getElementById('statusMsg');
        if (!isVoting) {
          msgEl.innerHTML = '<span class="warn">現在、投票受付は停止中です。</span>';
        } else if (savedChoice) {
          msgEl.innerHTML = `<span class="ok">「${escapeHtml(savedChoice)}」で投票済みです（タップで変更可）。</span>`;
        } else {
          msgEl.textContent = '選択肢をタップして投票してください。';
        }

        renderCountdown();
      } catch (e) {
        console.error(e);
      }
    }

    async function submitVote(questionId, choice) {
      if (isSubmitting) return;
      isSubmitting = true;
      const msgEl = document.getElementById('statusMsg');
      msgEl.textContent = '送信中...';

      try {
        const res = await postGas({
          action: 'vote',
          questionId,
          voterId,
          choice
        });
        if (res.ok) {
          setVotedChoice(questionId, choice);
          msgEl.innerHTML = `<span class="ok">投票完了：「${escapeHtml(choice)}」</span>`;
        } else {
          msgEl.innerHTML = `<span class="warn">${escapeHtml(res.error || '投票に失敗しました')}</span>`;
        }
      } catch (e) {
        msgEl.innerHTML = '<span class="warn">通信エラーが発生しました。</span>';
      } finally {
        isSubmitting = false;
        refresh();
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    initTheme();
    refresh();
    setInterval(refresh, CONFIG.POLL_INTERVAL_MS);
    setInterval(renderCountdown, 200);
  </script>
</body>
</html>
