<!DOCTYPE html>
<html lang="ja" data-theme="yellow">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配信投票・クイズ 回答ページ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root, [data-theme="yellow"] {
      --font-main: "M PLUS Rounded 1c", "Noto Sans JP", system-ui, sans-serif;
      --font-num: "Fredoka", "Noto Sans JP", sans-serif;
      --bg: #14120b;
      --card-bg: #1e1b11;
      --card-border: #facc15;
      --choice-bg: #2b2617;
      --choice-border: #856d14;
      --choice-hover-bg: #38311b;
      --choice-selected-bg: rgba(250, 204, 21, 0.22);
      --text: #fefce8;
      --muted: #fde047;
      --subtext: #e7dec0;
      --accent: #facc15;
      --accent-text: #181406;
      --accent-soft: rgba(250, 204, 21, 0.18);
      --ok: #4ade80;
      --correct-bg: rgba(74, 222, 128, 0.22);
      --warn: #fb923c;
      --track-bg: rgba(250, 204, 21, 0.2);
      --bar-grad: linear-gradient(90deg, #facc15, #f59e0b);
      --radius: 18px;
      --choice-radius: 12px;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.55), 0 0 22px rgba(250, 204, 21, 0.2);
    }

    [data-theme="dark"] {
      --font-main: "Noto Sans JP", system-ui, sans-serif;
      --font-num: "Noto Sans JP", sans-serif;
      --bg: #090d16;
      --card-bg: #121a2b;
      --card-border: #38bdf8;
      --choice-bg: #1a253b;
      --choice-border: #334155;
      --choice-hover-bg: #22314d;
      --choice-selected-bg: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --muted: #7dd3fc;
      --subtext: #cbd5e1;
      --accent: #38bdf8;
      --accent-text: #061322;
      --accent-soft: rgba(56, 189, 248, 0.18);
      --ok: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.22);
      --warn: #fbbf24;
      --track-bg: rgba(255, 255, 255, 0.14);
      --bar-grad: linear-gradient(90deg, #38bdf8, #818cf8);
      --radius: 18px;
      --choice-radius: 12px;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-main);
      padding: 18px 14px 36px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: grid;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: 20px 18px;
      box-shadow: var(--shadow);
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--muted);
      border: 1px solid var(--card-border);
    }

    .status-chip {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.14);
      color: var(--warn);
    }

    .status-chip.voting {
      background: rgba(74, 222, 128, 0.18);
      color: var(--ok);
    }

    .timer-box {
      font-family: var(--font-num);
      font-size: 15px;
      font-weight: 700;
      color: var(--warn);
      text-align: right;
      margin-bottom: 6px;
      min-height: 22px;
    }

    .q-title {
      margin: 0 0 16px;
      font-size: clamp(19px, 4.8vw, 24px);
      font-weight: 800;
      line-height: 1.4;
      color: var(--text);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .choices {
      display: grid;
      gap: 10px;
    }

    button.choice-btn {
      width: 100%;
      font-family: var(--font-main);
      font-size: 16px;
      font-weight: 800;
      text-align: left;
      padding: 14px 16px;
      border-radius: var(--choice-radius);
      background: var(--choice-bg);
      color: var(--text);
      border: 2px solid var(--choice-border);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.06s ease;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    button.choice-btn:hover:not(:disabled) {
      background: var(--choice-hover-bg);
      border-color: var(--accent);
    }

    button.choice-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    button.choice-btn.selected {
      background: var(--choice-selected-bg);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(250, 204, 21, 0.25);
    }

    button.choice-btn:disabled {
      opacity: 0.72;
      cursor: not-allowed;
    }

    .submit-btn {
      width: 100%;
      margin-top: 16px;
      font-family: var(--font-main);
      font-size: 16px;
      font-weight: 800;
      padding: 14px 18px;
      border-radius: var(--choice-radius);
      border: none;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(250, 204, 21, 0.28);
      transition: filter 0.15s ease, transform 0.06s ease, opacity 0.15s ease;
    }

    .submit-btn:hover:not(:disabled) {
      filter: brightness(1.06);
    }

    .submit-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .msg-box {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      min-height: 20px;
      text-align: center;
    }

    .result-row {
      background: var(--choice-bg);
      border: 1px solid var(--choice-border);
      border-radius: var(--choice-radius);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .result-row:last-child {
      margin-bottom: 0;
    }

    .result-row.correct {
      background: var(--correct-bg);
      border-color: var(--ok);
      box-shadow: inset 0 0 0 1.5px var(--ok);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .result-num {
      font-family: var(--font-num);
      color: var(--muted);
      white-space: nowrap;
    }

    .track {
      height: 10px;
      border-radius: 999px;
      background: var(--track-bg);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--bar-grad);
      transition: width 0.35s ease;
    }

    .waiting-box {
      text-align: center;
      padding: 24px 10px;
      color: var(--subtext);
      font-size: 15px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <main class="card">
      <div class="top-meta">
        <span id="modeBadge" class="badge">POLL / アンケート</span>
        <span id="statusChip" class="status-chip">待機中</span>
      </div>

      <div id="timerBox" class="timer-box"></div>
      <h1 id="qTitle" class="q-title">読み込み中...</h1>

      <div id="contentArea">
        <div class="waiting-box">配信の投票・クイズ開始をお待ちください</div>
      </div>

      <div id="msgBox" class="msg-box"></div>
    </main>
  </div>

  <script src="config.js"></script>
  <script>
    const ALLOWED_THEMES = ['dark', 'yellow', 'neon', 'pop', 'cyber', 'sakura', 'broadcast'];
    let currentState = { status: 'WAITING', questionId: '', deadlineAt: 0, resetSeq: 0, theme: 'yellow' };
    let currentQuestion = null;
    let selectedChoice = '';
    let isSubmitting = false;

    function applyTheme(state) {
      const params = new URLSearchParams(window.location.search);
      const qTheme = params.get('theme');
      const sTheme = state && typeof state.theme === 'string' ? state.theme.trim() : '';
      const theme = ALLOWED_THEMES.includes(sTheme)
        ? sTheme
        : (ALLOWED_THEMES.includes(qTheme) ? qTheme : 'yellow');
      document.documentElement.setAttribute('data-theme', theme);
    }

    function getVoteStorageKey(questionId, resetSeq) {
      return `poll_voted_${questionId || 'default'}_seq_${Number(resetSeq || 0)}`;
    }

    function hasAlreadyVoted(questionId, resetSeq) {
      try {
        return Boolean(localStorage.getItem(getVoteStorageKey(questionId, resetSeq)));
      } catch (e) {
        return false;
      }
    }

    function markVoted(questionId, resetSeq, choice) {
      try {
        localStorage.setItem(getVoteStorageKey(questionId, resetSeq), String(choice || '1'));
      } catch (e) {}
    }

    function updateTimer() {
      const el = document.getElementById('timerBox');
      if (!el) return;
      if (currentState.status === 'VOTING' && currentState.deadlineAt) {
        const rem = Math.max(0, Math.ceil((Number(currentState.deadlineAt) - Date.now()) / 1000));
        el.textContent = `残り ${rem}秒`;
      } else {
        el.textContent = '';
      }
    }

    function renderView(data) {
      const { state, question, results, totalVotes } = data;
      currentState = Object.assign({}, currentState, state || {});
      currentQuestion = question || null;
      applyTheme(currentState);

      const status = currentState.status || 'WAITING';
      const qId = (currentQuestion && currentQuestion.id) || currentState.questionId || 'q1';
      const resetSeq = Number(currentState.resetSeq || 0);
      const isQuiz = Boolean(currentQuestion && currentQuestion.type === 'quiz');
      const alreadyVoted = hasAlreadyVoted(qId, resetSeq);

      const badge = document.getElementById('modeBadge');
      badge.textContent = isQuiz ? 'QUIZ / クイズ' : 'POLL / アンケート';

      const chip = document.getElementById('statusChip');
      const statusTextMap = {
        WAITING: '待機中',
        VOTING: isQuiz ? '回答受付中' : '投票受付中',
        CLOSED: '受付終了',
        RESULT: '集計結果',
        ANSWER: '正解発表'
      };
      chip.textContent = statusTextMap[status] || status;
      chip.className = 'status-chip' + (status === 'VOTING' ? ' voting' : '');

      const titleEl = document.getElementById('qTitle');
      const areaEl = document.getElementById('contentArea');
      const msgEl = document.getElementById('msgBox');

      if (status === 'WAITING' || !currentQuestion) {
        titleEl.textContent = 'ただいま準備中です';
        areaEl.innerHTML = '<div class="waiting-box">次の出題が始まるまでお待ちください</div>';
        msgEl.textContent = '';
        updateTimer();
        return;
      }

      titleEl.textContent = currentQuestion.question;

      if (status === 'VOTING') {
        const choices = Array.isArray(currentQuestion.choices) && currentQuestion.choices.length
          ? currentQuestion.choices
          : (Array.isArray(currentQuestion.options) ? currentQuestion.options : []);

        if (alreadyVoted) {
          areaEl.innerHTML = `<div class="waiting-box">${isQuiz ? '回答を送信済みです。' : '投票を送信済みです。'}<br>結果発表をお待ちください。</div>`;
          msgEl.textContent = '送信完了';
          updateTimer();
          return;
        }

        if (!choices.includes(selectedChoice)) {
          selectedChoice = '';
        }

        areaEl.innerHTML = `
          <div id="choicesBox" class="choices">
            ${choices.map(c => `
              <button type="button" class="choice-btn ${selectedChoice === c ? 'selected' : ''}" data-choice="${escapeAttr(c)}">
                ${escapeHtml(c)}
              </button>
            `).join('')}
          </div>
          <button type="button" id="submitVoteBtn" class="submit-btn" ${(!selectedChoice || isSubmitting) ? 'disabled' : ''}>
            ${isQuiz ? '回答を送信する' : '投票を送信する'}
          </button>
        `;

        areaEl.querySelectorAll('.choice-btn').forEach(btn => {
          btn.onclick = () => {
            if (isSubmitting) return;
            selectedChoice = btn.getAttribute('data-choice') || '';
            areaEl.querySelectorAll('.choice-btn').forEach(b => {
              b.classList.toggle('selected', b.getAttribute('data-choice') === selectedChoice);
            });
            const subBtn = document.getElementById('submitVoteBtn');
            if (subBtn) subBtn.disabled = !selectedChoice;
          };
        });

        const subBtn = document.getElementById('submitVoteBtn');
        if (subBtn) {
          subBtn.onclick = () => submitVote(qId, resetSeq);
        }
        msgEl.textContent = selectedChoice ? `選択中: ${selectedChoice}` : '選択肢をタップしてください';
      } else {
        const showCounts = status === 'RESULT' || status === 'ANSWER' || status === 'CLOSED';
        const highlightAnswer = status === 'ANSWER' && isQuiz && currentQuestion.answer;
        const rows = Array.isArray(results) ? results : [];

        areaEl.innerHTML = `
          <div>
            ${rows.map(r => {
              const isCorrect = highlightAnswer && r.label === currentQuestion.answer;
              const pct = showCounts ? Number(r.pct || 0) : 0;
              const statText = showCounts ? `${Number(r.count || 0)}票 (${pct}%)` : '受付終了';
              return `
                <div class="result-row ${isCorrect ? 'correct' : ''}">
                  <div class="result-head">
                    <span>${escapeHtml(r.label)}${isCorrect ? ' ★正解' : ''}</span>
                    <span class="result-num">${statText}</span>
                  </div>
                  <div class="track">
                    <div class="fill" style="width:${pct}%;"></div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        msgEl.textContent = showCounts ? `合計 ${Number(totalVotes || 0)} 票` : 'ただいま受付を終了しています';
      }

      updateTimer();
    }

    async function submitVote(questionId, resetSeq) {
      if (!selectedChoice || isSubmitting) return;
      isSubmitting = true;
      const subBtn = document.getElementById('submitVoteBtn');
      const msgEl = document.getElementById('msgBox');
      if (subBtn) subBtn.disabled = true;
      if (msgEl) msgEl.textContent = '送信中...';

      try {
        const res = await fetchGas({
          action: 'vote',
          questionId,
          choice: selectedChoice
        });
        if (!res || !res.ok) {
          if (msgEl) msgEl.textContent = (res && res.error) ? res.error : '送信に失敗しました';
          isSubmitting = false;
          if (subBtn) subBtn.disabled = !selectedChoice;
          return;
        }
        markVoted(questionId, resetSeq, selectedChoice);
        selectedChoice = '';
        isSubmitting = false;
        await pollParticipant();
      } catch (e) {
        if (msgEl) msgEl.textContent = '通信エラーが発生しました';
        isSubmitting = false;
        if (subBtn) subBtn.disabled = !selectedChoice;
      }
    }

    async function pollParticipant() {
      try {
        const data = await fetchGas();
        if (data && data.ok) {
          renderView(data);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    applyTheme(currentState);
    pollParticipant();
    setInterval(pollParticipant, (typeof CONFIG !== 'undefined' && CONFIG.POLL_INTERVAL_MS) ? Number(CONFIG.POLL_INTERVAL_MS) : 2000);
    setInterval(updateTimer, 200);
  </script>
</body>
</html>
