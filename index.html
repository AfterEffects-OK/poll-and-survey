<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配信投票・クイズ 回答ページ</title>
  <link rel="icon" type="image/png" href="./OBS_poii_icon.png" />
  <link rel="shortcut icon" type="image/png" href="./OBS_poii_icon.png" />
  <link rel="apple-touch-icon" href="./OBS_poii_icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@500;700;800&family=Orbitron:wght@700&family=Oswald:wght@600&family=Share+Tech+Mono&family=Shippori+Mincho:wght@700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root, [data-theme="dark"] {
      --font-main: "Noto Sans JP", system-ui, sans-serif;
      --font-num: "Noto Sans JP", sans-serif;
      --bg: #0b1120;
      --card-bg: #141c2b;
      --card-border: #38bdf8;
      --item-bg: #1e293b;
      --item-border: #334155;
      --item-hover: #263449;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-text: #090d16;
      --accent-soft: rgba(56, 189, 248, 0.2);
      --ok: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.22);
      --ng: #ef4444;
      --ng-bg: rgba(239, 68, 68, 0.18);
      --timer: #fbbf24;
      --track-bg: rgba(255, 255, 255, 0.14);
      --bar-grad: linear-gradient(90deg, #38bdf8, #818cf8);
      --radius: 16px;
      --item-radius: 12px;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    [data-theme="yellow"] {
      --font-main: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
      --font-num: "Fredoka", "Noto Sans JP", sans-serif;
      --bg: #100e09;
      --card-bg: #1a1810;
      --card-border: #facc15;
      --item-bg: #292518;
      --item-border: #524826;
      --item-hover: #38321f;
      --text: #fefce8;
      --muted: #fde047;
      --accent: #facc15;
      --accent-text: #14120a;
      --accent-soft: rgba(250, 204, 21, 0.22);
      --ok: #4ade80;
      --correct-bg: rgba(74, 222, 128, 0.22);
      --ng: #f87171;
      --ng-bg: rgba(248, 113, 113, 0.18);
      --timer: #fb923c;
      --track-bg: rgba(250, 204, 21, 0.2);
      --bar-grad: linear-gradient(90deg, #facc15, #f59e0b);
      --radius: 16px;
      --item-radius: 12px;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.5), 0 0 18px rgba(250, 204, 21, 0.2);
    }

    [data-theme="neon"] {
      --font-main: "Dela Gothic One", "Noto Sans JP", sans-serif;
      --font-num: "Orbitron", sans-serif;
      --bg: #090712;
      --card-bg: #120e22;
      --card-border: #ec4899;
      --item-bg: #1e1736;
      --item-border: #701a75;
      --item-hover: #2c214f;
      --text: #fdf4ff;
      --muted: #e879f9;
      --accent: #22d3ee;
      --accent-text: #090712;
      --accent-soft: rgba(34, 211, 238, 0.22);
      --ok: #4ade80;
      --correct-bg: rgba(74, 222, 128, 0.22);
      --ng: #fb7185;
      --ng-bg: rgba(251, 113, 133, 0.2);
      --timer: #f472b6;
      --track-bg: rgba(236, 72, 153, 0.22);
      --bar-grad: linear-gradient(90deg, #22d3ee, #ec4899);
      --radius: 10px;
      --item-radius: 8px;
      --shadow: 0 0 26px rgba(236, 72, 153, 0.35);
    }

    [data-theme="pop"] {
      --font-main: "M PLUS Rounded 1c", sans-serif;
      --font-num: "Fredoka", "M PLUS Rounded 1c", sans-serif;
      --bg: #fef3c7;
      --card-bg: #fffbeb;
      --card-border: #1e293b;
      --item-bg: #ffffff;
      --item-border: #cbd5e1;
      --item-hover: #eff6ff;
      --text: #0f172a;
      --muted: #334155;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --accent-soft: rgba(37, 99, 235, 0.16);
      --ok: #16a34a;
      --correct-bg: rgba(22, 163, 74, 0.18);
      --ng: #dc2626;
      --ng-bg: rgba(220, 38, 38, 0.14);
      --timer: #ea580c;
      --track-bg: #e2e8f0;
      --bar-grad: linear-gradient(90deg, #3b82f6, #f59e0b);
      --radius: 22px;
      --item-radius: 14px;
      --shadow: 0 8px 0 #1e293b;
    }

    [data-theme="cyber"] {
      --font-main: "DotGothic16", monospace;
      --font-num: "Share Tech Mono", monospace;
      --bg: #03120d;
      --card-bg: #071d16;
      --card-border: #10b981;
      --item-bg: #0d2e23;
      --item-border: #059669;
      --item-hover: #134233;
      --text: #ecfdf5;
      --muted: #6ee7b7;
      --accent: #34d399;
      --accent-text: #03120d;
      --accent-soft: rgba(52, 211, 153, 0.22);
      --ok: #a3e635;
      --correct-bg: rgba(163, 230, 53, 0.22);
      --ng: #f87171;
      --ng-bg: rgba(248, 113, 113, 0.18);
      --timer: #2dd4bf;
      --track-bg: rgba(16, 185, 129, 0.22);
      --bar-grad: linear-gradient(90deg, #10b981, #a3e635);
      --radius: 8px;
      --item-radius: 6px;
      --shadow: 0 0 22px rgba(16, 185, 129, 0.3);
    }

    [data-theme="cyber"] .card {
      background-image:
        linear-gradient(to right, rgba(16, 185, 129, 0.11) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 185, 129, 0.11) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    [data-theme="sakura"] {
      --font-main: "Zen Maru Gothic", sans-serif;
      --font-num: "Zen Maru Gothic", sans-serif;
      --bg: #ffe4e6;
      --card-bg: #fff8fa;
      --card-border: #fb7185;
      --item-bg: #ffe4e6;
      --item-border: #fda4af;
      --item-hover: #fecdd3;
      --text: #3f1d28;
      --muted: #881337;
      --accent: #e11d48;
      --accent-text: #ffffff;
      --accent-soft: rgba(225, 29, 72, 0.15);
      --ok: #059669;
      --correct-bg: rgba(5, 150, 105, 0.18);
      --ng: #be123c;
      --ng-bg: rgba(190, 18, 60, 0.14);
      --timer: #db2777;
      --track-bg: #fecdd3;
      --bar-grad: linear-gradient(90deg, #fb7185, #f472b6);
      --radius: 50px;
      --item-radius: 50px;
      --shadow: 0 12px 28px rgba(244, 114, 182, 0.25);
    }

    [data-theme="broadcast"] {
      --font-main: "Shippori Mincho", serif;
      --font-num: "Oswald", sans-serif;
      --bg: #060b19;
      --card-bg: #0d1733;
      --card-border: #ef4444;
      --item-bg: #172754;
      --item-border: #3b528f;
      --item-hover: #213775;
      --text: #ffffff;
      --muted: #e2e8f0;
      --accent: #ef4444;
      --accent-text: #ffffff;
      --accent-soft: rgba(239, 68, 68, 0.24);
      --ok: #38bdf8;
      --correct-bg: rgba(56, 189, 248, 0.24);
      --ng: #fca5a5;
      --ng-bg: rgba(239, 68, 68, 0.2);
      --timer: #fde047;
      --track-bg: rgba(255, 255, 255, 0.18);
      --bar-grad: linear-gradient(90deg, #ef4444, #f97316);
      --radius: 10px;
      --item-radius: 8px;
      --shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px 22px;
      box-shadow: var(--shadow);
      transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    /* アンケート・クイズタグ直上の配信者別ヘッダ画像 */
    .streamer-header-banner {
      display: none;
      width: 100%;
      height: 68px;
      margin-bottom: 12px;
      border-radius: min(var(--item-radius), 14px);
      overflow: hidden;
      border: 1.5px solid var(--item-border);
      background: var(--item-bg);
    }

    .streamer-header-banner.is-visible {
      display: block;
    }

    .streamer-header-banner img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .timer-txt {
      font-family: var(--font-num);
      font-size: 18px;
      font-weight: 800;
      color: var(--timer);
    }

    .q-title {
      margin: 0 0 18px;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.4;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .waiting-box {
      text-align: center;
      padding: 36px 16px;
    }

    .waiting-title {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
    }

    .waiting-sub {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ルームID入力フォーム */
    .room-prompt-box {
      display: grid;
      gap: 12px;
      padding: 8px 0 4px;
    }

    .room-prompt-input {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      background: var(--item-bg);
      border: 2px solid var(--item-border);
      border-radius: var(--item-radius);
      padding: 13px 14px;
      outline: none;
    }

    .room-prompt-input:focus {
      border-color: var(--accent);
    }

    .room-prompt-btn {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: var(--item-radius);
      padding: 14px 16px;
      cursor: pointer;
    }

    .room-prompt-error {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--ng);
      text-align: center;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    button.choice-btn {
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
      background: var(--item-bg);
      border: 2px solid var(--item-border);
      border-radius: var(--item-radius);
      padding: 15px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button.choice-btn:hover:not(:disabled) {
      background: var(--item-hover);
      border-color: var(--accent);
    }

    button.choice-btn:active:not(:disabled) {
      transform: scale(0.99);
    }

    button.choice-btn:disabled {
      cursor: default;
    }

    button.choice-btn.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .choice-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .results {
      display: grid;
      gap: 10px;
    }

    .result-row {
      background: var(--item-bg);
      border: 2px solid var(--item-border);
      border-radius: var(--item-radius);
      padding: 12px 14px;
    }

    .result-row.correct {
      background: var(--correct-bg);
      border-color: var(--ok);
    }

    .result-row.wrong-pick {
      background: var(--ng-bg);
      border-color: var(--ng);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .result-label {
      flex: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .result-stat {
      font-family: var(--font-num);
      font-size: 14px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .track {
      width: 100%;
      height: 11px;
      background: var(--track-bg);
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: var(--target-pct, 0%);
      border-radius: 999px;
      background: var(--bar-grad);
      transition: width 0.35s ease;
    }

    @keyframes barSmooth {
      0% {
        width: 0%;
      }
      100% {
        width: var(--target-pct, 0%);
      }
    }

    @keyframes barBounce {
      0% {
        width: 0%;
      }
      58% {
        width: calc(min(100%, var(--target-pct, 0%) * 1.18 + 3%));
      }
      78% {
        width: calc(max(0%, var(--target-pct, 0%) * 0.92));
      }
      90% {
        width: calc(min(100%, var(--target-pct, 0%) * 1.04));
      }
      100% {
        width: var(--target-pct, 0%);
      }
    }

    .fill.bounce {
      width: 0%;
      animation: barSmooth 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    [data-theme="pop"] .fill.bounce,
    [data-theme="sakura"] .fill.bounce {
      animation: barBounce 0.78s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .notice-banner {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--item-radius);
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .notice-banner.ok {
      background: var(--correct-bg);
      border-color: var(--ok);
      color: var(--ok);
    }

    .notice-banner.ng {
      background: var(--ng-bg);
      border-color: var(--ng);
      color: var(--ng);
    }

    .footer-meta {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <main id="appCard" class="card">
      <div class="waiting-box">
        <p class="waiting-title">読み込み中...</p>
        <p class="waiting-sub">配信画面と接続しています</p>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script>
    const ADMIN_ID = typeof getAdminId === 'function' ? getAdminId() : 'default';
    const ALLOWED_THEMES = ['dark', 'yellow', 'neon', 'pop', 'cyber', 'sakura', 'broadcast'];

    function isTrailingRoomParam() {
      const search = window.location.search || '';
      const params = new URLSearchParams(search);
      const hasRoomKey = params.has('room');
      const roomVal = (params.get('room') || '').trim();
      return /(?:\?|&)room=$/.test(search) || (hasRoomKey && roomVal === '');
    }

    function resolveInitialRoomId() {
      if (isTrailingRoomParam()) {
        return '';
      }
      const params = new URLSearchParams(window.location.search);
      const paramRoom = (params.get('room') || '').trim();
      if (paramRoom) return paramRoom;
      if (typeof getRoomId === 'function') {
        return String(getRoomId() || '').trim();
      }
      return 'default';
    }

    let ROOM_ID = resolveInitialRoomId();
    let needsRoomInput = !ROOM_ID;

    let currentState = {
      status: 'WAITING',
      deadlineAt: 0,
      theme: 'dark',
      resetSeq: 0,
      resetQuestionId: '',
      headerImage: ''
    };
    let latestData = null;
    let lastResultSignature = '';
    let isSubmitting = false;

    function renderRoomPrompt(errorMsg = '') {
      const card = document.getElementById('appCard');
      if (!card) return;
      card.innerHTML = `
        <div class="waiting-box" style="padding: 16px 8px;">
          <p class="waiting-title">ルームIDを入力してください</p>
          <p class="waiting-sub" style="margin-bottom: 16px;">配信者から案内されたルームIDを入力して参加します</p>
          <form class="room-prompt-box" onsubmit="handleRoomIdSubmit(event)">
            <input
              id="roomIdPromptInput"
              class="room-prompt-input"
              type="text"
              placeholder="例: 49417815"
              autocomplete="off"
              required
            />
            <button type="submit" class="room-prompt-btn">このルームに参加する</button>
            ${errorMsg ? `<p class="room-prompt-error">${escapeHtml(errorMsg)}</p>` : ''}
          </form>
        </div>
      `;
      const input = document.getElementById('roomIdPromptInput');
      if (input) input.focus();
    }

    function handleRoomIdSubmit(event) {
      event.preventDefault();
      const input = document.getElementById('roomIdPromptInput');
      const raw = input ? input.value : '';
      const cleaned = String(raw || '').trim().replace(/[^a-zA-Z0-9_@-]/g, '');
      if (!cleaned) {
        renderRoomPrompt('有効なルームIDを入力してください。');
        return;
      }

      ROOM_ID = cleaned;
      needsRoomInput = false;

      try {
        const url = new URL(window.location.href);
        url.searchParams.set('room', ROOM_ID);
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}

      pollState();
    }

    function getStateHeaderImage(state) {
      if (!state) return '';
      return String(state.headerImage || state.header_image || '').trim();
    }

    function resolveStreamerHeaderUrl(adminId, state = currentState) {
      const stateUrl = getStateHeaderImage(state);
      if (stateUrl) {
        return stateUrl;
      }

      const id = String(adminId || '').trim();
      if (!id) return '';

      if (typeof CONFIG !== 'undefined' && CONFIG.STREAMER_HEADER_BANNERS && CONFIG.STREAMER_HEADER_BANNERS[id]) {
        return CONFIG.STREAMER_HEADER_BANNERS[id];
      }
      if (typeof STREAMER_HEADER_BANNERS !== 'undefined' && STREAMER_HEADER_BANNERS[id]) {
        return STREAMER_HEADER_BANNERS[id];
      }

      return `./headers/${encodeURIComponent(id)}.png`;
    }

    function buildStreamerHeaderHtml(adminId, state = currentState) {
      const url = resolveStreamerHeaderUrl(adminId, state);
      if (!url) return '';
      return `
        <div id="streamerHeaderBanner" class="streamer-header-banner" aria-hidden="true">
          <img id="streamerHeaderImg" src="${escapeAttr(url)}" alt="" />
        </div>
      `;
    }

    function syncStreamerHeaderVisibility(adminId, state = currentState) {
      const banner = document.getElementById('streamerHeaderBanner');
      const img = document.getElementById('streamerHeaderImg');
      if (!banner || !img) return;

      const url = resolveStreamerHeaderUrl(adminId, state);
      if (!url) {
        banner.classList.remove('is-visible');
        banner.setAttribute('aria-hidden', 'true');
        return;
      }

      img.onload = () => {
        banner.classList.add('is-visible');
        banner.setAttribute('aria-hidden', 'false');
      };

      img.onerror = () => {
        banner.classList.remove('is-visible');
        banner.setAttribute('aria-hidden', 'true');
      };

      const escapedUrl = escapeAttr(url);
      if (img.getAttribute('src') !== escapedUrl) {
        img.setAttribute('src', escapedUrl);
      }

      if (img.complete) {
        if (img.naturalWidth > 0) {
          banner.classList.add('is-visible');
          banner.setAttribute('aria-hidden', 'false');
        } else {
          banner.classList.remove('is-visible');
          banner.setAttribute('aria-hidden', 'true');
        }
      }
    }

    function getClientId() {
      const key = 'stream_poll_client_id';
      let id = localStorage.getItem(key);
      if (!id) {
        id = 'u_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        localStorage.setItem(key, id);
      }
      return id;
    }

    function getChoiceStorageKey(questionId) {
      return `stream_poll_choice::${ROOM_ID}::${questionId}`;
    }

    function getSavedChoice(questionId) {
      return localStorage.getItem(getChoiceStorageKey(questionId)) || '';
    }

    function setSavedChoice(questionId, option) {
      const key = getChoiceStorageKey(questionId);
      if (option) {
        localStorage.setItem(key, option);
      } else {
        localStorage.removeItem(key);
      }
    }

    function syncResetSeq(state) {
      if (!state) return;
      const seqKey = `stream_poll_reset_seq::${ROOM_ID}`;
      const prevSeq = Number(localStorage.getItem(seqKey) || '0') || 0;
      const nextSeq = Number(state.resetSeq || 0) || 0;
      if (nextSeq > prevSeq) {
        if (state.resetQuestionId) {
          setSavedChoice(state.resetQuestionId, '');
        }
        localStorage.setItem(seqKey, String(nextSeq));
      }
    }

    function applyTheme(state) {
      const params = new URLSearchParams(window.location.search);
      const theme = (state && ALLOWED_THEMES.includes(state.theme))
        ? state.theme
        : (ALLOWED_THEMES.includes(params.get('theme')) ? params.get('theme') : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    }

    function updateCountdown() {
      const el = document.getElementById('timerDisplay');
      if (!el) return;
      if (currentState.status === 'VOTING' && currentState.deadlineAt) {
        const sec = Math.max(0, Math.ceil((Number(currentState.deadlineAt) - Date.now()) / 1000));
        el.textContent = `残り ${sec}秒`;
      } else {
        el.textContent = '';
      }
    }

    async function submitVote(questionId, option) {
      if (isSubmitting || needsRoomInput || !ROOM_ID) return;
      isSubmitting = true;
      setSavedChoice(questionId, option);
      await pollState();

      try {
        const res = await postGas({
          action: 'vote',
          roomId: ROOM_ID,
          adminId: ADMIN_ID,
          questionId,
          option,
          clientId: getClientId()
        });
        if (!res.ok && res.error) {
          alert(res.error);
        }
      } catch (e) {
        console.error(e);
      } finally {
        isSubmitting = false;
        await pollState();
      }
    }

    async function pollState() {
      if (needsRoomInput || !ROOM_ID) {
        renderRoomPrompt();
        return;
      }

      try {
        const data = await fetchGas({ roomId: ROOM_ID, adminId: ADMIN_ID });
        if (!data.ok) return;

        latestData = data;
        const effectiveAdminId = (data && data.adminId) ? data.adminId : ADMIN_ID;
        const { state, question, totalVotes, results } = data;
        currentState = state || {
          status: 'WAITING',
          deadlineAt: 0,
          theme: 'dark',
          resetSeq: 0,
          resetQuestionId: '',
          headerImage: ''
        };
        syncResetSeq(currentState);
        applyTheme(currentState);

        const card = document.getElementById('appCard');
        const headerHtml = buildStreamerHeaderHtml(effectiveAdminId, currentState);

        if (!state || state.status === 'WAITING' || !question) {
          lastResultSignature = '';
          card.innerHTML = `
            <div class="waiting-box">
              <p class="waiting-title">次のアンケート・クイズを待機中です</p>
              <p class="waiting-sub">配信枠: ${escapeHtml(ROOM_ID)} ／ 配信者の操作で自動的に画面が切り替わります</p>
            </div>
          `;
          return;
        }

        const isQuiz = question.type === 'quiz';
        const myChoice = getSavedChoice(question.id);
        const tagText = isQuiz ? 'QUIZ / クイズ' : 'POLL / アンケート';

        if (state.status === 'VOTING') {
          lastResultSignature = '';
          const choicesHtml = (question.options || []).map(opt => {
            const isSelected = myChoice === opt;
            return `
              <button
                type="button"
                class="choice-btn ${isSelected ? 'selected' : ''}"
                onclick="submitVote('${escapeAttr(question.id)}', '${escapeAttr(opt)}')"
                ${isSubmitting ? 'disabled' : ''}
              >
                <span>${escapeHtml(opt)}</span>
                ${isSelected ? '<span class="choice-badge">選択中</span>' : ''}
              </button>
            `;
          }).join('');

          const noticeHtml = myChoice
            ? `<div class="notice-banner">「${escapeHtml(myChoice)}」で${isQuiz ? '回答' : '投票'}済みです（タップで変更できます）</div>`
            : `<div class="notice-banner">選択肢をタップして${isQuiz ? '回答' : '投票'}してください</div>`;

          card.innerHTML = `
            ${headerHtml}
            <div class="top-bar">
              <span class="tag">${tagText}</span>
              <span id="timerDisplay" class="timer-txt"></span>
            </div>
            <h1 class="q-title">${escapeHtml(question.question)}</h1>
            <div class="choices">${choicesHtml}</div>
            ${noticeHtml}
            <div class="footer-meta">
              <span>${isQuiz ? '回答受付中' : '投票受付中'} (${escapeHtml(ROOM_ID)})</span>
              <span>現在の総票数: ${Number(totalVotes || 0)}票</span>
            </div>
          `;
          syncStreamerHeaderVisibility(effectiveAdminId, currentState);
          updateCountdown();
          return;
        }

        if (state.status === 'CLOSED') {
          lastResultSignature = '';
          card.innerHTML = `
            ${headerHtml}
            <div class="top-bar">
              <span class="tag">${tagText}</span>
              <span class="timer-txt"></span>
            </div>
            <h1 class="q-title">${escapeHtml(question.question)}</h1>
            <div class="waiting-box">
              <p class="waiting-title">${isQuiz ? '回答受付は終了しました' : '投票受付は終了しました'}</p>
              <p class="waiting-sub">結果発表をお待ちください</p>
            </div>
            <div class="footer-meta">
              <span>受付終了</span>
              <span>${myChoice ? `あなたの選択: ${escapeHtml(myChoice)}` : '未回答'}</span>
            </div>
          `;
          syncStreamerHeaderVisibility(effectiveAdminId, currentState);
          return;
        }

        // RESULT / ANSWER 画面
        const resultSig = `${question.id || ''}::${state.status}`;
        const shouldBounce = lastResultSignature !== resultSig;
        lastResultSignature = resultSig;

        const isAnswerMode = state.status === 'ANSWER' && isQuiz && question.answer;
        const rowsHtml = (results || []).map((r, idx) => {
          const isCorrect = isAnswerMode && r.label === question.answer;
          const isMyPick = myChoice === r.label;
          const isWrongPick = isAnswerMode && isMyPick && !isCorrect;
          const pct = Math.max(0, Math.min(100, Number(r.pct || 0)));

          let badges = '';
          if (isCorrect) badges += ' ★正解';
          if (isMyPick) badges += '（あなたの回答）';

          const delayMs = 1000 + Math.min(idx * 70, 350);
          const delayStyle = shouldBounce ? `animation-delay: ${delayMs}ms;` : '';
          const bounceClass = shouldBounce ? 'bounce' : '';

          return `
            <div class="result-row ${isCorrect ? 'correct' : ''} ${isWrongPick ? 'wrong-pick' : ''}">
              <div class="result-head">
                <span class="result-label">${escapeHtml(r.label)}${badges}</span>
                <span class="result-stat">${r.count}票 (${pct}%)</span>
              </div>
              <div class="track">
                <div class="fill ${bounceClass}" style="--target-pct: ${pct}%; ${delayStyle}"></div>
              </div>
            </div>
          `;
        }).join('');

        let bottomNotice = '';
        if (isAnswerMode && myChoice) {
          if (myChoice === question.answer) {
            bottomNotice = `<div class="notice-banner ok">正解おめでとうございます！</div>`;
          } else {
            bottomNotice = `<div class="notice-banner ng">残念！正解は「${escapeHtml(question.answer)}」でした</div>`;
          }
        }

        const stateLabelMap = {
          RESULT: '集計結果',
          ANSWER: '正解発表'
        };

        card.innerHTML = `
          ${headerHtml}
          <div class="top-bar">
            <span class="tag">${tagText}</span>
            <span class="timer-txt"></span>
          </div>
          <h1 class="q-title">${escapeHtml(question.question)}</h1>
          <div class="results">${rowsHtml}</div>
          ${bottomNotice}
          <div class="footer-meta">
            <span>${stateLabelMap[state.status] || state.status}</span>
            <span>合計 ${Number(totalVotes || 0)} 票</span>
          </div>
        `;
        syncStreamerHeaderVisibility(effectiveAdminId, currentState);
      } catch (e) {
        console.error(e);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeAttr(str) {
      return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '&quot;');
    }

    applyTheme(currentState);
    pollState();
    setInterval(pollState, CONFIG.POLL_INTERVAL_MS);
    setInterval(updateCountdown, 200);
  </script>
</body>
</html>
