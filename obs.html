<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@700;800&family=Orbitron:wght@700;800&family=Oswald:wght@600;700&family=Share+Tech+Mono&family=Shippori+Mincho:wght@700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root, [data-theme="dark"] {
      --font-main: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
      --font-num: "Noto Sans JP", sans-serif;
      --title-weight: 800;
      --letter-spacing: 0.02em;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --panel-border: rgba(56, 189, 248, 0.45);
      --panel-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      --panel-radius: 20px;
      --text: #ffffff;
      --muted: #cbd5e1;
      --sub-muted: #94a3b8;
      --accent: #38bdf8;
      --timer: #fbbf24;
      --track-bg: rgba(255, 255, 255, 0.14);
      --bar-grad: linear-gradient(90deg, #38bdf8, #818cf8);
      --correct-bg: rgba(16, 185, 129, 0.25);
      --correct-ring: #34d399;
      --correct-grad: linear-gradient(90deg, #10b981, #34d399);
      --divider: rgba(255, 255, 255, 0.15);
    }

    [data-theme="neon"] {
      --font-main: "Dela Gothic One", "Noto Sans JP", sans-serif;
      --font-num: "Orbitron", "Dela Gothic One", sans-serif;
      --title-weight: 400;
      --letter-spacing: 0.04em;
      --panel-bg: rgba(12, 12, 20, 0.92);
      --panel-border: #ec4899;
      --panel-shadow: 0 0 32px rgba(236, 72, 153, 0.45);
      --panel-radius: 6px;
      --text: #fdf4ff;
      --muted: #e9d5ff;
      --sub-muted: #c084fc;
      --accent: #22d3ee;
      --timer: #f472b6;
      --track-bg: rgba(236, 72, 153, 0.18);
      --bar-grad: linear-gradient(90deg, #22d3ee, #ec4899);
      --correct-bg: rgba(74, 222, 128, 0.22);
      --correct-ring: #4ade80;
      --correct-grad: linear-gradient(90deg, #22c55e, #4ade80);
      --divider: rgba(236, 72, 153, 0.35);
    }

    [data-theme="pop"] {
      --font-main: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
      --font-num: "Fredoka", "M PLUS Rounded 1c", sans-serif;
      --title-weight: 800;
      --letter-spacing: 0.02em;
      --panel-bg: rgba(255, 255, 255, 0.96);
      --panel-border: #1e293b;
      --panel-shadow: 0 10px 0 #1e293b;
      --panel-radius: 24px;
      --text: #0f172a;
      --muted: #334155;
      --sub-muted: #64748b;
      --accent: #2563eb;
      --timer: #ea580c;
      --track-bg: #e2e8f0;
      --bar-grad: linear-gradient(90deg, #3b82f6, #f59e0b);
      --correct-bg: rgba(34, 197, 94, 0.18);
      --correct-ring: #16a34a;
      --correct-grad: linear-gradient(90deg, #16a34a, #4ade80);
      --divider: #cbd5e1;
    }

    [data-theme="cyber"] {
      --font-main: "DotGothic16", monospace;
      --font-num: "Share Tech Mono", "DotGothic16", monospace;
      --title-weight: 400;
      --letter-spacing: 0.06em;
      --panel-bg: rgba(7, 25, 18, 0.92);
      --panel-border: #10b981;
      --panel-shadow: 0 0 28px rgba(16, 185, 129, 0.38);
      --panel-radius: 4px;
      --text: #ecfdf5;
      --muted: #a7f3d0;
      --sub-muted: #6ee7b7;
      --accent: #34d399;
      --timer: #2dd4bf;
      --track-bg: rgba(16, 185, 129, 0.18);
      --bar-grad: linear-gradient(90deg, #10b981, #a3e635);
      --correct-bg: rgba(163, 230, 53, 0.22);
      --correct-ring: #a3e635;
      --correct-grad: linear-gradient(90deg, #84cc16, #bef264);
      --divider: rgba(16, 185, 129, 0.35);
    }

    [data-theme="sakura"] {
      --font-main: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
      --font-num: "Zen Maru Gothic", sans-serif;
      --title-weight: 900;
      --letter-spacing: 0.03em;
      --panel-bg: rgba(255, 250, 251, 0.96);
      --panel-border: #fb7185;
      --panel-shadow: 0 14px 36px rgba(244, 114, 182, 0.28);
      --panel-radius: 26px;
      --text: #3f1d28;
      --muted: #881337;
      --sub-muted: #be123c;
      --accent: #e11d48;
      --timer: #db2777;
      --track-bg: #ffe4e6;
      --bar-grad: linear-gradient(90deg, #fb7185, #f472b6);
      --correct-bg: rgba(16, 185, 129, 0.16);
      --correct-ring: #059669;
      --correct-grad: linear-gradient(90deg, #059669, #34d399);
      --divider: #fecdd3;
    }

    [data-theme="broadcast"] {
      --font-main: "Shippori Mincho", "Hiragino Mincho ProN", serif;
      --font-num: "Oswald", "Shippori Mincho", sans-serif;
      --title-weight: 800;
      --letter-spacing: 0.04em;
      --panel-bg: rgba(19, 34, 71, 0.94);
      --panel-border: #ef4444;
      --panel-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      --panel-radius: 8px;
      --text: #ffffff;
      --muted: #e2e8f0;
      --sub-muted: #94a3b8;
      --accent: #f87171;
      --timer: #fde047;
      --track-bg: rgba(255, 255, 255, 0.16);
      --bar-grad: linear-gradient(90deg, #ef4444, #f97316);
      --correct-bg: rgba(56, 189, 248, 0.22);
      --correct-ring: #38bdf8;
      --correct-grad: linear-gradient(90deg, #0284c7, #38bdf8);
      --divider: rgba(239, 68, 68, 0.45);
    }

    html, body {
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: var(--font-main);
      letter-spacing: var(--letter-spacing);
    }
    .overlay-wrap {
      position: fixed;
      right: 48px;
      bottom: 48px;
      width: 620px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      border: 2px solid var(--panel-border);
      border-radius: var(--panel-radius);
      padding: 24px 28px;
      color: var(--text);
      box-shadow: var(--panel-shadow);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    /* 表示位置バリアント（全7種） */
    .overlay-wrap.pos-bottom-right {
      right: 48px;
      bottom: 48px;
      left: auto;
      top: auto;
      transform: translateY(20px);
    }
    .overlay-wrap.pos-bottom-left {
      left: 48px;
      bottom: 48px;
      right: auto;
      top: auto;
      transform: translateY(20px);
    }
    .overlay-wrap.pos-bottom-center {
      left: 50%;
      bottom: 48px;
      right: auto;
      top: auto;
      transform: translate(-50%, 20px);
    }
    .overlay-wrap.pos-top-right {
      right: 48px;
      top: 48px;
      left: auto;
      bottom: auto;
      transform: translateY(-20px);
    }
    .overlay-wrap.pos-top-left {
      left: 48px;
      top: 48px;
      right: auto;
      bottom: auto;
      transform: translateY(-20px);
    }
    .overlay-wrap.pos-top-center {
      left: 50%;
      top: 48px;
      right: auto;
      bottom: auto;
      transform: translate(-50%, -20px);
    }
    .overlay-wrap.pos-center {
      left: 50%;
      top: 50%;
      right: auto;
      bottom: auto;
      transform: translate(-50%, calc(-50% + 20px));
    }

    /* 表示状態（visible） */
    .overlay-wrap.pos-bottom-right.visible,
    .overlay-wrap.pos-bottom-left.visible,
    .overlay-wrap.pos-top-right.visible,
    .overlay-wrap.pos-top-left.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .overlay-wrap.pos-bottom-center.visible,
    .overlay-wrap.pos-top-center.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .overlay-wrap.pos-center.visible {
      opacity: 1;
      transform: translate(-50%, -50%);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .status-pill {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 4px 12px;
      border-radius: 999px;
      background: #0284c7;
      color: #fff;
    }
    .status-pill.voting { background: #10b981; }
    .status-pill.closed { background: #f59e0b; }
    .status-pill.answer { background: #ec4899; }
    .right-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-num);
    }
    .timer-badge {
      font-size: 17px;
      font-weight: 800;
      color: var(--timer);
    }
    .total-label {
      font-size: 15px;
      color: var(--muted);
      font-weight: 700;
    }
    .q-title {
      font-size: 24px;
      font-weight: var(--title-weight);
      line-height: 1.35;
      margin-bottom: 18px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
    .row {
      margin-bottom: 14px;
      padding: 8px 10px;
      border-radius: 12px;
      transition: background 0.25s ease;
    }
    .row.correct {
      background: var(--correct-bg);
      box-shadow: inset 0 0 0 2px var(--correct-ring);
    }
    .row-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 18px;
      font-weight: var(--title-weight);
      margin-bottom: 6px;
    }
    .row-stat {
      font-family: var(--font-num);
      font-weight: 700;
    }
    .track {
      width: 100%;
      height: 18px;
      background: var(--track-bg);
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: var(--bar-grad);
      transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .row.correct .fill {
      background: var(--correct-grad);
    }
    .qr-box {
      display: none;
      align-items: center;
      gap: 14px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--divider);
    }
    .qr-box.active {
      display: flex;
    }
    .qr-canvas {
      background: #ffffff;
      padding: 6px;
      border-radius: 8px;
      line-height: 0;
      flex-shrink: 0;
    }
    .qr-text {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .qr-text strong {
      color: var(--accent);
      font-size: 15px;
    }
    .qr-url {
      font-family: var(--font-num);
      font-size: 12px;
      color: var(--sub-muted);
      word-break: break-all;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div id="overlay" class="overlay-wrap pos-bottom-right">
    <div class="top-bar">
      <span id="statusPill" class="status-pill">STANDBY</span>
      <div class="right-meta">
        <span id="timerBadge" class="timer-badge"></span>
        <span id="totalLabel" class="total-label">0票</span>
      </div>
    </div>
    <div id="qTitle" class="q-title"></div>
    <div id="bars"></div>
    <div id="qrBox" class="qr-box">
      <div id="qrCodeCanvas" class="qr-canvas"></div>
      <div class="qr-text">
        <strong>スマホで投票・回答</strong><br>
        QRコードを読み取ってアクセス
        <div id="qrUrlLabel" class="qr-url"></div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const ALLOWED_THEMES = ['dark', 'neon', 'pop', 'cyber', 'sakura', 'broadcast'];
    const ALLOWED_POSITIONS = [
      'bottom-right',
      'bottom-left',
      'bottom-center',
      'top-right',
      'top-left',
      'top-center',
      'center'
    ];

    const STATUS_TEXT = {
      VOTING: '投票受付中',
      CLOSED: '受付終了',
      RESULT: '集計結果',
      ANSWER: '正解発表'
    };

    let currentState = { status: 'WAITING', deadlineAt: 0, theme: 'dark', position: 'bottom-right' };
    let expiredTriggered = false;

    function applyObsAppearance(state) {
      const params = new URLSearchParams(window.location.search);
      const fallbackTheme = ALLOWED_THEMES.includes(params.get('theme')) ? params.get('theme') : 'dark';
      const fallbackPos = ALLOWED_POSITIONS.includes(params.get('pos')) ? params.get('pos') : 'bottom-right';

      const theme = state && ALLOWED_THEMES.includes(state.theme) ? state.theme : fallbackTheme;
      const position = state && ALLOWED_POSITIONS.includes(state.position) ? state.position : fallbackPos;

      document.documentElement.setAttribute('data-theme', theme);

      const overlay = document.getElementById('overlay');
      if (overlay) {
        ALLOWED_POSITIONS.forEach(p => overlay.classList.remove('pos-' + p));
        overlay.classList.add('pos-' + position);
      }
    }

    (function initQrCode() {
      const voterUrl = new URL('./index.html', window.location.href).href;
      const labelEl = document.getElementById('qrUrlLabel');
      if (labelEl) labelEl.textContent = voterUrl;

      const target = document.getElementById('qrCodeCanvas');
      if (target && typeof QRCode !== 'undefined') {
        new QRCode(target, {
          text: voterUrl,
          width: 76,
          height: 76,
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    })();

    function renderCountdown() {
      const el = document.getElementById('timerBadge');
      const qrBox = document.getElementById('qrBox');
      if (!el) return;

      if (currentState.status === 'VOTING' && currentState.deadlineAt) {
        const remainSec = Math.max(0, Math.ceil((Number(currentState.deadlineAt) - Date.now()) / 1000));
        el.textContent = `残り ${remainSec}秒`;
        if (remainSec === 0 && !expiredTriggered) {
          expiredTriggered = true;
          if (qrBox) qrBox.classList.remove('active');
          setTimeout(updateOverlay, 400);
        }
      } else {
        el.textContent = '';
      }
    }

    async function updateOverlay() {
      try {
        const data = await fetchGas();
        if (!data.ok) return;

        const overlay = document.getElementById('overlay');
        const qrBox = document.getElementById('qrBox');
        const { state, question, totalVotes, results } = data;

        currentState = state;
        applyObsAppearance(state);

        if (state.status === 'VOTING' && state.deadlineAt && Date.now() < Number(state.deadlineAt)) {
          expiredTriggered = false;
        }

        if (state.status === 'WAITING') {
          overlay.classList.remove('visible');
          if (qrBox) qrBox.classList.remove('active');
          return;
        }

        overlay.classList.add('visible');
        if (qrBox) {
          qrBox.classList.toggle('active', state.status === 'VOTING');
        }

        const pill = document.getElementById('statusPill');
        pill.textContent = STATUS_TEXT[state.status] || state.status;
        pill.className = 'status-pill ' + state.status.toLowerCase();

        document.getElementById('totalLabel').textContent = `合計 ${totalVotes} 票`;
        document.getElementById('qTitle').textContent = question.question;

        const hideCounts = state.status === 'VOTING' && question.type === 'quiz';
        const showAnswer = state.status === 'ANSWER' && question.type === 'quiz' && question.answer;

        const barsEl = document.getElementById('bars');
        barsEl.innerHTML = results.map(r => {
          const isCorrect = showAnswer && r.label === question.answer;
          const widthPct = hideCounts ? 0 : r.pct;
          const statText = hideCounts ? '???' : `${r.count}票 (${r.pct}%)`;
          return `
            <div class="row ${isCorrect ? 'correct' : ''}">
              <div class="row-header">
                <span>${escapeHtml(r.label)}${isCorrect ? ' ★正解' : ''}</span>
                <span class="row-stat">${statText}</span>
              </div>
              <div class="track">
                <div class="fill" style="width: ${widthPct}%;"></div>
              </div>
            </div>
          `;
        }).join('');

        renderCountdown();
      } catch (e) {
        console.error(e);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    applyObsAppearance(currentState);
    updateOverlay();
    setInterval(updateOverlay, CONFIG.POLL_INTERVAL_MS);
    setInterval(renderCountdown, 200);
  </script>
</body>
</html>
