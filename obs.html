<!DOCTYPE html>
<html lang="ja" data-theme="dark" data-pos="bottom-right" data-size="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS 配信投票オーバーレイ</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AfterEffects-OK/poll-and-survey/main/OBS_poll_icon.png" />
  <link rel="shortcut icon" type="image/png" href="https://raw.githubusercontent.com/AfterEffects-OK/poll-and-survey/main/OBS_poll_icon.png" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/AfterEffects-OK/poll-and-survey/main/OBS_poll_icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@600;700;800;900&family=Orbitron:wght@700&family=Oswald:wght@600&family=Share+Tech+Mono&family=Shippori+Mincho:wght@700;800&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* 背景は必ず完全透過 */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      background-color: transparent !important;
      font-family: var(--font-main);
      box-sizing: border-box;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    :root, [data-theme="dark"] {
      --font-main: "Noto Sans JP", system-ui, sans-serif;
      --font-num: "Noto Sans JP", sans-serif;
      --card-bg: rgba(15, 23, 42, 0.92);
      --card-border: #38bdf8;
      --item-bg: rgba(30, 41, 59, 0.9);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.22);
      --ok: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.25);
      --timer: #fbbf24;
      --track-bg: rgba(255, 255, 255, 0.16);
      --bar-grad: linear-gradient(90deg, #38bdf8, #818cf8);
      --radius: 16px;
      --item-radius: 10px;
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.5);
    }

    html[data-theme="yellow"] {
      --font-main: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif;
      --font-num: "Fredoka", "Noto Sans JP", sans-serif;
      --card-bg: rgba(24, 22, 15, 0.95);
      --card-border: #facc15;
      --item-bg: rgba(41, 37, 24, 0.92);
      --text: #fefce8;
      --muted: #fde047;
      --accent: #facc15;
      --accent-soft: rgba(250, 204, 21, 0.22);
      --ok: #4ade80;
      --correct-bg: rgba(74, 222, 128, 0.24);
      --timer: #fb923c;
      --track-bg: rgba(250, 204, 21, 0.2);
      --bar-grad: linear-gradient(90deg, #facc15, #f59e0b);
      --radius: 14px;
      --item-radius: 10px;
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 18px rgba(250, 204, 21, 0.25);
    }

    html[data-theme="neon"] {
      --font-main: "Dela Gothic One", "Noto Sans JP", sans-serif;
      --font-num: "Orbitron", sans-serif;
      --card-bg: rgba(15, 12, 28, 0.94);
      --card-border: #ec4899;
      --item-bg: rgba(28, 22, 48, 0.92);
      --text: #fdf4ff;
      --muted: #e879f9;
      --accent: #22d3ee;
      --accent-soft: rgba(34, 211, 238, 0.22);
      --ok: #4ade80;
      --correct-bg: rgba(74, 222, 128, 0.25);
      --timer: #f472b6;
      --track-bg: rgba(236, 72, 153, 0.22);
      --bar-grad: linear-gradient(90deg, #22d3ee, #ec4899);
      --radius: 8px;
      --item-radius: 6px;
      --shadow: 0 0 24px rgba(236, 72, 153, 0.45);
    }

    html[data-theme="pop"] {
      --font-main: "M PLUS Rounded 1c", sans-serif;
      --font-num: "Fredoka", "M PLUS Rounded 1c", sans-serif;
      --card-bg: rgba(255, 251, 235, 0.96);
      --card-border: #1e293b;
      --item-bg: rgba(255, 255, 255, 0.95);
      --text: #0f172a;
      --muted: #334155;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.16);
      --ok: #16a34a;
      --correct-bg: rgba(22, 163, 74, 0.2);
      --timer: #ea580c;
      --track-bg: #e2e8f0;
      --bar-grad: linear-gradient(90deg, #3b82f6, #f59e0b);
      --radius: 22px;
      --item-radius: 14px;
      --shadow: 0 8px 0 #1e293b;
    }

    html[data-theme="cyber"] {
      --font-main: "DotGothic16", monospace;
      --font-num: "Share Tech Mono", monospace;
      --card-bg: rgba(6, 24, 18, 0.94);
      --card-border: #10b981;
      --item-bg: rgba(11, 38, 29, 0.92);
      --text: #ecfdf5;
      --muted: #6ee7b7;
      --accent: #34d399;
      --accent-soft: rgba(52, 211, 153, 0.22);
      --ok: #a3e635;
      --correct-bg: rgba(163, 230, 53, 0.24);
      --timer: #2dd4bf;
      --track-bg: rgba(16, 185, 129, 0.22);
      --bar-grad: linear-gradient(90deg, #10b981, #a3e635);
      --radius: 6px;
      --item-radius: 4px;
      --shadow: 0 0 20px rgba(16, 185, 129, 0.35);
    }

    html[data-theme="cyber"] .overlay-card {
      background-image:
        linear-gradient(to right, rgba(16, 185, 129, 0.11) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(16, 185, 129, 0.11) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    html[data-theme="sakura"] {
      --font-main: "Zen Maru Gothic", sans-serif;
      --font-num: "Zen Maru Gothic", sans-serif;
      --bg: rgba(255, 248, 250, 0.96);
      --card-bg: rgba(255, 248, 250, 0.96);
      --card-border: #fb7185;
      --item-bg: rgba(255, 228, 230, 0.85);
      --text: #3f1d28;
      --muted: #881337;
      --accent: #e11d48;
      --accent-soft: rgba(225, 29, 72, 0.16);
      --ok: #059669;
      --correct-bg: rgba(5, 150, 105, 0.2);
      --timer: #db2777;
      --track-bg: #fecdd3;
      --bar-grad: linear-gradient(90deg, #fb7185, #f472b6);
      --radius: 24px;
      --item-radius: 16px;
      --shadow: 0 12px 28px rgba(244, 114, 182, 0.28);
    }

    html[data-theme="broadcast"] {
      --font-main: "Shippori Mincho", serif;
      --font-num: "Oswald", sans-serif;
      --card-bg: rgba(11, 19, 43, 0.95);
      --card-border: #ef4444;
      --item-bg: rgba(24, 39, 82, 0.92);
      --text: #ffffff;
      --muted: #e2e8f0;
      --accent: #f87171;
      --accent-soft: rgba(239, 68, 68, 0.24);
      --ok: #38bdf8;
      --correct-bg: rgba(56, 189, 248, 0.25);
      --timer: #fde047;
      --track-bg: rgba(255, 255, 255, 0.18);
      --bar-grad: linear-gradient(90deg, #ef4444, #f97316);
      --radius: 8px;
      --item-radius: 6px;
      --shadow: 0 14px 32px rgba(0, 0, 0, 0.55);
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      padding: clamp(10px, 2vw, 32px);
      display: flex;
      pointer-events: none;
    }

    [data-pos="bottom-right"] .stage { justify-content: flex-end; align-items: flex-end; }
    [data-pos="bottom-left"] .stage  { justify-content: flex-start; align-items: flex-end; }
    [data-pos="bottom-center"] .stage{ justify-content: center; align-items: flex-end; }
    [data-pos="bottom-right"] .stage,
    [data-pos="bottom-left"] .stage,
    [data-pos="bottom-center"] .stage {
      padding-bottom: clamp(70px, 8vh, 120px);
    }
    [data-pos="top-right"] .stage    { justify-content: flex-end; align-items: flex-start; }
    [data-pos="top-left"] .stage     { justify-content: flex-start; align-items: flex-start; }
    [data-pos="top-center"] .stage   { justify-content: center; align-items: flex-start; }
    [data-pos="center"] .stage       { justify-content: center; align-items: center; }

    .overlay-card {
      width: 100%;
      max-width: 560px;
      max-height: 100%;
      overflow-y: auto;
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--card-border);
      border-radius: var(--radius);
      padding: clamp(14px, 2vw, 22px);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease, max-width 0.2s ease, padding 0.2s ease;
      scrollbar-width: none;
    }
    .overlay-card::-webkit-scrollbar {
      display: none;
    }

    .overlay-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      white-space: nowrap;
    }

    .timer-txt {
      font-family: var(--font-num);
      font-size: 25px;
      font-weight: 800;
      color: var(--timer);
      white-space: nowrap;
    }

    .q-title {
      margin: 0 0 12px;
      font-size: clamp(22px, 2vw, 26px);
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* 質問文と同じ文字サイズのルームID表示（ラベル部分のみ少し縮小） */
    .room-id-title {
      margin: 0 0 12px;
      font-size: clamp(22px, 2vw, 26px);
      font-weight: 800;
      line-height: 1.35;
      color: var(--accent);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .room-id-label {
      font-size: 0.72em;
      font-weight: 700;
      opacity: 0.9;
      margin-right: 4px;
    }

    .room-id-value {
      font-size: 1em;
      font-weight: 800;
    }

    .rows {
      display: grid;
      gap: 8px;
    }

    .row-item {
      background: var(--item-bg);
      border-radius: var(--item-radius);
      padding: 8px 12px;
      min-width: 0;
    }

    .row-item.correct {
      background: var(--correct-bg);
      box-shadow: inset 0 0 0 2px var(--ok);
    }

    .row-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      font-size: clamp(18px, 1.5vw, 24px);
      font-weight: 800;
      margin-bottom: 2px;
    }

    .row-label {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .row-stat {
      font-family: var(--font-num);
      font-size: 22px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .track {
      width: 100%;
      height: 10px;
      background: var(--track-bg);
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: var(--target-pct, 0%);
      border-radius: 999px;
      background: var(--bar-grad);
      transition: width 0.35s ease;
    }

    @keyframes barSmooth {
      0% {
        width: 0%;
      }
      100% {
        width: var(--target-pct, 0%);
      }
    }

    @keyframes barBounce {
      0% {
        width: 0%;
      }
      58% {
        width: calc(min(100%, var(--target-pct, 0%) * 1.18 + 3%));
      }
      78% {
        width: calc(max(0%, var(--target-pct, 0%) * 0.92));
      }
      90% {
        width: calc(min(100%, var(--target-pct, 0%) * 1.04));
      }
      100% {
        width: var(--target-pct, 0%);
      }
    }

    .fill.bounce {
      width: 0%;
      animation: barSmooth 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    html[data-theme="pop"] .fill.bounce,
    html[data-theme="sakura"] .fill.bounce {
      animation: barBounce 0.78s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .closed-notice {
      padding: 14px 16px;
      border-radius: var(--item-radius);
      background: var(--item-bg);
      color: var(--muted);
      font-size: clamp(16px, 1.8vw, 20px);
      font-weight: 800;
      text-align: center;
    }

    /* 受付中のみ表示されるQRコードボックス */
    .qr-box {
      display: none;
      margin-top: 12px;
      padding: 3px 6px;
      border-radius: var(--item-radius);
      background: var(--item-bg);
      border: 1.5px solid var(--accent);
      align-items: center;
      gap: 14px;
    }

    .qr-box.show {
      display: flex;
    }

    .qr-frame {
      background: #ffffff;
      padding: 2px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #qrCanvas {
      width: 200px;
      height: 200px;
      display: block;
      image-rendering: pixelated;
    }

    .qr-info {
      min-width: 0;
      flex: 1;
    }

    .qr-heading {
      font-size: 25px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1.35;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .qr-status {
      display: none;
      margin-top: 4px;
      font-size: 12px;
      font-weight: 800;
      color: var(--timer);
      line-height: 1.3;
    }

    .footer-meta {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    /* コンパクト表示（html[data-size="compact"]）：QRコード・「読み取って」直前改行メッセージ・受付ステータスのみ表示 */
    html[data-size="compact"] .overlay-card {
      width: auto;
      padding: 4px 16px;
    }

    html[data-size="compact"] .top-bar,
    html[data-size="compact"] .q-title,
    html[data-size="compact"] .room-id-title,
    html[data-size="compact"] .rows,
    html[data-size="compact"] .footer-meta {
      display: none;
    }

    html[data-size="compact"] .qr-box.show {
      display: flex;
      margin-top: 0;
      padding: 2px 3px;
      gap: 16px;
      background: transparent;
      border: none;
    }

    html[data-size="compact"] .qr-frame {
      padding: 2px;
      border-radius: 10px;
    }

    html[data-size="compact"] #qrCanvas {
      width: 170px;
      height: 170px;
    }

    html[data-size="compact"] .qr-heading {
      font-size: 26px;
      line-height: 1.3;
      white-space: pre-line;
    }

    html[data-size="compact"] .qr-status {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      font-size: 18px;
      font-weight: 800;
      color: var(--timer);
    }

    /* 拡大表示（html[data-size="large"]） */
    html[data-size="large"] .overlay-card {
      max-width: 780px;
      padding: clamp(20px, 3vw, 32px);
      border-width: 3px;
    }

    html[data-size="large"] .tag {
      font-size: 15px;
      padding: 5px 14px;
    }

    html[data-size="large"] .timer-txt {
      font-size: 24px;
    }

    html[data-size="large"] .q-title,
    html[data-size="large"] .room-id-title {
      font-size: clamp(26px, 3.2vw, 38px);
      margin-bottom: 16px;
    }

    html[data-size="large"] .row-item {
      padding: 12px 16px;
    }

    html[data-size="large"] .row-head {
      font-size: clamp(26px, 2.2vw, 30px);
      margin-bottom: 7px;
    }

    html[data-size="large"] .row-stat {
      font-size: 26px;
    }

    html[data-size="large"] .track {
      height: 16px;
    }

    html[data-size="large"] #qrCanvas {
      width: 250px;
      height: 250px;
    }

    html[data-size="large"] .qr-heading {
      font-size: 28px;
    }

    html[data-size="large"] .footer-meta {
      font-size: 15px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="overlayCard" class="overlay-card">
      <div class="top-bar">
        <span id="tagBadge" class="tag">POLL</span>
        <span id="timerDisplay" class="timer-txt"></span>
      </div>      
      <div id="roomIdDisplay" class="room-id-title"></div>
      <h2 id="qTitle" class="q-title"></h2>
      <div id="rowsContainer" class="rows"></div>

      <div id="qrBox" class="qr-box">
        <div class="qr-frame">
          <canvas id="qrCanvas" width="280" height="280"></canvas>
        </div>
        <div class="qr-info">
          <div id="qrHeading" class="qr-heading">QRコードを読み取って
投票</div>
          <div id="qrStatusLabel" class="qr-status"></div>
        </div>
      </div>

      <div class="footer-meta">
        <span id="stateLabel"></span>
        <span id="totalVotesLabel"></span>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const INITIAL_ROOM_ID = typeof getRoomId === 'function' ? getRoomId() : 'default';
    let ROOM_ID = INITIAL_ROOM_ID;
    const ADMIN_ID = typeof getAdminId === 'function' ? getAdminId() : 'default';
    const ALLOWED_THEMES = ['dark', 'yellow', 'neon', 'pop', 'cyber', 'sakura', 'broadcast'];
    const ALLOWED_POSITIONS = [
      'bottom-right', 'bottom-left', 'bottom-center',
      'top-right', 'top-left', 'top-center', 'center'
    ];
    const ALLOWED_SIZES = ['normal', 'compact', 'large'];

    let currentState = { status: 'WAITING', deadlineAt: 0, theme: 'dark', position: 'bottom-right', size: 'normal' };
    let currentIsQuiz = false;
    let lastResultSignature = '';
    let renderedQrUrl = '';

    function resolveActiveRoomId(apiRoomId) {
      const params = new URLSearchParams(window.location.search);
      const paramRoom = (params.get('room') || '').trim();
      if (paramRoom) return paramRoom;
      if (apiRoomId && String(apiRoomId).trim()) return String(apiRoomId).trim();
      if (typeof getRoomId === 'function') {
        const fnRoom = String(getRoomId() || '').trim();
        if (fnRoom) return fnRoom;
      }
      return ROOM_ID || 'default';
    }

    function updateRoomIdDisplay(roomId) {
      const el = document.getElementById('roomIdDisplay');
      if (!el) return;
      const safeRoom = String(roomId || '').trim();
      if (!safeRoom) {
        el.innerHTML = '';
        return;
      }
      el.innerHTML = `<span class="room-id-label">ルームID:</span><span class="room-id-value">${escapeHtml(safeRoom)}</span>`;
    }

    function getVoteTargetUrl() {
      if (typeof CONFIG !== 'undefined' && CONFIG.VOTE_URL && String(CONFIG.VOTE_URL).trim()) {
        const base = new URL(String(CONFIG.VOTE_URL).trim(), window.location.href);
        if (ROOM_ID !== 'default') base.searchParams.set('room', ROOM_ID);
        if (ADMIN_ID !== 'default') base.searchParams.set('admin', ADMIN_ID);
        return base.href;
      }
      if (typeof buildPageUrlWithContext === 'function') {
        return buildPageUrlWithContext('index.html');
      }
      const pathname = window.location.pathname;
      const basePath = pathname.endsWith('/')
        ? pathname
        : pathname.replace(/[^/]+$/, '');
      const url = new URL(`${window.location.origin}${basePath}index.html`);
      if (ROOM_ID !== 'default') url.searchParams.set('room', ROOM_ID);
      if (ADMIN_ID !== 'default') url.searchParams.set('admin', ADMIN_ID);
      return url.href;
    }

    function updateQrHeading(isQuiz) {
      const headingEl = document.getElementById('qrHeading');
      if (!headingEl) return;
      const isCompact = currentState && currentState.size === 'compact';
      if (isCompact) {
        headingEl.textContent = isQuiz
          ? 'QRコードを読み取って\n回答'
          : 'QRコードを読み取って\n投票';
      } else {
        headingEl.textContent = isQuiz
          ? 'QRコードを読み取って回答'
          : 'QRコードを読み取って投票';
      }
    }

    /* 規格準拠のQRコードマトリクス生成（Byteモード・ECC Level L・Version 1〜10・自動マスク選択） */
    function buildQrMatrix(text) {
      const bytes = new TextEncoder().encode(text);

      // ECC Level L: [version, totalCodewords, ecCodewordsPerBlock, numBlocksGroup1, dataCodewordsGroup1, numBlocksGroup2, dataCodewordsGroup2]
      const QR_SPECS = [
        null,
        [1,  26,   7, 1, 19, 0,  0],
        [2,  44,  10, 1, 34, 0,  0],
        [3,  70,  15, 1, 55, 0,  0],
        [4,  100, 20, 1, 80, 0,  0],
        [5,  134, 26, 1, 108, 0, 0],
        [6,  172, 18, 2, 68, 0,  0],
        [7,  196, 20, 2, 78, 0,  0],
        [8,  242, 24, 2, 97, 0,  0],
        [9,  292, 30, 2, 116, 0, 0],
        [10, 346, 18, 2, 68, 2, 69]
      ];

      let spec = null;
      for (let v = 1; v <= 10; v++) {
        const s = QR_SPECS[v];
        const totalDataBytes = (s[3] * s[4]) + (s[5] * s[6]);
        const overheadBytes = v <= 9 ? 2 : 3;
        if (bytes.length + overheadBytes <= totalDataBytes) {
          spec = {
            version: v,
            totalCodewords: s[1],
            ecPerBlock: s[2],
            g1Blocks: s[3],
            g1Data: s[4],
            g2Blocks: s[5],
            g2Data: s[6],
            totalDataBytes
          };
          break;
        }
      }
      if (!spec) return null;

      const size = spec.version * 4 + 17;

      const gfExp = new Array(512).fill(0);
      const gfLog = new Array(256).fill(0);
      let x = 1;
      for (let i = 0; i < 255; i++) {
        gfExp[i] = x;
        gfLog[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (let i = 255; i < 512; i++) {
        gfExp[i] = gfExp[i - 255];
      }

      function gfMul(a, b) {
        if (a === 0 || b === 0) return 0;
        return gfExp[(gfLog[a] + gfLog[b]) % 255];
      }

      function rsEncode(dataChunk, ecLen) {
        let gen = [1];
        for (let i = 0; i < ecLen; i++) {
          const nextGen = new Array(gen.length + 1).fill(0);
          for (let j = 0; j < gen.length; j++) {
            nextGen[j] ^= gen[j];
            nextGen[j + 1] ^= gfMul(gen[j], gfExp[i]);
          }
          gen = nextGen;
        }

        const rem = new Array(ecLen).fill(0);
        for (let i = 0; i < dataChunk.length; i++) {
          const factor = dataChunk[i] ^ rem[0];
          for (let j = 0; j < ecLen - 1; j++) {
            rem[j] = rem[j + 1] ^ gfMul(gen[j + 1], factor);
          }
          rem[ecLen - 1] = gfMul(gen[ecLen], factor);
        }
        return rem;
      }

      const bits = [];
      function pushBits(val, len) {
        for (let b = len - 1; b >= 0; b--) {
          bits.push(((val >>> b) & 1) === 1);
        }
      }

      pushBits(0b0100, 4);
      const countBitsLen = spec.version <= 9 ? 8 : 16;
      pushBits(bytes.length, countBitsLen);
      for (let i = 0; i < bytes.length; i++) {
        pushBits(bytes[i], 8);
      }

      const totalDataBits = spec.totalDataBytes * 8;
      const termLen = Math.min(4, Math.max(0, totalDataBits - bits.length));
      pushBits(0, termLen);
      while (bits.length % 8 !== 0) bits.push(false);

      const padBytes = [0xec, 0x11];
      let padIdx = 0;
      while (bits.length < totalDataBits) {
        pushBits(padBytes[padIdx % 2], 8);
        padIdx++;
      }

      const dataCodewords = [];
      for (let i = 0; i < spec.totalDataBytes; i++) {
        let val = 0;
        for (let b = 0; b < 8; b++) {
          if (bits[i * 8 + b]) val |= (1 << (7 - b));
        }
        dataCodewords.push(val);
      }

      const dataBlocks = [];
      const ecBlocks = [];
      let offset = 0;

      for (let b = 0; b < spec.g1Blocks; b++) {
        const chunk = dataCodewords.slice(offset, offset + spec.g1Data);
        offset += spec.g1Data;
        dataBlocks.push(chunk);
        ecBlocks.push(rsEncode(chunk, spec.ecPerBlock));
      }
      for (let b = 0; b < spec.g2Blocks; b++) {
        const chunk = dataCodewords.slice(offset, offset + spec.g2Data);
        offset += spec.g2Data;
        dataBlocks.push(chunk);
        ecBlocks.push(rsEncode(chunk, spec.ecPerBlock));
      }

      const interleaved = [];
      const maxDataLen = Math.max(spec.g1Data, spec.g2Data);
      for (let i = 0; i < maxDataLen; i++) {
        for (let b = 0; b < dataBlocks.length; b++) {
          if (i < dataBlocks[b].length) interleaved.push(dataBlocks[b][i]);
        }
      }
      for (let i = 0; i < spec.ecPerBlock; i++) {
        for (let b = 0; b < ecBlocks.length; b++) {
          if (i < ecBlocks[b].length) interleaved.push(ecBlocks[b][i]);
        }
      }

      const codeBits = [];
      for (let i = 0; i < interleaved.length; i++) {
        for (let b = 7; b >= 0; b--) {
          codeBits.push(((interleaved[i] >>> b) & 1) === 1);
        }
      }
      const remainderBits = [0, 0, 7, 7, 7, 7, 7, 0, 0, 0, 0][spec.version] || 0;
      for (let i = 0; i < remainderBits; i++) {
        codeBits.push(false);
      }

      function createBaseGrid() {
        const grid = Array.from({ length: size }, () => Array(size).fill(null));
        const isFunction = Array.from({ length: size }, () => Array(size).fill(false));

        function setFunc(r, c, dark) {
          if (r < 0 || r >= size || c < 0 || c >= size) return;
          grid[r][c] = dark;
          isFunction[r][c] = true;
        }

        function placeFinder(r0, c0) {
          for (let r = -1; r <= 7; r++) {
            for (let c = -1; c <= 7; c++) {
              const rr = r0 + r;
              const cc = c0 + c;
              if (rr < 0 || rr >= size || cc < 0 || cc >= size) continue;
              const inBorder = r === -1 || r === 7 || c === -1 || c === 7;
              const inOuter = r === 0 || r === 6 || c === 0 || c === 6;
              const inCenter = r >= 2 && r <= 4 && c >= 2 && c <= 4;
              setFunc(rr, cc, !inBorder && (inOuter || inCenter));
            }
          }
        }

        placeFinder(0, 0);
        placeFinder(0, size - 7);
        placeFinder(size - 7, 0);

        for (let i = 8; i < size - 8; i++) {
          const dark = i % 2 === 0;
          setFunc(6, i, dark);
          setFunc(i, 6, dark);
        }

        const ALIGN_CENTERS = [
          null,
          [],
          [6, 18],
          [6, 22],
          [6, 26],
          [6, 30],
          [6, 34],
          [6, 22, 38],
          [6, 24, 42],
          [6, 26, 46],
          [6, 28, 50]
        ];
        const centers = ALIGN_CENTERS[spec.version] || [];
        for (let i = 0; i < centers.length; i++) {
          for (let j = 0; j < centers.length; j++) {
            const cr = centers[i];
            const cc = centers[j];
            if (isFunction[cr][cc]) continue;
            for (let r = -2; r <= 2; r++) {
              for (let c = -2; c <= 2; c++) {
                const dark = Math.abs(r) === 2 || Math.abs(c) === 2 || (r === 0 && c === 0);
                setFunc(cr + r, cc + c, dark);
              }
            }
          }
        }

        setFunc(size - 8, 8, true);

        for (let i = 0; i < 9; i++) {
          if (i < size) {
            isFunction[8][i] = true;
            isFunction[i][8] = true;
          }
        }
        for (let i = 0; i < 8; i++) {
          isFunction[8][size - 1 - i] = true;
          isFunction[size - 1 - i][8] = true;
        }

        if (spec.version >= 7) {
          for (let i = 0; i < 6; i++) {
            for (let j = 0; j < 3; j++) {
              isFunction[i][size - 11 + j] = true;
              isFunction[size - 11 + j][i] = true;
            }
          }
        }

        return { grid, isFunction };
      }

      function computeFormatBits(maskIdx) {
        const data = (0b01 << 3) | (maskIdx & 0b111);
        let rem = data << 10;
        const poly = 0b10100110111;
        for (let bit = 14; bit >= 10; bit--) {
          if ((rem >>> bit) & 1) {
            rem ^= (poly << (bit - 10));
          }
        }
        const bch = ((data << 10) | (rem & 0x3ff)) ^ 0b101010000010010;
        const arr = [];
        for (let i = 14; i >= 0; i--) {
          arr.push(((bch >>> i) & 1) === 1);
        }
        return arr;
      }

      function applyFormatBits(grid, maskIdx) {
        const fmt = computeFormatBits(maskIdx);
        const vCoords = [
          [size - 1, 8], [size - 2, 8], [size - 3, 8], [size - 4, 8], [size - 5, 8], [size - 6, 8], [size - 7, 8],
          [8, 8], [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]
        ];
        const horiz = [
          [8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8],
          [8, size - 7], [8, size - 6], [8, size - 5], [8, size - 4], [8, size - 3], [8, size - 2], [8, size - 1]
        ];
        for (let i = 0; i < 15; i++) {
          const [hr, hc] = horiz[i];
          grid[hr][hc] = fmt[i];
          const [vr, vc] = vCoords[i];
          grid[vr][vc] = fmt[i];
        }
      }

      function shouldMask(maskIdx, r, c) {
        switch (maskIdx) {
          case 0: return (r + c) % 2 === 0;
          case 1: return r % 2 === 0;
          case 2: return c % 3 === 0;
          case 3: return (r + c) % 3 === 0;
          case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
          case 5: return ((r * c) % 2) + ((r * c) % 3) === 0;
          case 6: return (((r * c) % 2) + ((r * c) % 3)) % 2 === 0;
          case 7: return (((r + c) % 2) + ((r * c) % 3)) % 2 === 0;
          default: return false;
        }
      }

      function calcPenalty(grid) {
        let score = 0;
        for (let r = 0; r < size; r++) {
          let runColor = grid[r][0];
          let runLen = 1;
          for (let c = 1; c < size; c++) {
            if (grid[r][c] === runColor) {
              runLen++;
            } else {
              if (runLen >= 5) score += 3 + (runLen - 5);
              runColor = grid[r][c];
              runLen = 1;
            }
          }
          if (runLen >= 5) score += 3 + (runLen - 5);
        }
        for (let c = 0; c < size; c++) {
          let runColor = grid[0][c];
          let runLen = 1;
          for (let r = 1; r < size; r++) {
            if (grid[r][c] === runColor) {
              runLen++;
            } else {
              if (runLen >= 5) score += 3 + (runLen - 5);
              runColor = grid[r][c];
              runLen = 1;
            }
          }
          if (runLen >= 5) score += 3 + (runLen - 5);
        }
        for (let r = 0; r < size - 1; r++) {
          for (let c = 0; c < size - 1; c++) {
            const v = grid[r][c];
            if (v === grid[r][c + 1] && v === grid[r + 1][c] && v === grid[r + 1][c + 1]) {
              score += 3;
            }
          }
        }
        return score;
      }

      let bestGrid = null;
      let bestScore = Infinity;

      for (let maskIdx = 0; maskIdx < 8; maskIdx++) {
        const { grid, isFunction } = createBaseGrid();
        let bitCursor = 0;
        let dirUp = true;

        for (let col = size - 1; col >= 1; col -= 2) {
          if (col === 6) col = 5;
          for (let step = 0; step < size; step++) {
            const r = dirUp ? (size - 1 - step) : step;
            for (let d = 0; d < 2; d++) {
              const c = col - d;
              if (!isFunction[r][c]) {
                let dark = bitCursor < codeBits.length ? codeBits[bitCursor++] : false;
                if (shouldMask(maskIdx, r, c)) {
                  dark = !dark;
                }
                grid[r][c] = dark;
              }
            }
          }
          dirUp = !dirUp;
        }

        applyFormatBits(grid, maskIdx);
        const penalty = calcPenalty(grid);
        if (penalty < bestScore) {
          bestScore = penalty;
          bestGrid = grid;
        }
      }

      return bestGrid;
    }

    function renderQrIfNeeded(isVoting) {
      const box = document.getElementById('qrBox');
      const canvas = document.getElementById('qrCanvas');
      if (!box || !canvas) return;

      if (!isVoting) {
        box.classList.remove('show');
        return;
      }

      const targetUrl = getVoteTargetUrl();
      box.classList.add('show');

      if (renderedQrUrl === targetUrl) return;
      renderedQrUrl = targetUrl;

      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const matrix = buildQrMatrix(targetUrl);
      if (!matrix) {
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('URLが長すぎます', canvas.width / 2, canvas.height / 2);
        return;
      }

      const n = matrix.length;
      const quiet = 4;
      const cell = Math.floor(canvas.width / (n + quiet * 2));
      const drawSize = cell * (n + quiet * 2);
      const offsetX = Math.floor((canvas.width - drawSize) / 2);
      const offsetY = Math.floor((canvas.height - drawSize) / 2);

      ctx.fillStyle = '#0f172a';
      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          if (matrix[r][c]) {
            ctx.fillRect(
              offsetX + (c + quiet) * cell,
              offsetY + (r + quiet) * cell,
              cell,
              cell
            );
          }
        }
      }
    }

    function applyAppearance(state) {
      const params = new URLSearchParams(window.location.search);
      const rawTheme = (state && typeof state.theme === 'string') ? state.theme.trim() : '';
      const rawPos = (state && typeof state.position === 'string') ? state.position.trim() : '';
      const rawSize = (state && typeof state.size === 'string') ? state.size.trim() : '';

      const theme = ALLOWED_THEMES.includes(rawTheme)
        ? rawTheme
        : (ALLOWED_THEMES.includes(params.get('theme')) ? params.get('theme') : 'dark');
      const pos = ALLOWED_POSITIONS.includes(rawPos)
        ? rawPos
        : (ALLOWED_POSITIONS.includes(params.get('pos')) ? params.get('pos') : 'bottom-right');
      const size = ALLOWED_SIZES.includes(rawSize)
        ? rawSize
        : (ALLOWED_SIZES.includes(params.get('size')) ? params.get('size') : 'normal');

      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-pos', pos);
      document.documentElement.setAttribute('data-size', size);
    }

    function updateTimer() {
      const el = document.getElementById('timerDisplay');
      const qrStatusEl = document.getElementById('qrStatusLabel');
      const baseReceptionText = currentIsQuiz ? '回答受付中' : '投票受付中';

      if (currentState.status === 'VOTING' && currentState.deadlineAt) {
        const sec = Math.max(0, Math.ceil((Number(currentState.deadlineAt) - Date.now()) / 1000));
        if (el) el.textContent = `残り ${sec}秒`;
        if (qrStatusEl) qrStatusEl.textContent = `${baseReceptionText}（残り${sec}秒）`;
      } else {
        if (el) el.textContent = '';
        if (qrStatusEl) qrStatusEl.textContent = currentState.status === 'VOTING' ? baseReceptionText : '';
      }
    }

    async function pollOverlay() {
      try {
        const data = await fetchGas({ roomId: ROOM_ID, adminId: ADMIN_ID });
        if (!data.ok) return;

        ROOM_ID = resolveActiveRoomId(data.roomId);
        updateRoomIdDisplay(ROOM_ID);

        const { state, question, totalVotes, results } = data;
        currentState = Object.assign({}, currentState, state || {});
        applyAppearance(currentState);

        const card = document.getElementById('overlayCard');
        const isCompact = currentState.size === 'compact';
        const isVoting = currentState.status === 'VOTING';
        const isClosed = currentState.status === 'CLOSED';
        const isQuiz = Boolean(question && question.type === 'quiz');
        currentIsQuiz = isQuiz;

        if (!currentState || currentState.status === 'WAITING' || (isCompact && !isVoting)) {
          lastResultSignature = '';
          card.classList.remove('visible');
          renderQrIfNeeded(false);
          updateTimer();
          return;
        }

        const showCounts = currentState.status === 'RESULT' || currentState.status === 'ANSWER';
        const highlightAnswer = currentState.status === 'ANSWER' && isQuiz && question.answer;

        if (!showCounts) {
          lastResultSignature = '';
        }

        updateQrHeading(isQuiz);
        document.getElementById('tagBadge').textContent = isQuiz ? 'QUIZ / クイズ' : 'POLL / アンケート';
        document.getElementById('qTitle').textContent = question ? question.question : '';

        const statusMap = {
          VOTING: isQuiz ? '回答受付中' : '投票受付中',
          CLOSED: '受付終了',
          RESULT: '集計結果',
          ANSWER: '正解発表'
        };
        document.getElementById('stateLabel').textContent = statusMap[currentState.status] || currentState.status;
        document.getElementById('totalVotesLabel').textContent = showCounts ? `合計 ${totalVotes} 票` : '';

        const rows = document.getElementById('rowsContainer');
        if (isClosed) {
          rows.innerHTML = `<div class="closed-notice">${isQuiz ? '回答受付は終了しました' : '投票受付は終了しました'}</div>`;
        } else {
          const resultSig = `${(question && question.id) || ''}::${currentState.status}`;
          const shouldBounce = showCounts && lastResultSignature !== resultSig;
          if (showCounts) {
            lastResultSignature = resultSig;
          }

          rows.innerHTML = (results || []).map((r, idx) => {
            const isCorrect = highlightAnswer && r.label === question.answer;
            const pctVal = showCounts ? Math.max(0, Math.min(100, Number(r.pct || 0))) : 0;
            const statText = showCounts ? `${r.count}票 (${pctVal}%)` : '投票受付中';
            const delayMs = 1000 + Math.min(idx * 70, 350);
            const delayStyle = shouldBounce ? `animation-delay: ${delayMs}ms;` : '';
            const bounceClass = shouldBounce ? 'bounce' : '';

            return `
              <div class="row-item ${isCorrect ? 'correct' : ''}">
                <div class="row-head">
                  <span class="row-label">${escapeHtml(r.label)}${isCorrect ? ' ★正解' : ''}</span>
                  <span class="row-stat">${statText}</span>
                </div>
                <div class="track">
                  <div class="fill ${bounceClass}" style="--target-pct: ${pctVal}%; ${delayStyle}"></div>
                </div>
              </div>
            `;
          }).join('');
        }

        renderQrIfNeeded(isVoting);
        card.classList.add('visible');
        updateTimer();
      } catch (e) {
        console.error(e);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    updateRoomIdDisplay(ROOM_ID);
    applyAppearance(currentState);
    pollOverlay();
    setInterval(pollOverlay, CONFIG.POLL_INTERVAL_MS);
    setInterval(updateTimer, 200);
  </script>
</body>
