<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登録済みadminアカウント一覧 - 配信投票</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/AfterEffects-OK/poll-and-survey/main/OBS_poll_icon.png" />
  <link rel="shortcut" type="image/png" href="https://raw.githubusercontent.com/AfterEffects-OK/poll-and-survey/main/OBS_poll_icon.png" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/AfterEffects-OK/poll-and-survey/main/OBS_poll_icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      background: #090d16;
      color: #f8fafc;
      padding: 16px;
    }

    .app-shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px 16px;
      background: #141c2b;
      border: 2px solid #2b3a55;
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 16px;
    }

    .header-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .header-title {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
    }

    .context-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #0b101b;
      color: #6ee7b7;
      border: 1px solid #34d399;
    }

    .live-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #0b101b;
      color: #7dd3fc;
      border: 1px solid #38bdf8;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .live-pill.is-paused .live-dot {
      background: #f59e0b;
      box-shadow: none;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      padding: 7px 13px;
      border-radius: 8px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-btn:hover {
      border-color: #38bdf8;
      background: #263449;
      color: #ffffff;
    }

    .nav-btn.primary {
      background: #065f46;
      color: #d1fae5;
      border-color: #34d399;
    }

    .nav-btn.primary:hover {
      background: #059669;
      color: #ffffff;
    }

    .card {
      background: #141c2b;
      border: 2px solid #2b3a55;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .ops-card {
      background: #131d31;
      border: 2px solid #2563eb;
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .card-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #24334d;
    }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: #7dd3fc;
    }

    .ops-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .ops-controls label {
      font-size: 12.5px;
      font-weight: 800;
      color: #cbd5e1;
    }

    select.auto-select {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 8px;
      background: #0b101b;
      color: #ffffff;
      border: 1.5px solid #475569;
    }

    .ops-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .ops-tile {
      background: #0b101b;
      border: 1px solid #273854;
      border-radius: 10px;
      padding: 12px 14px;
      display: grid;
      gap: 6px;
    }

    .ops-tile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ops-room-label {
      font-size: 13.5px;
      font-weight: 800;
      color: #f8fafc;
    }

    .state-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 800;
      background: #334155;
      color: #f8fafc;
      white-space: nowrap;
    }

    .state-badge.voting {
      background: #065f46;
      color: #a7f3d0;
      border: 1px solid #34d399;
    }

    .state-badge.waiting {
      background: #78350f;
      color: #fde68a;
      border: 1px solid #fbbf24;
    }

    .state-badge.result {
      background: #075985;
      color: #bae6fd;
      border: 1px solid #38bdf8;
    }

    .state-badge.answer {
      background: #831843;
      color: #fbcfe8;
      border: 1px solid #f472b6;
    }

    .state-badge.closed {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #64748b;
    }

    .ops-q-text {
      font-size: 13px;
      font-weight: 700;
      color: #e2e8f0;
      word-break: break-word;
    }

    .ops-meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 6px 10px;
      font-size: 12px;
      color: #94a3b8;
      font-weight: 700;
    }

    .ops-timer-txt {
      color: #fde047;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .search-wrap {
      flex: 1 1 280px;
      max-width: 460px;
    }

    input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 8px;
      background: #0b101b;
      color: #ffffff;
      border: 1.5px solid #475569;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }

    button.btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      padding: 8px 13px;
      border-radius: 8px;
      border: 1.5px solid transparent;
      cursor: pointer;
      color: #ffffff;
      background: #2563eb;
      white-space: nowrap;
    }

    button.btn:hover:not(:disabled) {
      filter: brightness(1.12);
    }

    button.btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.btn-green { background: #059669; }
    button.btn-sky { background: #0284c7; }
    button.btn-gray { background: #334155; border-color: #64748b; }

    .status-banner {
      padding: 9px 12px;
      border-radius: 8px;
      background: #0b101b;
      border-left: 4px solid #34d399;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #25344f;
      border-radius: 10px;
      background: #0b101b;
    }

    table.accounts-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.accounts-table th,
    table.accounts-table td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
      vertical-align: middle;
      word-break: break-word;
    }

    table.accounts-table th {
      background: #131c2e;
      color: #7dd3fc;
      font-weight: 800;
      white-space: nowrap;
    }

    table.accounts-table tr:last-child td {
      border-bottom: none;
    }

    .id-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13.5px;
      font-weight: 800;
      color: #6ee7b7;
      background: #062e24;
      border: 1px solid #10b981;
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .header-thumb {
      width: 96px;
      height: 32px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #141c2b;
      display: block;
    }

    .url-sub {
      font-size: 11.5px;
      color: #94a3b8;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty-box {
      padding: 24px 14px;
      text-align: center;
      color: #94a3b8;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header-bar">
      <div class="header-left">
        <h1 class="header-title">登録済みadminアカウント一覧</h1>
        <span id="countBadge" class="context-pill">0 件</span>
        <span id="autoStatusPill" class="live-pill">
          <span class="live-dot"></span>
          <span id="autoStatusText">自動更新: 10秒</span>
        </span>
      </div>
      <div class="header-actions">
        <a id="openAdminLink" href="admin.html" class="nav-btn primary">管理パネルへ戻る</a>
        <a href="index.html" class="nav-btn">回答者画面</a>
        <a href="obs.html" class="nav-btn">OBSオーバーレイ</a>
      </div>
    </header>

    <!-- 現在の運用状況（自動更新） -->
    <section class="ops-card" aria-label="現在の運用状況">
      <div class="card-header">
        <h2 class="card-title">現在の運用状況（自動更新）</h2>
        <div class="ops-controls">
          <label for="refreshIntervalSelect">更新間隔</label>
          <select id="refreshIntervalSelect" class="auto-select" onchange="changeRefreshInterval()">
            <option value="5000">5秒</option>
            <option value="10000" selected>10秒</option>
            <option value="30000">30秒</option>
            <option value="60000">60秒</option>
            <option value="0">一時停止</option>
          </select>
          <span id="lastSyncedLabel" style="font-size:12px;font-weight:700;color:#93c5fd;">最終更新: 未取得</span>
          <button type="button" id="reloadBtn" class="btn btn-sky" onclick="syncAllNow(true)">今すぐ更新</button>
        </div>
      </div>

      <div id="opsGrid" class="ops-grid">
        <div class="ops-tile">
          <div class="ops-room-label">運用状況を取得中...</div>
        </div>
      </div>
    </section>

    <!-- 登録済みアカウント一覧 -->
    <section class="card">
      <div class="card-header">
        <h2 class="card-title">アカウント一覧（admins シート連携）</h2>
      </div>

      <div class="toolbar">
        <div class="search-wrap">
          <input
            id="searchInput"
            type="text"
            placeholder="adminId・アカウント名・メモ・作成日時・運用状況で検索"
            oninput="renderTable()"
          />
        </div>
        <div id="summaryText" style="font-size:13px;font-weight:700;color:#93c5fd;"></div>
      </div>

      <div id="statusBanner" class="status-banner">アカウント一覧を読み込んでいます...</div>

      <div class="table-wrap">
        <table class="accounts-table">
          <thead>
            <tr>
              <th>#</th>
              <th>adminId</th>
              <th>運用状況</th>
              <th>アカウント名</th>
              <th>メモ</th>
              <th>作成日時</th>
              <th>ヘッダ画像</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="accountsTbody">
            <tr>
              <td colspan="8" class="empty-box">読み込み中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script>
    const DEFAULT_ADMIN = (typeof CONFIG !== 'undefined' && CONFIG.DEFAULT_ADMIN_ID) ? CONFIG.DEFAULT_ADMIN_ID : 'default';
    const DEFAULT_ROOM = (typeof CONFIG !== 'undefined' && CONFIG.DEFAULT_ROOM_ID) ? CONFIG.DEFAULT_ROOM_ID : 'default';
    const GAS_ENDPOINT = (typeof CONFIG !== 'undefined' && (CONFIG.GAS_URL || CONFIG.API_URL || CONFIG.ENDPOINT))
      ? (CONFIG.GAS_URL || CONFIG.API_URL || CONFIG.ENDPOINT)
      : '';

    const ADMIN_ACCOUNTS_CACHE_KEY = 'stream_poll_admin_accounts_v1';

    const STATUS_LABELS = {
      WAITING: '待機中（非表示）',
      VOTING: '受付中',
      CLOSED: '受付終了',
      RESULT: '結果表示中',
      ANSWER: '正解発表中'
    };

    const SEED_ACCOUNTS = [
      {
        adminId: 'zWqUjfLm',
        name: 'aftereffects',
        memo: 'AE_kagisen.010101',
        createdAt: '2026/11/24 0:15:24',
        headerImage: 'https://raw.githubusercontent.com/AfterEffects-OK/PortalSite/main/OBS_poll_0001.png'
      }
    ];

    let accountsList = [];
    let operationsByAdmin = new Map();
    let autoRefreshTimer = null;
    let countdownTickTimer = null;
    let isSyncing = false;

    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function normalizeAccount(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const adminId = String(raw.adminId || raw.admin_id || raw.id || '').trim();
      if (!adminId) return null;
      return {
        adminId,
        name: String(raw.name || raw.accountName || raw.label || '').trim(),
        memo: String(raw.memo || raw.email || raw.note || '').trim(),
        createdAt: String(raw.createdAt || raw.created_at || raw.timestamp || '').trim(),
        headerImage: String(raw.headerImage || raw.header_image || '').trim()
      };
    }

    function loadCachedAccounts() {
      try {
        const raw = localStorage.getItem(ADMIN_ACCOUNTS_CACHE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveCachedAccounts(list) {
      try {
        localStorage.setItem(ADMIN_ACCOUNTS_CACHE_KEY, JSON.stringify(list.slice(0, 100)));
      } catch (e) {}
    }

    function mergeAccounts(incoming) {
      const map = new Map();
      const sources = [
        ...SEED_ACCOUNTS,
        ...loadCachedAccounts(),
        ...accountsList,
        ...(Array.isArray(incoming) ? incoming : [])
      ];

      sources.map(normalizeAccount).filter(Boolean).forEach((item) => {
        const prev = map.get(item.adminId);
        map.set(item.adminId, {
          adminId: item.adminId,
          name: item.name || (prev ? prev.name : ''),
          memo: item.memo || (prev ? prev.memo : ''),
          createdAt: item.createdAt || (prev ? prev.createdAt : ''),
          headerImage: item.headerImage || (prev ? prev.headerImage : '')
        });
      });

      accountsList = [...map.values()];
      saveCachedAccounts(accountsList);
      return accountsList;
    }

    function setBanner(text) {
      const el = document.getElementById('statusBanner');
      if (el) el.textContent = text;
    }

    function buildAdminUrl(adminId, roomId = '') {
      const url = new URL('./admin.html', window.location.href);
      if (adminId && adminId !== DEFAULT_ADMIN) {
        url.searchParams.set('admin', adminId);
      }
      if (roomId && roomId !== DEFAULT_ROOM && adminId !== DEFAULT_ADMIN) {
        url.searchParams.set('room', roomId);
      }
      return url.href;
    }

    function copyAdminId(adminId) {
      if (!adminId) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(adminId)
          .then(() => setBanner(`adminId「${adminId}」をクリップボードにコピーしました。`))
          .catch(() => setBanner(`adminId: ${adminId}`));
      } else {
        setBanner(`adminId: ${adminId}`);
      }
    }

    function getRemainSecondsText(ops) {
      if (!ops || ops.status !== 'VOTING' || !Number(ops.deadlineAt)) return '';
      const sec = Math.max(0, Math.ceil((Number(ops.deadlineAt) - Date.now()) / 1000));
      return sec > 0 ? `残り ${sec}秒` : '受付終了待ち';
    }

    function getOperationSummary(adminId) {
      const fallback = {
        adminId,
        roomId: adminId === DEFAULT_ADMIN ? DEFAULT_ROOM : '未取得',
        roomName: '',
        status: 'WAITING',
        questionText: '出題情報なし',
        totalVotes: 0,
        deadlineAt: 0
      };
      return operationsByAdmin.get(adminId) || fallback;
    }

    function renderOperationsPanel() {
      const grid = document.getElementById('opsGrid');
      if (!grid) return;

      const targets = accountsList.length ? accountsList : [{ adminId: DEFAULT_ADMIN, name: 'default' }];

      grid.innerHTML = targets.map((acc) => {
        const ops = getOperationSummary(acc.adminId);
        const st = String(ops.status || 'WAITING').toUpperCase();
        const stLabel = STATUS_LABELS[st] || st;
        const stClass = st.toLowerCase();
        const remainTxt = getRemainSecondsText(ops);
        const roomDisplay = ops.roomName ? `${ops.roomId}（${ops.roomName}）` : (ops.roomId || '-');

        return `
          <div class="ops-tile">
            <div class="ops-tile-top">
              <span class="ops-room-label">${escapeHtml(acc.name || acc.adminId)} <span style="color:#6ee7b7;font-family:monospace;">[${escapeHtml(acc.adminId)}]</span></span>
              <span class="state-badge ${escapeHtml(stClass)}">${escapeHtml(stLabel)}</span>
            </div>
            <div class="ops-q-text">${escapeHtml(ops.questionText || '出題情報なし')}</div>
            <div class="ops-meta-row">
              <span>room: <strong>${escapeHtml(roomDisplay)}</strong></span>
              <span>総票数: <strong>${Number(ops.totalVotes || 0)}</strong> 票</span>
              <span class="ops-timer-txt">${escapeHtml(remainTxt)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function getFilteredAccounts() {
      const q = String(document.getElementById('searchInput')?.value || '').trim().toLowerCase();
      if (!q) return accountsList;
      return accountsList.filter((acc) => {
        const ops = getOperationSummary(acc.adminId);
        const stLabel = STATUS_LABELS[String(ops.status || '').toUpperCase()] || '';
        const hay = `${acc.adminId} ${acc.name} ${acc.memo} ${acc.createdAt} ${acc.headerImage} ${ops.roomId} ${ops.roomName} ${ops.questionText} ${stLabel}`.toLowerCase();
        return hay.includes(q);
      });
    }

    function renderTable() {
      const tbody = document.getElementById('accountsTbody');
      const countBadge = document.getElementById('countBadge');
      const summaryText = document.getElementById('summaryText');
      if (!tbody) return;

      const filtered = getFilteredAccounts();
      if (countBadge) countBadge.textContent = `${accountsList.length} 件`;
      if (summaryText) {
        summaryText.textContent = `${filtered.length} 件表示（全 ${accountsList.length} 件）`;
      }

      if (!filtered.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="empty-box">条件に一致する登録済みアカウントはありません。</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map((acc, idx) => {
        const ops = getOperationSummary(acc.adminId);
        const st = String(ops.status || 'WAITING').toUpperCase();
        const stLabel = STATUS_LABELS[st] || st;
        const stClass = st.toLowerCase();
        const remainTxt = getRemainSecondsText(ops);
        const safeImg = /^https?:\/\//i.test(acc.headerImage) ? acc.headerImage : '';
        const imgCell = safeImg
          ? `
            <img src="${escapeHtml(safeImg)}" alt="${escapeHtml(acc.adminId)} のヘッダ画像" class="header-thumb" loading="lazy" />
            <div class="url-sub" title="${escapeHtml(safeImg)}">${escapeHtml(safeImg)}</div>
          `
          : `<span style="color:#64748b;">未設定</span>`;

        const adminHref = buildAdminUrl(acc.adminId, ops.roomId);

        return `
          <tr>
            <td>${idx + 1}</td>
            <td><span class="id-code">${escapeHtml(acc.adminId)}</span></td>
            <td>
              <span class="state-badge ${escapeHtml(stClass)}">${escapeHtml(stLabel)}</span>
              <div style="font-size:11.5px;color:#94a3b8;margin-top:4px;">
                room: ${escapeHtml(ops.roomId || '-')}${remainTxt ? ` ・ <span style="color:#fde047;">${escapeHtml(remainTxt)}</span>` : ''}
              </div>
            </td>
            <td><strong>${escapeHtml(acc.name || '（未設定）')}</strong></td>
            <td>${escapeHtml(acc.memo || '-')}</td>
            <td>${escapeHtml(acc.createdAt || '-')}</td>
            <td>${imgCell}</td>
            <td>
              <div class="row-actions">
                <button type="button" class="btn btn-gray" onclick="copyAdminId('${escapeHtml(acc.adminId)}')">IDコピー</button>
                <a href="${escapeHtml(adminHref)}" class="btn btn-green" style="text-decoration:none;">管理画面で開く</a>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function callGasGet(params = {}) {
      if (typeof window.fetchGas === 'function') {
        return await window.fetchGas(params);
      }
      if (!GAS_ENDPOINT) {
        return { ok: false, error: 'GASエンドポイント（config.js）が未設定です。' };
      }
      const url = new URL(GAS_ENDPOINT);
      Object.entries(params).forEach(([k, v]) => {
        if (v !== undefined && v !== null && String(v) !== '') {
          url.searchParams.set(k, String(v));
        }
      });
      url.searchParams.set('_ts', String(Date.now()));
      const resp = await fetch(url.toString(), { method: 'GET', cache: 'no-store' });
      if (!resp.ok) {
        return { ok: false, error: `HTTP ${resp.status}` };
      }
      return await resp.json();
    }

    async function fetchAdminOperation(adminId) {
      const targetRoom = adminId === DEFAULT_ADMIN ? DEFAULT_ROOM : '';
      const res = await callGasGet({
        adminId,
        ...(targetRoom ? { roomId: targetRoom } : {})
      });
      if (!res || !res.ok) return null;

      const resolvedRoomId = String(res.roomId || (res.state && res.state.roomId) || targetRoom || DEFAULT_ROOM).trim();
      const matchedRoom = Array.isArray(res.rooms)
        ? res.rooms.find((r) => String(r && r.roomId || '').trim() === resolvedRoomId)
        : null;
      const resolvedRoomName = String(
        res.roomName ||
        (matchedRoom && (matchedRoom.roomName || matchedRoom.room_name)) ||
        ''
      ).trim();

      const stObj = res.state || {};
      const qObj = res.question || (Array.isArray(res.questions)
        ? res.questions.find((q) => q && q.id === stObj.questionId)
        : null);

      return {
        adminId,
        roomId: resolvedRoomId,
        roomName: resolvedRoomName,
        status: String(stObj.status || 'WAITING').toUpperCase(),
        questionText: (qObj && qObj.question) ? String(qObj.question) : (stObj.questionId ? `質問ID: ${stObj.questionId}` : '出題情報なし'),
        totalVotes: Number(res.totalVotes || 0),
        deadlineAt: Number(stObj.deadlineAt || 0)
      };
    }

    async function loadOperations() {
      const targets = accountsList.length ? accountsList : [{ adminId: DEFAULT_ADMIN }];
      const results = await Promise.all(
        targets.map(async (acc) => {
          try {
            return await fetchAdminOperation(acc.adminId);
          } catch (e) {
            return null;
          }
        })
      );

      results.filter(Boolean).forEach((ops) => {
        operationsByAdmin.set(ops.adminId, ops);
      });

      const nowStr = new Date().toLocaleTimeString('ja-JP');
      const lastEl = document.getElementById('lastSyncedLabel');
      if (lastEl) lastEl.textContent = `最終更新: ${nowStr}`;

      renderOperationsPanel();
      renderTable();
    }

    async function syncAllNow(showFeedback = false) {
      if (isSyncing) return;
      isSyncing = true;
      const btn = document.getElementById('reloadBtn');
      if (btn) btn.disabled = true;

      mergeAccounts([]);
      renderOperationsPanel();
      renderTable();

      try {
        const res = await callGasGet({
          action: 'list_admins',
          roomId: DEFAULT_ROOM,
          adminId: DEFAULT_ADMIN
        });
        if (res && res.ok) {
          const rawList = Array.isArray(res.admins)
            ? res.admins
            : (Array.isArray(res.accounts) ? res.accounts : []);
          mergeAccounts(rawList);
          setBanner(
            showFeedback
              ? `GASから最新アカウント一覧（${accountsList.length}件）と運用状況を取得しました。`
              : `登録済みアカウント一覧（${accountsList.length}件）と現在の運用状況を表示中です。`
          );
        } else {
          setBanner(
            `キャッシュ・初期データ（${accountsList.length}件）を表示中です${res && res.error ? `（${res.error}）` : ''}。`
          );
        }
        await loadOperations();
      } catch (e) {
        console.error(e);
        renderOperationsPanel();
        renderTable();
        setBanner(`通信エラーのため、ローカル/初期データ（${accountsList.length}件）を表示中です。`);
      } finally {
        isSyncing = false;
        if (btn) btn.disabled = false;
      }
    }

    function updateAutoStatusPill(intervalMs) {
      const pill = document.getElementById('autoStatusPill');
      const txt = document.getElementById('autoStatusText');
      const paused = !intervalMs || intervalMs <= 0;
      if (pill) pill.classList.toggle('is-paused', paused);
      if (txt) {
        txt.textContent = paused ? '自動更新: 一時停止' : `自動更新: ${Math.round(intervalMs / 1000)}秒`;
      }
    }

    function changeRefreshInterval() {
      const sel = document.getElementById('refreshIntervalSelect');
      const ms = Number(sel ? sel.value : 10000);

      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }

      updateAutoStatusPill(ms);

      if (ms > 0) {
        autoRefreshTimer = setInterval(() => {
          if (document.hidden) return;
          const activeTag = document.activeElement && document.activeElement.tagName;
          if (activeTag === 'INPUT' || activeTag === 'SELECT') return;
          loadOperations();
        }, ms);
      }
    }

    (function init() {
      try {
        const qAdmin = new URLSearchParams(window.location.search).get('admin');
        const linkEl = document.getElementById('openAdminLink');
        if (qAdmin && linkEl) {
          linkEl.href = buildAdminUrl(qAdmin.trim());
        }
      } catch (e) {}

      syncAllNow(false);
      changeRefreshInterval();

      countdownTickTimer = setInterval(() => {
        if (document.hidden) return;
        const hasActiveTimer = [...operationsByAdmin.values()].some(
          (ops) => ops && ops.status === 'VOTING' && Number(ops.deadlineAt) > 0
        );
        if (hasActiveTimer) {
          renderOperationsPanel();
          renderTable();
        }
      }, 1000);
    })();
  </script>
</body>
