<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS 配信投票 管理画面</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-2: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans JP", system-ui, sans-serif;
      padding: 20px;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--accent);
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .status-banner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--panel-2);
      padding: 12px 16px;
      border-radius: 10px;
      margin-top: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      background: rgba(56, 189, 248, 0.18);
      color: var(--accent);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--panel-2);
      border: 1px solid var(--border);
      transition: transform 0.05s ease, opacity 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button:hover { opacity: 0.92; }
    button:active { transform: scale(0.98); }

    .btn-primary { background: #0284c7; border-color: #38bdf8; }
    .btn-ok { background: #15803d; border-color: #22c55e; }
    .btn-warn { background: #b45309; border-color: #f59e0b; }
    .btn-danger { background: #b91c1c; border-color: #ef4444; }

    .seg-btn.active {
      background: #0284c7;
      border-color: #7dd3fc;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.35);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
    }

    .choices-list {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .choice-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .choice-row input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--ok);
      cursor: pointer;
    }

    .result-item {
      background: var(--panel-2);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 8px;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .bar-bg {
      height: 10px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      width: 0%;
      transition: width 0.35s ease;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #0f172a;
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 999;
    }

    .toast.show { opacity: 1; }

    .obs-url-box {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }

    .obs-url-box input {
      flex: 1;
      font-size: 12px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>OBS 配信投票 管理画面</h1>
      <div class="muted">出題・受付開始・締め切り・集計表示・正解発表・リセット・オーバーレイ表示設定を一括操作します。</div>

      <div class="status-banner">
        <div>
          <span>現在の状態：</span>
          <span id="curStatusBadge" class="badge">読み込み中...</span>
          <span id="curTimerText" style="margin-left:10px; font-weight:700; color:#fbbf24;"></span>
        </div>
        <div>
          <span>総投票数：</span>
          <strong id="curTotalVotes">0</strong> 票
          <span class="muted" style="margin-left:10px;">resetSeq: <span id="curResetSeq">0</span></span>
        </div>
      </div>

      <div class="btn-row">
        <button id="btnStartVote" class="btn-ok" onclick="startVote()">受付開始</button>
        <button id="btnCloseVote" class="btn-warn" onclick="setStatus('CLOSED')">投票締切</button>
        <button id="btnShowResult" class="btn-primary" onclick="setStatus('RESULT')">結果発表</button>
        <button id="btnShowAnswer" class="btn-primary" onclick="setStatus('ANSWER')" style="display:none;">正解発表</button>
        <button id="btnWaiting" onclick="setStatus('WAITING')">待機画面に戻す</button>
        <button id="btnResetVotes" class="btn-danger" onclick="resetVotes()">票リセット</button>
      </div>
    </div>

    <div class="card">
      <h2>オーバーレイ表示設定（テーマ・位置・サイズ）</h2>
      <div class="muted">変更すると OBS ブラウザソース（<code>obs.html</code>）の表示に即時反映されます。</div>

      <div style="margin-top:12px;">
        <label>テーマ選択</label>
        <div class="btn-row" id="themeButtons">
          <button type="button" class="seg-btn" data-theme="dark" onclick="selectTheme('dark')">ダーク（標準）</button>
          <button type="button" class="seg-btn" data-theme="yellow" onclick="selectTheme('yellow')">イエロー（視認性重視）</button>
          <button type="button" class="seg-btn" data-theme="neon" onclick="selectTheme('neon')">ネオン（配信映え）</button>
          <button type="button" class="seg-btn" data-theme="pop" onclick="selectTheme('pop')">ポップ（明るめ）</button>
          <button type="button" class="seg-btn" data-theme="cyber" onclick="selectTheme('cyber')">サイバー（レトロSF）</button>
          <button type="button" class="seg-btn" data-theme="sakura" onclick="selectTheme('sakura')">サクラ（やわらか）</button>
          <button type="button" class="seg-btn" data-theme="broadcast" onclick="selectTheme('broadcast')">ブロードキャスト（報道・クイズ番組風）</button>
        </div>
      </div>

      <div style="margin-top:14px;">
        <label>表示位置（OBS 画面内の配置）</label>
        <div class="btn-row" id="positionButtons">
          <button type="button" class="seg-btn" data-pos="top-left" onclick="selectPosition('top-left')">左上</button>
          <button type="button" class="seg-btn" data-pos="top-center" onclick="selectPosition('top-center')">上中央</button>
          <button type="button" class="seg-btn" data-pos="top-right" onclick="selectPosition('top-right')">右上</button>
          <button type="button" class="seg-btn" data-pos="center" onclick="selectPosition('center')">中央</button>
          <button type="button" class="seg-btn" data-pos="bottom-left" onclick="selectPosition('bottom-left')">左下</button>
          <button type="button" class="seg-btn" data-pos="bottom-center" onclick="selectPosition('bottom-center')">下中央</button>
          <button type="button" class="seg-btn" data-pos="bottom-right" onclick="selectPosition('bottom-right')">右下</button>
        </div>
      </div>

      <div style="margin-top:14px;">
        <label>表示サイズ</label>
        <div class="btn-row" id="sizeButtons">
          <button type="button" class="seg-btn" data-size="compact" onclick="selectSize('compact')">コンパクト</button>
          <button type="button" class="seg-btn" data-size="normal" onclick="selectSize('normal')">通常サイズ</button>
          <button type="button" class="seg-btn" data-size="large" onclick="selectSize('large')">拡大表示</button>
        </div>
      </div>

      <div style="margin-top:14px;">
        <label>OBS ブラウザソース用 URL（任意でクエリ指定も可能）</label>
        <div class="obs-url-box">
          <input id="obsUrlPreview" type="text" readonly />
          <button type="button" onclick="copyObsUrl()">URLコピー</button>
        </div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>出題設定</h2>

        <div style="margin-bottom:12px;">
          <label for="qType">モード</label>
          <select id="qType" onchange="onTypeChange()">
            <option value="poll">アンケート（poll）</option>
            <option value="quiz">クイズ（quiz・正解あり）</option>
          </select>
        </div>

        <div style="margin-bottom:12px;">
          <label for="qTitle">質問文</label>
          <input id="qTitle" type="text" placeholder="例：次のうちどれを選ぶ？" />
        </div>

        <div style="margin-bottom:12px;">
          <label for="qDuration">制限時間（秒・0で無制限）</label>
          <input id="qDuration" type="number" min="0" max="3600" value="30" />
        </div>

        <div style="margin-bottom:8px;">
          <label>選択肢 <span id="correctHint" class="muted" style="display:none;">（ラジオボタンで正解を選択）</span></label>
          <div id="choicesList" class="choices-list"></div>
        </div>

        <div class="btn-row">
          <button type="button" onclick="addChoiceRow()">＋ 選択肢を追加</button>
          <button type="button" class="btn-primary" onclick="saveQuestion(false)">質問を保存</button>
          <button type="button" class="btn-ok" onclick="saveQuestion(true)">保存してすぐ受付開始</button>
        </div>
      </div>

      <div class="card">
        <h2>リアルタイム集計</h2>
        <div id="curQuestionTitle" style="font-weight:700; margin-bottom:10px;">-</div>
        <div id="resultsBox"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script>
    const ALLOWED_THEMES = ['dark', 'yellow', 'neon', 'pop', 'cyber', 'sakura', 'broadcast'];
    const ALLOWED_POSITIONS = [
      'bottom-right', 'bottom-left', 'bottom-center',
      'top-right', 'top-left', 'top-center', 'center'
    ];
    const ALLOWED_SIZES = ['normal', 'compact', 'large'];

    let latestState = {
      status: 'WAITING',
      deadlineAt: 0,
      resetSeq: 0,
      theme: 'dark',
      position: 'bottom-right',
      size: 'normal'
    };
    let latestQuestion = null;
    let isEditingForm = false;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function getObsBaseUrl() {
      const loc = window.location;
      const dir = loc.pathname.endsWith('/')
        ? loc.pathname
        : loc.pathname.substring(0, loc.pathname.lastIndexOf('/') + 1);
      return `${loc.origin}${dir}obs.html`;
    }

    function updateObsUrlPreview() {
      const input = document.getElementById('obsUrlPreview');
      if (!input) return;
      const t = ALLOWED_THEMES.includes(latestState.theme) ? latestState.theme : 'dark';
      const p = ALLOWED_POSITIONS.includes(latestState.position) ? latestState.position : 'bottom-right';
      const s = ALLOWED_SIZES.includes(latestState.size) ? latestState.size : 'normal';
      input.value = `${getObsBaseUrl()}?theme=${encodeURIComponent(t)}&pos=${encodeURIComponent(p)}&size=${encodeURIComponent(s)}`;
    }

    function copyObsUrl() {
      const input = document.getElementById('obsUrlPreview');
      if (!input) return;
      input.select();
      navigator.clipboard?.writeText(input.value).then(
        () => showToast('OBS URLをコピーしました'),
        () => {
          document.execCommand('copy');
          showToast('OBS URLをコピーしました');
        }
      );
    }

    function syncAppearanceButtons(state) {
      const t = ALLOWED_THEMES.includes(state.theme) ? state.theme : 'dark';
      const p = ALLOWED_POSITIONS.includes(state.position) ? state.position : 'bottom-right';
      const s = ALLOWED_SIZES.includes(state.size) ? state.size : 'normal';

      document.querySelectorAll('#themeButtons .seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === t);
      });
      document.querySelectorAll('#positionButtons .seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.pos === p);
      });
      document.querySelectorAll('#sizeButtons .seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.size === s);
      });

      updateObsUrlPreview();
    }

    async function updateAppearance(patch) {
      latestState = Object.assign({}, latestState, patch);
      syncAppearanceButtons(latestState);
      try {
        const res = await fetchGas({
          action: 'setAppearance',
          theme: latestState.theme,
          position: latestState.position,
          size: latestState.size
        });
        if (!res.ok) {
          showToast('表示設定の更新に失敗: ' + (res.error || ''));
          return;
        }
        if (res.state) {
          latestState = Object.assign({}, latestState, res.state);
          syncAppearanceButtons(latestState);
        }
        showToast('オーバーレイ表示設定を更新しました');
      } catch (e) {
        showToast('通信エラー: ' + e.message);
      }
    }

    function selectTheme(theme) {
      if (!ALLOWED_THEMES.includes(theme)) return;
      updateAppearance({ theme });
    }

    function selectPosition(position) {
      if (!ALLOWED_POSITIONS.includes(position)) return;
      updateAppearance({ position });
    }

    function selectSize(size) {
      if (!ALLOWED_SIZES.includes(size)) return;
      updateAppearance({ size });
    }

    function addChoiceRow(value = '', isCorrect = false) {
      const list = document.getElementById('choicesList');
      const idx = list.children.length;
      const row = document.createElement('div');
      row.className = 'choice-row';
      row.innerHTML = `
        <input type="radio" name="correctChoice" value="${idx}" ${isCorrect ? 'checked' : ''} title="正解に設定" />
        <input type="text" class="choice-input" placeholder="選択肢 ${idx + 1}" value="${escapeAttr(value)}" oninput="isEditingForm = true" />
        <button type="button" onclick="removeChoiceRow(this)">削除</button>
      `;
      list.appendChild(row);
      refreshRadioVisibility();
    }

    function removeChoiceRow(btn) {
      const list = document.getElementById('choicesList');
      if (list.children.length <= 2) {
        showToast('選択肢は最低2つ必要です');
        return;
      }
      btn.parentElement.remove();
      [...list.children].forEach((row, i) => {
        row.querySelector('input[type="radio"]').value = i;
        row.querySelector('.choice-input').placeholder = `選択肢 ${i + 1}`;
      });
      isEditingForm = true;
    }

    function onTypeChange() {
      isEditingForm = true;
      refreshRadioVisibility();
    }

    function refreshRadioVisibility() {
      const isQuiz = document.getElementById('qType').value === 'quiz';
      document.getElementById('correctHint').style.display = isQuiz ? 'inline' : 'none';
      document.querySelectorAll('input[name="correctChoice"]').forEach(r => {
        r.style.display = isQuiz ? 'inline-block' : 'none';
      });
    }

    function populateFormFromQuestion(q) {
      if (!q) return;
      document.getElementById('qType').value = q.type || 'poll';
      document.getElementById('qTitle').value = q.question || '';
      document.getElementById('qDuration').value = q.durationSec ?? 30;

      const list = document.getElementById('choicesList');
      list.innerHTML = '';
      const choices = (Array.isArray(q.choices) && q.choices.length >= 2) ? q.choices : ['選択肢A', '選択肢B'];
      choices.forEach(c => {
        addChoiceRow(c, q.type === 'quiz' && q.answer && c === q.answer);
      });
      refreshRadioVisibility();
    }

    async function saveQuestion(andStartVote) {
      const type = document.getElementById('qType').value;
      const question = document.getElementById('qTitle').value.trim();
      const durationSec = Math.max(0, Number(document.getElementById('qDuration').value || 0));
      const rows = [...document.querySelectorAll('#choicesList .choice-row')];
      const choices = rows.map(r => r.querySelector('.choice-input').value.trim()).filter(Boolean);

      if (!question) {
        showToast('質問文を入力してください');
        return;
      }
      if (choices.length < 2) {
        showToast('選択肢を2つ以上入力してください');
        return;
      }

      let answer = '';
      if (type === 'quiz') {
        const checkedRadio = document.querySelector('input[name="correctChoice"]:checked');
        if (!checkedRadio) {
          showToast('クイズの正解を1つ選択してください');
          return;
        }
        const checkedRow = rows[Number(checkedRadio.value)];
        answer = checkedRow ? checkedRow.querySelector('.choice-input').value.trim() : '';
        if (!answer) {
          showToast('正解に選んだ選択肢のテキストが空です');
          return;
        }
      }

      const res = await fetchGas({
        action: 'setQuestion',
        type,
        question,
        choices,
        answer,
        durationSec
      });

      if (!res.ok) {
        showToast('保存に失敗: ' + (res.error || ''));
        return;
      }

      isEditingForm = false;
      showToast('質問を保存しました');

      if (andStartVote) {
        await startVote();
      } else {
        await refreshState();
      }
    }

    async function startVote() {
      const res = await fetchGas({ action: 'startVote' });
      if (!res.ok) {
        showToast('受付開始に失敗: ' + (res.error || ''));
        return;
      }
      showToast('投票受付を開始しました');
      await refreshState();
    }

    async function setStatus(status) {
      const res = await fetchGas({ action: 'setStatus', status });
      if (!res.ok) {
        showToast('状態変更に失敗: ' + (res.error || ''));
        return;
      }
      showToast('状態を ' + status + ' に変更しました');
      await refreshState();
    }

    async function resetVotes() {
      if (!confirm('現在の投票データをリセットし、回答者の送信済み状態も解除しますか？')) return;
      const res = await fetchGas({ action: 'resetVotes' });
      if (!res.ok) {
        showToast('リセットに失敗: ' + (res.error || ''));
        return;
      }
      showToast('投票をリセットしました');
      await refreshState();
    }

    function updateCountdownLabel() {
      const el = document.getElementById('curTimerText');
      if (latestState.status === 'VOTING' && latestState.deadlineAt) {
        const rem = Math.max(0, Math.ceil((Number(latestState.deadlineAt) - Date.now()) / 1000));
        el.textContent = `残り ${rem}秒`;
      } else {
        el.textContent = '';
      }
    }

    async function refreshState() {
      try {
        const data = await fetchGas();
        if (!data.ok) return;

        latestState = Object.assign({}, latestState, data.state || {});
        latestQuestion = data.question;

        document.getElementById('curStatusBadge').textContent = latestState.status;
        document.getElementById('curTotalVotes').textContent = data.totalVotes ?? 0;
        document.getElementById('curResetSeq').textContent = latestState.resetSeq ?? 0;

        const isQuiz = Boolean(latestQuestion && latestQuestion.type === 'quiz');
        document.getElementById('btnShowAnswer').style.display = isQuiz ? 'inline-block' : 'none';
        document.getElementById('curQuestionTitle').textContent =
          latestQuestion ? `[${latestQuestion.type}] ${latestQuestion.question}` : '質問未設定';

        syncAppearanceButtons(latestState);
        updateCountdownLabel();

        if (!isEditingForm && latestQuestion) {
          populateFormFromQuestion(latestQuestion);
        }

        const resultsBox = document.getElementById('resultsBox');
        const results = data.results || [];
        resultsBox.innerHTML = results.map(r => {
          const isAns = isQuiz && latestQuestion.answer && r.label === latestQuestion.answer;
          return `
            <div class="result-item">
              <div class="result-top">
                <span>${escapeHtml(r.label)} ${isAns ? '★正解' : ''}</span>
                <span>${r.count}票 (${r.pct}%)</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width:${r.pct}%;"></div>
              </div>
            </div>
          `;
        }).join('');
      } catch (e) {
        console.error(e);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    document.getElementById('qTitle').addEventListener('input', () => { isEditingForm = true; });
    document.getElementById('qDuration').addEventListener('input', () => { isEditingForm = true; });

    addChoiceRow('選択肢 1', true);
    addChoiceRow('選択肢 2', false);
    syncAppearanceButtons(latestState);
    refreshState();
    setInterval(refreshState, CONFIG.POLL_INTERVAL_MS);
    setInterval(updateCountdownLabel, 250);
  </script>
</body>
</html>
