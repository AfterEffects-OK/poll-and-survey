<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配信投票・クイズ コントロールパネル (Admin)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a30;
      --panel-2: #192442;
      --border: #2a3963;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.voting { background: var(--ok); }
    .dot.result, .dot.answer { background: var(--accent); }
    .dot.closed { background: var(--warn); }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .card h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
    }

    textarea {
      min-height: 104px;
      resize: vertical;
    }

    .row-inline {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      color: var(--text);
      background: var(--panel-2);
      transition: opacity 0.15s ease, transform 0.05s ease;
    }

    button:hover { opacity: 0.92; }
    button:active { transform: translateY(1px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #071022;
    }
    .btn-ok { background: var(--ok); color: #052e16; }
    .btn-warn { background: var(--warn); color: #1f1300; }
    .btn-danger { background: var(--danger); color: #ffffff; }
    .btn-outline {
      background: transparent;
      border-color: var(--border);
    }

    .results-list {
      display: grid;
      gap: 8px;
    }

    .result-row {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .result-row.is-answer {
      border-color: var(--ok);
      background: rgba(34, 197, 94, 0.14);
    }

    .log-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
      background: #080c18;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      max-height: 130px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>配信投票・クイズ コントロールパネル</h1>
        <div class="sub">操作画面から出題・受付状態・OBS表示（theme / position / size）を同期します</div>
      </div>
      <div class="status-pill">
        <span id="statusDot" class="dot"></span>
        <span id="currentStatusText">状態: 読込中...</span>
        <span id="currentTotalText"></span>
      </div>
    </header>

    <div class="grid-2">
      <!-- 出題設定 -->
      <section class="card">
        <h2>1. 出題設定</h2>

        <div class="row-inline">
          <div class="field">
            <label for="questionSelect">登録済みの質問</label>
            <select id="questionSelect" onchange="onSelectQuestion()"></select>
          </div>
          <div class="field">
            <label for="qId">質問ID</label>
            <input id="qId" type="text" placeholder="q1" />
          </div>
        </div>

        <div class="row-inline">
          <div class="field">
            <label for="qType">出題タイプ</label>
            <select id="qType" onchange="toggleAnswerField()">
              <option value="poll">アンケート (poll)</option>
              <option value="quiz">クイズ (quiz)</option>
            </select>
          </div>
          <div class="field">
            <label for="durationSec">制限時間（秒・0で無制限）</label>
            <input id="durationSec" type="number" min="0" max="3600" value="60" />
          </div>
        </div>

        <div class="field">
          <label for="qTitle">質問文</label>
          <input id="qTitle" type="text" placeholder="例: 次のうちどれを選びますか？" />
        </div>

        <div class="field">
          <label for="qOptions">選択肢（1行につき1つ）</label>
          <textarea id="qOptions" placeholder="選択肢A&#10;選択肢B&#10;選択肢C&#10;選択肢D" oninput="refreshAnswerChoices()"></textarea>
        </div>

        <div id="answerField" class="field" style="display: none;">
          <label for="qAnswer">正解（クイズ用）</label>
          <select id="qAnswer"></select>
        </div>

        <div class="btn-group">
          <button class="btn-primary" onclick="saveAndStartVoting()">質問を保存して受付開始</button>
          <button class="btn-outline" onclick="saveQuestionOnly()">質問を保存</button>
          <button class="btn-outline" onclick="prepareNewQuestion()">新規作成</button>
          <button class="btn-danger" onclick="deleteSelectedQuestion()">質問削除</button>
        </div>
      </section>

      <!-- 進行・状態コントロール -->
      <section class="card">
        <h2>2. 進行・状態コントロール</h2>

        <div class="btn-group">
          <button class="btn-ok" onclick="setStatus('VOTING')">受付開始 (VOTING)</button>
          <button class="btn-warn" onclick="setStatus('CLOSED')">受付終了 (CLOSED)</button>
          <button class="btn-primary" onclick="setStatus('RESULT')">集計結果表示 (RESULT)</button>
          <button class="btn-ok" onclick="setStatus('ANSWER')">正解発表 (ANSWER)</button>
          <button class="btn-outline" onclick="setStatus('WAITING')">非表示・待機 (WAITING)</button>
        </div>

        <div class="field">
          <label>票リセット（resetSeq インクリメント）</label>
          <div class="btn-group">
            <button class="btn-danger" onclick="clearVotesForCurrent()">現在質問の票をリセット</button>
          </div>
          <div class="hint">実行すると該当質問の投票が消去され、<code>resetSeq</code> が増えるため回答者側の投票済みロック（localStorage）も解除されます。</div>
        </div>

        <div class="field">
          <label>現在の集計状況</label>
          <div id="resultsBox" class="results-list">
            <div class="hint">まだデータがありません。</div>
          </div>
        </div>
      </section>
    </div>

    <!-- OBS表示設定 -->
    <section class="card">
      <h2>3. OBSオーバーレイ表示設定（theme / position / size）</h2>
      <div class="row-inline">
        <div class="field">
          <label for="themeSelect">テーマ (theme)</label>
          <select id="themeSelect" onchange="pushAppearance()">
            <option value="dark">dark（標準ダーク）</option>
            <option value="yellow">yellow（イエロー）</option>
            <option value="neon">neon（ネオン）</option>
            <option value="pop">pop（ポップ・ライト）</option>
            <option value="cyber">cyber（サイバー）</option>
            <option value="sakura">sakura（サクラ）</option>
            <option value="broadcast">broadcast（放送風）</option>
          </select>
        </div>

        <div class="field">
          <label for="posSelect">表示位置 (position)</label>
          <select id="posSelect" onchange="pushAppearance()">
            <option value="bottom-right">右下 (bottom-right)</option>
            <option value="bottom-left">左下 (bottom-left)</option>
            <option value="bottom-center">下中央 (bottom-center)</option>
            <option value="top-right">右上 (top-right)</option>
            <option value="top-left">左上 (top-left)</option>
            <option value="top-center">上中央 (top-center)</option>
            <option value="center">中央 (center)</option>
          </select>
        </div>

        <div class="field">
          <label for="sizeSelect">表示サイズ (size)</label>
          <select id="sizeSelect" onchange="pushAppearance()">
            <option value="normal">通常 (normal)</option>
            <option value="compact">コンパクト (compact)</option>
            <option value="large">拡大 (large)</option>
          </select>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-primary" onclick="pushAppearance()">表示設定を反映</button>
        <button class="btn-outline" onclick="pollAdmin()">最新状態をすぐ取得</button>
      </div>
    </section>

    <section class="card">
      <h2>通信ログ</h2>
      <div id="logBox" class="log-box">待機中...</div>
    </section>
  </div>

  <script src="config.js"></script>
  <script>
    const ALLOWED_THEMES = ['dark', 'yellow', 'neon', 'pop', 'cyber', 'sakura', 'broadcast'];
    const ALLOWED_POSITIONS = [
      'bottom-right', 'bottom-left', 'bottom-center',
      'top-right', 'top-left', 'top-center', 'center'
    ];
    const ALLOWED_SIZES = ['normal', 'compact', 'large'];

    let cachedQuestions = [];
    let currentQuestionId = 'q1';
    let initializedFormFromServer = false;

    function writeLog(msg) {
      const box = document.getElementById('logBox');
      const now = new Date().toLocaleTimeString('ja-JP');
      box.textContent = `[${now}] ${msg}\n` + box.textContent;
    }

    async function callGasApi(payload) {
      if (typeof window.fetchGas === 'function') {
        return await window.fetchGas(payload);
      }
      const gasUrl = (typeof CONFIG !== 'undefined' && CONFIG.GAS_URL) ? String(CONFIG.GAS_URL).trim() : '';
      if (!gasUrl) {
        throw new Error('CONFIG.GAS_URL が設定されていません');
      }
      if (!payload || payload.action === 'state') {
        const sep = gasUrl.includes('?') ? '&' : '?';
        const res = await fetch(`${gasUrl}${sep}action=state&_t=${Date.now()}`, { cache: 'no-store' });
        return await res.json();
      }
      const res = await fetch(gasUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      return await res.json();
    }

    function toggleAnswerField() {
      const isQuiz = document.getElementById('qType').value === 'quiz';
      document.getElementById('answerField').style.display = isQuiz ? 'grid' : 'none';
      if (isQuiz) refreshAnswerChoices();
    }

    function getParsedOptions() {
      return document.getElementById('qOptions').value
        .split(/\r?\n/)
        .map(s => s.trim())
        .filter(Boolean);
    }

    function refreshAnswerChoices(preferredAnswer = '') {
      const select = document.getElementById('qAnswer');
      const opts = getParsedOptions();
      const prev = preferredAnswer || select.value;
      select.innerHTML = '';
      opts.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt;
        el.textContent = opt;
        select.appendChild(el);
      });
      if (prev && opts.includes(prev)) {
        select.value = prev;
      }
    }

    function fillFormWithQuestion(q) {
      if (!q) return;
      document.getElementById('qId').value = q.id || '';
      document.getElementById('qType').value = q.type === 'quiz' ? 'quiz' : 'poll';
      document.getElementById('qTitle').value = q.question || '';
      document.getElementById('qOptions').value = Array.isArray(q.options) ? q.options.join('\n') : '';
      toggleAnswerField();
      refreshAnswerChoices(q.answer || '');
    }

    function prepareNewQuestion() {
      const nextNum = cachedQuestions.length + 1;
      document.getElementById('qId').value = `q${nextNum}`;
      document.getElementById('qType').value = 'poll';
      document.getElementById('qTitle').value = '';
      document.getElementById('qOptions').value = '';
      toggleAnswerField();
      refreshAnswerChoices('');
      document.getElementById('qTitle').focus();
    }

    async function onSelectQuestion() {
      const selectedId = document.getElementById('questionSelect').value;
      const q = cachedQuestions.find(item => item.id === selectedId);
      if (q) {
        fillFormWithQuestion(q);
      }
      if (selectedId) {
        try {
          await callGasApi({ action: 'set_state', questionId: selectedId });
          writeLog(`出題対象を ${selectedId} に切り替えました`);
          await pollAdmin();
        } catch (e) {
          writeLog('切替エラー: ' + e.message);
        }
      }
    }

    function collectQuestionPayload() {
      const id = document.getElementById('qId').value.trim() || ('q_' + Date.now().toString(36));
      const type = document.getElementById('qType').value === 'quiz' ? 'quiz' : 'poll';
      const questionText = document.getElementById('qTitle').value.trim();
      const options = getParsedOptions();
      const answer = type === 'quiz' ? document.getElementById('qAnswer').value : '';

      if (!questionText) {
        alert('質問文を入力してください。');
        return null;
      }
      if (options.length < 2) {
        alert('選択肢を2つ以上入力してください。');
        return null;
      }
      return {
        id,
        type,
        question: questionText,
        options,
        answer: type === 'quiz' ? (options.includes(answer) ? answer : options[0]) : ''
      };
    }

    function collectAppearancePayload() {
      const rawTheme = document.getElementById('themeSelect').value;
      const rawPos = document.getElementById('posSelect').value;
      const rawSize = document.getElementById('sizeSelect').value;

      return {
        theme: ALLOWED_THEMES.includes(rawTheme) ? rawTheme : 'dark',
        position: ALLOWED_POSITIONS.includes(rawPos) ? rawPos : 'bottom-right',
        size: ALLOWED_SIZES.includes(rawSize) ? rawSize : 'normal'
      };
    }

    async function saveQuestionOnly() {
      const question = collectQuestionPayload();
      if (!question) return;
      try {
        const res = await callGasApi({ action: 'upsert_question', question });
        if (!res.ok) throw new Error(res.error || '保存失敗');
        await callGasApi({ action: 'set_state', questionId: question.id });
        initializedFormFromServer = false;
        writeLog(`質問「${question.id}」を保存しました`);
        await pollAdmin();
      } catch (e) {
        writeLog('エラー: ' + e.message);
      }
    }

    async function saveAndStartVoting() {
      const question = collectQuestionPayload();
      if (!question) return;
      const durationSec = Math.max(0, Number(document.getElementById('durationSec').value || 0));
      const appearance = collectAppearancePayload();

      try {
        const upRes = await callGasApi({ action: 'upsert_question', question });
        if (!upRes.ok) throw new Error(upRes.error || '保存失敗');

        const statePayload = Object.assign({}, appearance, {
          action: 'set_state',
          questionId: question.id,
          status: 'VOTING',
          durationSec
        });
        const stRes = await callGasApi(statePayload);
        if (!stRes.ok) throw new Error(stRes.error || '受付開始失敗');

        initializedFormFromServer = false;
        writeLog(`質問「${question.id}」を保存して受付を開始しました`);
        await pollAdmin();
      } catch (e) {
        writeLog('エラー: ' + e.message);
      }
    }

    async function deleteSelectedQuestion() {
      const targetId = document.getElementById('qId').value.trim() || document.getElementById('questionSelect').value;
      if (!targetId) return;
      if (!confirm(`質問「${targetId}」を削除しますか？`)) return;

      try {
        const res = await callGasApi({ action: 'delete_question', id: targetId });
        if (!res.ok) throw new Error(res.error || '削除失敗');
        initializedFormFromServer = false;
        writeLog(`質問「${targetId}」を削除しました`);
        await pollAdmin();
      } catch (e) {
        writeLog('削除エラー: ' + e.message);
      }
    }

    async function setStatus(nextStatus) {
      const durationSec = Math.max(0, Number(document.getElementById('durationSec').value || 0));
      const targetId = document.getElementById('qId').value.trim() || currentQuestionId;
      const payload = Object.assign({}, collectAppearancePayload(), {
        action: 'set_state',
        questionId: targetId,
        status: nextStatus
      });
      if (nextStatus === 'VOTING' && durationSec > 0) {
        payload.durationSec = durationSec;
      }

      try {
        const res = await callGasApi(payload);
        if (!res.ok) throw new Error(res.error || '状態更新失敗');
        writeLog(`状態を ${nextStatus} に変更しました`);
        await pollAdmin();
      } catch (e) {
        writeLog('エラー: ' + e.message);
      }
    }

    async function pushAppearance() {
      const payload = Object.assign({}, collectAppearancePayload(), {
        action: 'set_state'
      });
      try {
        const res = await callGasApi(payload);
        if (!res.ok) throw new Error(res.error || '表示設定更新失敗');
        writeLog(`OBS表示を更新: theme=${payload.theme}, pos=${payload.position}, size=${payload.size}`);
      } catch (e) {
        writeLog('エラー: ' + e.message);
      }
    }

    async function clearVotesForCurrent() {
      const targetId = document.getElementById('qId').value.trim() || currentQuestionId;
      if (!confirm(`質問「${targetId}」の投票データをリセットし、resetSeq を進めますか？`)) return;

      try {
        const res = await callGasApi({ action: 'clear_votes', questionId: targetId });
        if (!res.ok) throw new Error(res.error || 'リセット失敗');
        writeLog(`質問「${targetId}」の票をリセットしました（resetSeq=${res.resetSeq}）`);
        await pollAdmin();
      } catch (e) {
        writeLog('エラー: ' + e.message);
      }
    }

    function renderAdminView(data) {
      const { state, question, questions, totalVotes, results } = data;
      const st = state || {};
      const status = st.status || 'WAITING';
      currentQuestionId = st.questionId || (question && question.id) || 'q1';

      const dot = document.getElementById('statusDot');
      dot.className = 'dot ' + status.toLowerCase();
      document.getElementById('currentStatusText').textContent = `状態: ${status} (${currentQuestionId})`;
      document.getElementById('currentTotalText').textContent = ` / 合計 ${Number(totalVotes || 0)} 票`;

      if (ALLOWED_THEMES.includes(st.theme)) {
        document.getElementById('themeSelect').value = st.theme;
      }
      if (ALLOWED_POSITIONS.includes(st.position)) {
        document.getElementById('posSelect').value = st.position;
      }
      if (ALLOWED_SIZES.includes(st.size)) {
        document.getElementById('sizeSelect').value = st.size;
      }

      if (Array.isArray(questions)) {
        cachedQuestions = questions;
        const sel = document.getElementById('questionSelect');
        sel.innerHTML = '';
        questions.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.textContent = `${item.id}: ${item.question} [${item.type}]`;
          if (item.id === currentQuestionId) opt.selected = true;
          sel.appendChild(opt);
        });
      }

      if (!initializedFormFromServer && question) {
        initializedFormFromServer = true;
        fillFormWithQuestion(question);
      }

      const box = document.getElementById('resultsBox');
      if (!results || !results.length) {
        box.innerHTML = '<div class="hint">選択肢または投票データがありません。</div>';
        return;
      }

      const correctLabel = (question && question.type === 'quiz') ? question.answer : '';
      box.innerHTML = results.map(r => {
        const isAns = correctLabel && r.label === correctLabel;
        return `
          <div class="result-row ${isAns ? 'is-answer' : ''}">
            <span><strong>${escapeHtml(r.label)}</strong>${isAns ? ' ★正解' : ''}</span>
            <span>${Number(r.count || 0)}票 (${Number(r.pct || 0)}%)</span>
          </div>
        `;
      }).join('');
    }

    async function pollAdmin() {
      try {
        const data = await callGasApi({ action: 'state' });
        if (data && data.ok) {
          renderAdminView(data);
        }
      } catch (e) {
        writeLog('取得エラー: ' + e.message);
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    const pollMs = (typeof CONFIG !== 'undefined' && CONFIG.POLL_INTERVAL_MS) ? Number(CONFIG.POLL_INTERVAL_MS) : 2000;
    pollAdmin();
    setInterval(pollAdmin, Math.max(1000, pollMs));
  </script>
</body>
</html>
