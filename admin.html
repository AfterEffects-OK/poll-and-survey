<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配信投票 管理パネル</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
      padding: 24px;
    }
    .wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
    .card {
      background: #1f2937;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #374151;
    }
    h2 { margin: 0 0 12px; font-size: 16px; color: #93c5fd; }
    select, button {
      font-size: 15px;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
    }
    select { background: #374151; color: #fff; min-width: 260px; }
    .btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
    button { cursor: pointer; font-weight: 600; background: #2563eb; color: #fff; }
    button:hover { background: #1d4ed8; }
    button.warn { background: #d97706; }
    button.success { background: #059669; }
    button.danger { background: #dc2626; }
    .timer-readout { font-size: 16px; font-weight: 800; color: #fbbf24; margin-left: 6px; }
    .bar-item { margin-top: 10px; }
    .bar-bg { background: #374151; height: 10px; border-radius: 999px; overflow: hidden; margin-top: 4px; }
    .bar-fill { background: #38bdf8; height: 100%; width: 0%; transition: width 0.3s; }
    .meta { color: #9ca3af; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>1. 出題する質問の選択</h2>
      <select id="questionSelect"></select>
      <button onclick="applyQuestion()">この質問に切り替える</button>
      <div class="meta" id="currentInfo">現在の状態: -</div>
    </div>

    <div class="card">
      <h2>2. OBS表示・投票ステータスの切り替え</h2>
      <div class="btn-row">
        <button class="warn" onclick="setStatus('WAITING')">非表示（待機）</button>
        <button class="success" onclick="setStatus('VOTING')">投票受付中（無制限）</button>
        <button onclick="setStatus('CLOSED')">受付終了</button>
        <button onclick="setStatus('RESULT')">結果グラフ表示</button>
        <button class="success" onclick="setStatus('ANSWER')">クイズ正解表示</button>
      </div>

      <div class="btn-row" style="margin-top: 16px; padding-top: 14px; border-top: 1px solid #374151;">
        <select id="timerSec" style="min-width: 120px;">
          <option value="15">15秒</option>
          <option value="30" selected>30秒</option>
          <option value="45">45秒</option>
          <option value="60">60秒</option>
        </select>
        <button class="success" onclick="startTimedVoting()">タイマー付きで投票開始</button>
        <span id="adminTimerReadout" class="timer-readout"></span>
      </div>

      <div class="btn-row" style="margin-top: 16px;">
        <button class="danger" onclick="clearCurrentVotes()">現在の質問の票をリセット</button>
      </div>
      <div class="meta" id="actionLog"></div>
    </div>

    <div class="card">
      <h2>3. リアルタイム集計プレビュー</h2>
      <div id="previewArea">読み込み中...</div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let lastQuestionId = '';
    let currentState = { status: 'WAITING', deadlineAt: 0 };

    function renderAdminCountdown() {
      const el = document.getElementById('adminTimerReadout');
      if (!el) return;
      if (currentState.status === 'VOTING' && currentState.deadlineAt) {
        const remainSec = Math.max(0, Math.ceil((Number(currentState.deadlineAt) - Date.now()) / 1000));
        el.textContent = `残り ${remainSec}秒`;
      } else {
        el.textContent = '';
      }
    }

    async function loadAll() {
      try {
        const data = await fetchGas();
        if (!data.ok) return;

        currentState = data.state;

        const sel = document.getElementById('questionSelect');
        if (sel.options.length !== data.questions.length) {
          sel.innerHTML = '';
          data.questions.forEach(q => {
            const opt = document.createElement('option');
            opt.value = q.id;
            opt.textContent = `[${q.type}] ${q.id}: ${q.question}`;
            sel.appendChild(opt);
          });
        }
        if (data.state.questionId !== lastQuestionId) {
          sel.value = data.state.questionId;
          lastQuestionId = data.state.questionId;
        }

        document.getElementById('currentInfo').textContent =
          `出題中: ${data.question.id}（${data.question.question}） / ステータス: ${data.state.status} / 総票数: ${data.totalVotes}`;

        const prev = document.getElementById('previewArea');
        prev.innerHTML = data.results.map(r => `
          <div class="bar-item">
            <div>${escapeHtml(r.label)}: <strong>${r.count}票</strong> (${r.pct}%)</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${r.pct}%"></div></div>
          </div>
        `).join('');

        renderAdminCountdown();
      } catch (e) {
        console.error(e);
      }
    }

    async function applyQuestion() {
      const questionId = document.getElementById('questionSelect').value;
      const res = await postGas({ action: 'set_state', questionId });
      document.getElementById('actionLog').textContent = res.ok ? '質問を切り替えました。' : res.error;
      loadAll();
    }

    async function setStatus(status) {
      const res = await postGas({ action: 'set_state', status });
      document.getElementById('actionLog').textContent = res.ok ? `ステータスを ${status} に変更しました。` : res.error;
      loadAll();
    }

    async function startTimedVoting() {
      const durationSec = Number(document.getElementById('timerSec').value);
      const res = await postGas({ action: 'set_state', status: 'VOTING', durationSec });
      document.getElementById('actionLog').textContent =
        res.ok ? `${durationSec}秒タイマーで投票を開始しました。` : res.error;
      loadAll();
    }

    async function clearCurrentVotes() {
      if (!confirm('現在選択中の質問の投票ログを削除しますか？')) return;
      const questionId = document.getElementById('questionSelect').value;
      const res = await postGas({ action: 'clear_votes', questionId });
      document.getElementById('actionLog').textContent = res.message || res.error;
      loadAll();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    loadAll();
    setInterval(loadAll, CONFIG.POLL_INTERVAL_MS);
    setInterval(renderAdminCountdown, 200);
  </script>
</body>
</html>
