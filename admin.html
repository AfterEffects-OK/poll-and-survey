<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配信投票 管理パネル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      background: #090d16;
      color: #f8fafc;
      padding: 16px;
    }

    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ヘッダー */
    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px 16px;
      background: #141c2b;
      border: 2px solid #2b3a55;
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 12px;
    }

    .header-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .header-title {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
    }

    .context-pill {
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #0b101b;
      color: #7dd3fc;
      border: 1px solid #38bdf8;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .copy-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 8px;
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #475569;
      cursor: pointer;
    }
    .copy-btn:hover {
      border-color: #38bdf8;
      background: #263449;
      color: #ffffff;
    }

    /* 配信（room）切替バー */
    .room-switcher-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 14px;
      background: #111827;
      border: 2px solid #2b3a55;
      border-radius: 12px;
      padding: 10px 18px;
      margin-bottom: 16px;
    }

    .room-switcher-form {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex: 1 1 320px;
    }

    .room-switcher-label {
      font-size: 13px;
      font-weight: 800;
      color: #93c5fd;
      white-space: nowrap;
    }

    .room-input-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 220px;
      max-width: 360px;
    }

    .room-input-wrap input[type="text"] {
      font-size: 14px;
      font-weight: 700;
      padding: 7px 11px;
      border-radius: 8px;
    }

    .room-history-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .room-history-caption {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
    }

    button.room-chip {
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #0b101b;
      color: #cbd5e1;
      border: 1px solid #334155;
      cursor: pointer;
    }

    button.room-chip:hover {
      border-color: #38bdf8;
      color: #ffffff;
      background: #172236;
    }

    button.room-chip.is-current {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #60a5fa;
    }

    /* 2カラムレイアウト */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      align-items: start;
    }

    @media (min-width: 980px) {
      .main-layout {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      }
      .monitor-column {
        position: sticky;
        top: 16px;
      }
    }

    .column-stack {
      display: grid;
      gap: 16px;
    }

    /* カード */
    .card {
      background: #141c2b;
      border: 2px solid #2b3a55;
      border-radius: 12px;
      padding: 16px 18px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #24334d;
    }

    .card-title {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: #7dd3fc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
    }

    .type-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      background: #1e3a8a;
      color: #dbeafe;
      border: 1px solid #60a5fa;
    }
    .type-badge.quiz {
      background: #831843;
      color: #fce7f3;
      border-color: #f472b6;
    }

    /* フォーム・ラベル */
    .field {
      margin-bottom: 14px;
    }
    .field:last-child {
      margin-bottom: 0;
    }

    .lbl {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    select, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 8px;
      background: #0b101b;
      color: #ffffff;
      border: 1.5px solid #475569;
    }

    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .inline-select-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    @media (max-width: 520px) {
      .inline-select-row {
        grid-template-columns: 1fr;
      }
    }

    /* ステータスボタン */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    button.btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      color: #ffffff;
      background: #2563eb;
      text-align: center;
      transition: filter 0.12s ease, transform 0.06s ease;
    }
    button.btn.btn-sm {
      font-size: 13px;
      padding: 7px 12px;
    }
    button.btn:hover:not(:disabled) {
      filter: brightness(1.12);
    }
    button.btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    button.btn-green { background: #059669; }
    button.btn-amber { background: #d97706; }
    button.btn-sky { background: #0284c7; }
    button.btn-red { background: #dc2626; }
    button.btn-gray { background: #334155; border-color: #64748b; }

    button.btn.is-current {
      border-color: #ffffff;
      box-shadow: 0 0 0 2px #38bdf8;
    }

    /* タイマー行 */
    .timer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .timer-row select {
      width: auto;
      min-width: 100px;
    }

    .timer-badge {
      font-size: 14px;
      font-weight: 800;
      color: #fde047;
      padding: 5px 10px;
      border-radius: 8px;
      background: #0b101b;
      border: 1px solid #eab308;
    }
    .timer-badge:empty {
      display: none;
    }

    /* OBS表示設定：2カラム整理 */
    .obs-controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 680px) {
      .obs-controls-grid {
        grid-template-columns: 1.15fr 0.85fr;
        align-items: start;
      }
    }

    .obs-sub-box {
      background: #0e1522;
      border: 1px solid #25344f;
      border-radius: 10px;
      padding: 12px;
    }

    /* テーマチップ */
    .theme-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    button.theme-chip {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      color: #f1f5f9;
      background: #0b101b;
      border: 1.5px solid #334155;
      border-radius: 999px;
      padding: 6px 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.12s ease, background 0.12s ease;
    }

    button.theme-chip:hover {
      border-color: #94a3b8;
      background: #172236;
    }

    button.theme-chip.is-active {
      color: #ffffff;
      background: #1e2d47;
      border-color: var(--chip-color, #38bdf8);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18);
    }

    .chip-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--chip-color, #38bdf8);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }

    /* OBS表示位置 3x3 */
    .pos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    button.pos-btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      color: #e2e8f0;
      background: #0b101b;
      border: 1.5px solid #334155;
      border-radius: 7px;
      padding: 8px 6px;
      cursor: pointer;
      text-align: center;
      line-height: 1.2;
    }

    button.pos-btn:hover {
      border-color: #38bdf8;
      background: #172236;
      color: #ffffff;
    }

    button.pos-btn.is-active {
      color: #ffffff;
      background: #1d4ed8;
      border-color: #ffffff;
      box-shadow: 0 0 0 2px #38bdf8;
    }

    .pos-spacer {
      background: rgba(15, 23, 42, 0.35);
      border: 1px dashed #233047;
      border-radius: 7px;
      min-height: 34px;
    }

    /* OBS表示サイズ切替 */
    .size-switch-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    button.size-btn {
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 800;
      color: #e2e8f0;
      background: #0b101b;
      border: 1.5px solid #334155;
      border-radius: 8px;
      padding: 8px 8px;
      cursor: pointer;
      text-align: center;
    }

    button.size-btn:hover {
      border-color: #38bdf8;
      background: #172236;
      color: #ffffff;
    }

    button.size-btn.is-active {
      color: #ffffff;
      background: #0284c7;
      border-color: #ffffff;
      box-shadow: 0 0 0 2px #38bdf8;
    }

    .divider {
      margin: 14px 0;
      border: 0;
      border-top: 1px solid #24334d;
    }

    /* 操作ログ */
    .log-panel {
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: 8px;
      background: #0b101b;
      border-left: 4px solid #38bdf8;
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 700;
    }

    /* 右カラム：現在の状態 */
    .live-card {
      background: #172236;
      border: 2px solid #3b82f6;
    }

    .live-status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .state-pill {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      background: #334155;
      color: #ffffff;
    }
    .state-pill.voting { background: #047857; border: 1.5px solid #34d399; }
    .state-pill.waiting { background: #b45309; border: 1.5px solid #fbbf24; }
    .state-pill.closed { background: #334155; border: 1.5px solid #94a3b8; }
    .state-pill.result { background: #0369a1; border: 1.5px solid #38bdf8; }
    .state-pill.answer { background: #9d174d; border: 1.5px solid #f472b6; }

    .live-metrics {
      font-size: 15px;
      font-weight: 800;
      color: #fde047;
    }

    .live-question-box {
      background: #0b101b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
    }

    .live-q-meta {
      font-size: 12px;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 4px;
    }

    .live-q-title {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      word-break: break-word;
    }

    /* 集計プレビュー */
    .result-item {
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0b101b;
      border: 1px solid #2b3b55;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .result-num {
      font-size: 13px;
      font-weight: 800;
      color: #7dd3fc;
      white-space: nowrap;
    }

    .bar-track {
      width: 100%;
      height: 11px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.3s ease;
    }

    /* 選択肢入力行 */
    .opt-list {
      display: grid;
      gap: 8px;
      margin-bottom: 8px;
    }

    .opt-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .opt-num {
      font-size: 14px;
      font-weight: 800;
      color: #7dd3fc;
      background: #0b101b;
      border: 1.5px solid #3b82f6;
      border-radius: 8px;
      min-width: 34px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .opt-item input[type="text"] {
      flex: 1;
    }

    button.btn-del-opt {
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      padding: 8px 12px;
      border-radius: 8px;
      background: #334155;
      color: #fecaca;
      border: 1.5px solid #ef4444;
      cursor: pointer;
    }
    button.btn-del-opt:hover:not(:disabled) {
      background: #dc2626;
      color: #ffffff;
    }
    button.btn-del-opt:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* アコーディオン */
    .acc-card {
      padding: 0;
      overflow: hidden;
    }
    button.acc-toggle {
      width: 100%;
      font-family: inherit;
      background: #141c2b;
      color: #7dd3fc;
      border: none;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      text-align: left;
    }
    button.acc-toggle:hover {
      background: #1b263b;
    }
    .acc-body {
      display: none;
      padding: 16px 18px;
      border-top: 1px solid #24334d;
    }
    .acc-card.open .acc-body {
      display: block;
    }
    .acc-arrow {
      transition: transform 0.2s ease;
    }
    .acc-card.open .acc-arrow {
      transform: rotate(180deg);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      background: #141c2b;
      color: #f8fafc;
      border: 2px solid #ef4444;
      border-radius: 16px;
      padding: 22px 20px;
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.6);
      transform: translateY(8px) scale(0.97);
      transition: transform 0.2s ease;
    }

    .modal-backdrop.open .modal-box {
      transform: translateY(0) scale(1);
    }

    .modal-title {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 800;
      color: #fca5a5;
    }

    .modal-message {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .modal-target-box {
      display: none;
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #0b101b;
      border: 1px solid #334155;
    }

    .modal-target-box.show {
      display: block;
    }

    .modal-target-id {
      font-size: 12px;
      font-weight: 800;
      color: #7dd3fc;
      margin-bottom: 3px;
    }

    .modal-target-text {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      word-break: break-word;
    }

    .modal-sub {
      margin: 0 0 18px;
      font-size: 13px;
      color: #94a3b8;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.08s ease;
    }

    .modal-btn:active {
      transform: scale(0.98);
    }

    .modal-btn.cancel {
      background: #334155;
      color: #f8fafc;
    }

    .modal-btn.cancel:hover {
      background: #475569;
    }

    .modal-btn.danger {
      background: #ef4444;
      color: #ffffff;
    }

    .modal-btn.danger:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="header-bar">
      <div class="header-left">
        <h1 class="header-title">配信投票・クイズ 管理パネル</h1>
        <span id="contextBadge" class="context-pill">room: default / admin: default</span>
      </div>
      <div class="header-actions">
        <button type="button" class="copy-btn" onclick="copyPageUrl('obs.html')">OBS用URLをコピー</button>
        <button type="button" class="copy-btn" onclick="copyPageUrl('index.html')">回答者用URLをコピー</button>
      </div>
    </header>

    <!-- 配信（room）即時切替バー -->
    <section class="room-switcher-bar" aria-label="配信ルーム切替">
      <form class="room-switcher-form" onsubmit="handleRoomSwitchSubmit(event)">
        <label class="room-switcher-label" for="roomSwitchInput">配信（room）ID</label>
        <div class="room-input-wrap">
          <input
            id="roomSwitchInput"
            type="text"
            placeholder="例: live_20261123"
            autocomplete="off"
          />
          <button type="submit" class="btn btn-sky btn-sm">配信切替</button>
          <button type="button" class="btn btn-gray btn-sm" onclick="switchRoom('default')">default</button>
        </div>
      </form>
      <div id="roomHistoryList" class="room-history-list"></div>
    </section>

    <div class="main-layout">
      <!-- 左カラム：配信中操作＋OBS表示設定＋質問編集 -->
      <div class="column-stack">
        <!-- 1. 出題切替＆ステータス・タイマー -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title"><span class="step-num">1</span>出題・受付ステータス操作</h2>
            <span id="statusModeTag" class="type-badge">アンケート</span>
          </div>

          <div class="field">
            <label class="lbl" for="questionSelect">出題する質問</label>
            <div class="inline-select-row">
              <select id="questionSelect" onchange="onQuestionSelectChange()"></select>
              <button type="button" class="btn" onclick="applyQuestion()">出題切替</button>
            </div>
          </div>

          <div class="field">
            <span class="lbl">表示・受付ステータス</span>
            <div id="statusBtnRow" class="status-grid"></div>
          </div>

          <div class="field">
            <label class="lbl" for="timerSec">制限時間タイマー</label>
            <div class="timer-row">
              <select id="timerSec">
                <option value="15">15秒</option>
                <option value="30" selected>30秒</option>
                <option value="45">45秒</option>
                <option value="60">60秒</option>
              </select>
              <button type="button" id="timedVoteBtn" class="btn btn-green" onclick="startTimedVoting()">タイマー付きで投票開始</button>
              <span id="adminTimerReadout" class="timer-badge"></span>
            </div>
          </div>

          <div id="actionLog" class="log-panel">操作結果がここに表示されます。</div>
        </section>

        <!-- 2. OBS表示設定（テーマ・3×3位置・サイズ） -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title"><span class="step-num">2</span>OBS表示設定（テーマ・位置・サイズ）</h2>
          </div>

          <div class="obs-controls-grid">
            <div class="obs-sub-box">
              <span class="lbl">テーマ（OBS＋回答者同期）</span>
              <div id="themeChipGrid" class="theme-chip-grid" role="group" aria-label="テーマ選択"></div>
            </div>

            <div class="obs-sub-box">
              <span class="lbl">OBS表示位置（3×3配置）</span>
              <div id="posGrid" class="pos-grid" role="group" aria-label="OBS表示位置"></div>

              <hr class="divider" style="margin:10px 0;" />

              <span class="lbl">OBS表示サイズ</span>
              <div id="sizeSwitchRow" class="size-switch-row" role="group" aria-label="OBS表示サイズ">
                <button type="button" id="sizeBtnCompact" class="size-btn" onclick="selectSizeButton('compact')">コンパクト</button>
                <button type="button" id="sizeBtnNormal" class="size-btn is-active" onclick="selectSizeButton('normal')">通常サイズ</button>
                <button type="button" id="sizeBtnLarge" class="size-btn" onclick="selectSizeButton('large')">拡大表示</button>
              </div>
            </div>
          </div>
        </section>

        <!-- 3. 質問の作成・編集・削除（折りたたみ） -->
        <section id="questionAccordion" class="card acc-card">
          <button type="button" class="acc-toggle" onclick="toggleAccordion()" aria-expanded="false" aria-controls="questionAccordionPanel">
            <span style="display:flex;align-items:center;gap:8px;">
              <span class="step-num">3</span>質問の作成・編集・削除（admin共通）
            </span>
            <span class="acc-arrow">▼</span>
          </button>

          <div id="questionAccordionPanel" class="acc-body" onfocusin="markEditing(true)">
            <div class="field">
              <label class="lbl" for="editTargetSelect">編集対象</label>
              <div class="inline-select-row">
                <select id="editTargetSelect" onchange="onSelectEditTarget()">
                  <option value="__NEW__">＋ 新しい質問を作成</option>
                </select>
                <button type="button" class="btn btn-red" onclick="deleteSelectedQuestion()">削除</button>
              </div>
            </div>

            <div class="inline-select-row field">
              <div>
                <label class="lbl" for="qIdInput">質問ID（空欄で自動採番）</label>
                <input id="qIdInput" type="text" placeholder="例: q3" />
              </div>

              <div>
                <label class="lbl" for="qTypeInput">種別</label>
                <select id="qTypeInput" onchange="onQuestionTypeInputChange()">
                  <option value="poll">アンケート（poll）</option>
                  <option value="quiz">クイズ（quiz）</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label class="lbl" for="qTextInput">質問文</label>
              <input id="qTextInput" type="text" placeholder="例: 次の配信でやってほしい企画は？" />
            </div>

            <div class="field">
              <span class="lbl">選択肢（1つずつ別枠・2つ以上）</span>
              <div id="optionsList" class="opt-list"></div>
              <button type="button" class="btn btn-gray" onclick="addOptionRow('', true)">＋ 選択肢を追加</button>
            </div>

            <div id="quizAnswerWrap" class="field" style="display: none;">
              <label class="lbl" for="qAnswerSelect">クイズの正解（quizの場合のみ）</label>
              <select id="qAnswerSelect"></select>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;">
              <button type="button" class="btn btn-green" onclick="saveQuestion()">質問を保存する</button>
              <button type="button" class="btn btn-gray" onclick="resetEditorForm()">入力をクリア</button>
            </div>
          </div>
        </section>
      </div>

      <!-- 右カラム：現在の状態＋リアルタイム集計 -->
      <div class="column-stack monitor-column">
        <section class="card live-card">
          <div class="card-header">
            <h2 class="card-title">現在の配信状態</h2>
            <span id="liveTimerLabel" class="timer-badge"></span>
          </div>

          <div class="live-status-row">
            <span id="liveStatusBadge" class="state-pill waiting">待機中</span>
            <span id="liveVotesLabel" class="live-metrics">総票数: 0 票</span>
          </div>

          <div class="live-question-box">
            <div id="liveQuestionMeta" class="live-q-meta">出題中の質問</div>
            <div id="liveQuestionLabel" class="live-q-title">読み込み中...</div>
          </div>
        </section>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">リアルタイム集計結果</h2>
            <button type="button" class="btn btn-red" style="padding:6px 12px;font-size:12.5px;" onclick="clearCurrentVotes()">票をリセット</button>
          </div>
          <div id="previewArea">読み込み中...</div>
        </section>
      </div>
    </div>
  </div>

  <div id="confirmModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle" class="modal-title">投票ログの削除確認</h3>
      <p id="modalMessage" class="modal-message">現在選択中の質問の投票ログを削除しますか？</p>
      <div id="modalTargetBox" class="modal-target-box">
        <div id="modalTargetId" class="modal-target-id"></div>
        <div id="modalTargetText" class="modal-target-text"></div>
      </div>
      <p class="modal-sub">※削除した投票データは元に戻せません。</p>
      <div class="modal-actions">
        <button type="button" id="modalCancelBtn" class="modal-btn cancel">キャンセル</button>
        <button type="button" id="modalOkBtn" class="modal-btn danger">削除する</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const DEFAULT_ROOM = (typeof CONFIG !== 'undefined' && CONFIG.DEFAULT_ROOM_ID) ? CONFIG.DEFAULT_ROOM_ID : 'default';
    const DEFAULT_ADMIN = (typeof CONFIG !== 'undefined' && CONFIG.DEFAULT_ADMIN_ID) ? CONFIG.DEFAULT_ADMIN_ID : 'default';
    const ROOM_HISTORY_KEY = 'stream_poll_recent_rooms';

    let ROOM_ID = typeof getRoomId === 'function' ? getRoomId() : DEFAULT_ROOM;
    let ADMIN_ID = typeof getAdminId === 'function' ? getAdminId() : DEFAULT_ADMIN;

    let lastQuestionId = '';
    let latestQuestions = [];
    let currentState = { status: 'WAITING', deadlineAt: 0, theme: 'dark', position: 'bottom-right', size: 'normal' };
    let isObsAppearanceDirty = false;
    let isEditingQuestionForm = false;

    const THEME_OPTIONS = [
      { key: 'dark',      label: 'ダークモダン',       color: '#38bdf8' },
      { key: 'yellow',    label: 'サンシャインイエロー', color: '#facc15' },
      { key: 'neon',      label: 'ネオンアーケード',     color: '#ec4899' },
      { key: 'pop',       label: 'ライトポップ',       color: '#2563eb' },
      { key: 'cyber',     label: 'サイバーグリーン',   color: '#10b981' },
      { key: 'sakura',    label: 'サクラパステル',     color: '#fb7185' },
      { key: 'broadcast', label: 'TVニュース風',       color: '#ef4444' }
    ];

    const POSITION_SLOTS = [
      { key: 'top-left',      label: '↖ 左上' },
      { key: 'top-center',    label: '↑ 上部中央' },
      { key: 'top-right',     label: '↗ 右上' },
      { key: null,            label: '' },
      { key: 'center',        label: '◎ 中央' },
      { key: null,            label: '' },
      { key: 'bottom-left',   label: '↙ 左下' },
      { key: 'bottom-center', label: '↓ 下部中央' },
      { key: 'bottom-right',  label: '↘ 右下' }
    ];

    const SIZE_LABELS = {
      normal: '通常',
      compact: 'コンパクト',
      large: '拡大'
    };

    let selectedTheme = 'dark';
    let selectedPosition = 'bottom-right';
    let selectedSize = 'normal';

    const STATUS_LABELS = {
      WAITING: '待機中（非表示）',
      VOTING: '受付中',
      CLOSED: '受付終了',
      RESULT: '結果表示中',
      ANSWER: '正解発表中'
    };

    const BUTTON_CONFIGS = {
      poll: [
        { status: 'WAITING', label: '非表示（待機）', cls: 'btn-amber' },
        { status: 'VOTING', label: '投票受付中', cls: 'btn-green' },
        { status: 'CLOSED', label: '投票受付終了', cls: 'btn-gray' },
        { status: 'RESULT', label: 'アンケート結果表示', cls: 'btn-sky' }
      ],
      quiz: [
        { status: 'WAITING', label: '非表示（待機）', cls: 'btn-amber' },
        { status: 'VOTING', label: '回答受付中', cls: 'btn-green' },
        { status: 'CLOSED', label: '回答受付終了', cls: 'btn-gray' },
        { status: 'RESULT', label: '集計結果表示', cls: 'btn-sky' },
        { status: 'ANSWER', label: 'クイズ正解表示', cls: 'btn-green' }
      ]
    };

    function normalizeRoomId(raw) {
      const cleaned = String(raw || '')
        .trim()
        .replace(/[^a-zA-Z0-9_@-]/g, '');
      return cleaned || DEFAULT_ROOM;
    }

    function getRecentRooms() {
      try {
        const raw = localStorage.getItem(ROOM_HISTORY_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.map(r => normalizeRoomId(r)).filter(Boolean) : [];
      } catch (e) {
        return [];
      }
    }

    function rememberRoom(roomId) {
      const safe = normalizeRoomId(roomId);
      const list = [safe, ...getRecentRooms().filter(r => r !== safe)].slice(0, 6);
      try {
        localStorage.setItem(ROOM_HISTORY_KEY, JSON.stringify(list));
      } catch (e) {}
      renderRoomHistoryChips();
    }

    function renderRoomHistoryChips() {
      const wrap = document.getElementById('roomHistoryList');
      if (!wrap) return;

      const rooms = getRecentRooms();
      if (!rooms.length) {
        wrap.innerHTML = '';
        return;
      }

      wrap.innerHTML = '<span class="room-history-caption">履歴:</span>';
      rooms.forEach(room => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'room-chip' + (room === ROOM_ID ? ' is-current' : '');
        btn.textContent = room;
        btn.onclick = () => switchRoom(room);
        wrap.appendChild(btn);
      });
    }

    function syncRoomInputAndUrl() {
      const input = document.getElementById('roomSwitchInput');
      if (input) {
        input.value = ROOM_ID;
      }

      try {
        const url = new URL(window.location.href);
        if (ROOM_ID && ROOM_ID !== DEFAULT_ROOM) {
          url.searchParams.set('room', ROOM_ID);
        } else {
          url.searchParams.delete('room');
        }
        window.history.replaceState({}, '', url.toString());
      } catch (e) {}
    }

    async function switchRoom(nextRoomRaw) {
      const nextRoom = normalizeRoomId(nextRoomRaw);
      ROOM_ID = nextRoom;
      lastQuestionId = '';
      isObsAppearanceDirty = false;
      syncRoomInputAndUrl();
      renderContextBadge();
      rememberRoom(ROOM_ID);
      setLog(`配信「${ROOM_ID}」に切り替えました。`);
      await loadAll();
    }

    function handleRoomSwitchSubmit(event) {
      event.preventDefault();
      const input = document.getElementById('roomSwitchInput');
      switchRoom(input ? input.value : DEFAULT_ROOM);
    }

    function renderContextBadge() {
      const badge = document.getElementById('contextBadge');
      if (badge) {
        badge.textContent = `room: ${ROOM_ID} / admin: ${ADMIN_ID}`;
      }
    }

    function showConfirmPopup(message, options = {}) {
      const {
        title = '投票ログの削除確認',
        okText = '削除する',
        cancelText = 'キャンセル',
        detail = null
      } = options;

      return new Promise((resolve) => {
        const modal = document.getElementById('confirmModal');
        const titleEl = document.getElementById('modalTitle');
        const msgEl = document.getElementById('modalMessage');
        const targetBox = document.getElementById('modalTargetBox');
        const targetIdEl = document.getElementById('modalTargetId');
        const targetTextEl = document.getElementById('modalTargetText');
        const okBtn = document.getElementById('modalOkBtn');
        const cancelBtn = document.getElementById('modalCancelBtn');

        if (!modal || !msgEl || !okBtn || !cancelBtn) {
          resolve(window.confirm(message));
          return;
        }

        if (titleEl) titleEl.textContent = title;
        msgEl.textContent = message;
        okBtn.textContent = okText;
        cancelBtn.textContent = cancelText;

        if (targetBox && targetIdEl && targetTextEl) {
          if (detail && (detail.id || detail.text)) {
            targetIdEl.textContent = detail.id ? `質問ID: ${detail.id}` : '対象質問';
            targetTextEl.textContent = detail.text || '（質問文なし）';
            targetBox.classList.add('show');
          } else {
            targetIdEl.textContent = '';
            targetTextEl.textContent = '';
            targetBox.classList.remove('show');
          }
        }

        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        cancelBtn.focus();

        const cleanup = (result) => {
          modal.classList.remove('open');
          modal.setAttribute('aria-hidden', 'true');
          okBtn.removeEventListener('click', onOk);
          cancelBtn.removeEventListener('click', onCancel);
          modal.removeEventListener('click', onBackdrop);
          document.removeEventListener('keydown', onKeyDown);
          resolve(result);
        };

        const onOk = () => cleanup(true);
        const onCancel = () => cleanup(false);
        const onBackdrop = (e) => {
          if (e.target === modal) cleanup(false);
        };
        const onKeyDown = (e) => {
          if (e.key === 'Escape') cleanup(false);
        };

        okBtn.addEventListener('click', onOk);
        cancelBtn.addEventListener('click', onCancel);
        modal.addEventListener('click', onBackdrop);
        document.addEventListener('keydown', onKeyDown);
      });
    }

    function renderThemeChips() {
      const grid = document.getElementById('themeChipGrid');
      if (!grid) return;

      grid.innerHTML = '';
      THEME_OPTIONS.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'theme-chip' + (selectedTheme === item.key ? ' is-active' : '');
        btn.style.setProperty('--chip-color', item.color);
        btn.setAttribute('aria-pressed', String(selectedTheme === item.key));

        const dot = document.createElement('span');
        dot.className = 'chip-dot';

        const txt = document.createElement('span');
        txt.textContent = item.label;

        btn.appendChild(dot);
        btn.appendChild(txt);
        btn.onclick = () => selectThemeChip(item.key);
        grid.appendChild(btn);
      });
    }

    async function selectThemeChip(themeKey) {
      selectedTheme = themeKey;
      isObsAppearanceDirty = true;
      renderThemeChips();
      await applyObsAppearance();
    }

    function renderPositionButtons() {
      const grid = document.getElementById('posGrid');
      if (!grid) return;

      grid.innerHTML = '';
      POSITION_SLOTS.forEach(slot => {
        if (!slot.key) {
          const spacer = document.createElement('div');
          spacer.className = 'pos-spacer';
          spacer.setAttribute('aria-hidden', 'true');
          grid.appendChild(spacer);
          return;
        }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pos-btn' + (selectedPosition === slot.key ? ' is-active' : '');
        btn.textContent = slot.label;
        btn.setAttribute('aria-pressed', String(selectedPosition === slot.key));
        btn.onclick = () => selectPositionButton(slot.key);
        grid.appendChild(btn);
      });
    }

    async function selectPositionButton(posKey) {
      selectedPosition = posKey;
      isObsAppearanceDirty = true;
      renderPositionButtons();
      await applyObsAppearance();
    }

    function renderSizeButtons() {
      const map = [
        { id: 'sizeBtnNormal', key: 'normal' },
        { id: 'sizeBtnCompact', key: 'compact' },
        { id: 'sizeBtnLarge', key: 'large' }
      ];
      map.forEach(({ id, key }) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        const active = selectedSize === key;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', String(active));
      });
    }

    async function selectSizeButton(sizeKey) {
      selectedSize = (sizeKey === 'compact' || sizeKey === 'large') ? sizeKey : 'normal';
      isObsAppearanceDirty = true;
      renderSizeButtons();
      await applyObsAppearance();
    }

    function setLog(message) {
      const el = document.getElementById('actionLog');
      if (el && message) {
        el.textContent = message;
      }
    }

    function copyPageUrl(filename) {
      const url = new URL('./' + filename, window.location.href);
      if (ROOM_ID && ROOM_ID !== DEFAULT_ROOM) {
        url.searchParams.set('room', ROOM_ID);
      }
      if (ADMIN_ID && ADMIN_ID !== DEFAULT_ADMIN) {
        url.searchParams.set('admin', ADMIN_ID);
      }
      const href = url.href;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(href)
          .then(() => setLog(`${filename} のURLをコピーしました: ${href}`))
          .catch(() => setLog(`URL: ${href}`));
      } else {
        setLog(`URL: ${href}`);
      }
    }

    function markEditing(editing) {
      isEditingQuestionForm = Boolean(editing);
    }

    function renderStatusButtons(type) {
      const normalizedType = type === 'quiz' ? 'quiz' : 'poll';
      const tag = document.getElementById('statusModeTag');
      if (tag) {
        tag.textContent = normalizedType === 'quiz' ? 'クイズ' : 'アンケート';
        tag.className = 'type-badge' + (normalizedType === 'quiz' ? ' quiz' : '');
      }

      const timedBtn = document.getElementById('timedVoteBtn');
      if (timedBtn) {
        timedBtn.textContent = normalizedType === 'quiz'
          ? 'タイマー付きで回答開始'
          : 'タイマー付きで投票開始';
      }

      const row = document.getElementById('statusBtnRow');
      if (!row) return;

      const defs = BUTTON_CONFIGS[normalizedType];
      row.innerHTML = '';
      defs.forEach(def => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = def.label;
        const classes = ['btn'];
        if (def.cls) classes.push(def.cls);
        if (currentState && currentState.status === def.status) classes.push('is-current');
        btn.className = classes.join(' ');
        btn.onclick = () => setStatus(def.status);
        row.appendChild(btn);
      });
    }

    function updateMonitorPanel(data) {
      const st = (data.state && data.state.status) || 'WAITING';
      const badge = document.getElementById('liveStatusBadge');
      if (badge) {
        badge.textContent = STATUS_LABELS[st] || st;
        badge.className = 'state-pill ' + st.toLowerCase();
      }

      const vLabel = document.getElementById('liveVotesLabel');
      if (vLabel) {
        vLabel.textContent = `総票数: ${Number(data.totalVotes || 0)} 票`;
      }

      const metaEl = document.getElementById('liveQuestionMeta');
      const qLabel = document.getElementById('liveQuestionLabel');
      if (data.question) {
        if (metaEl) {
          const typeText = data.question.type === 'quiz' ? 'クイズ' : 'アンケート';
          const sizeKey = currentState.size || selectedSize;
          const sizeText = SIZE_LABELS[sizeKey] || '通常';
          metaEl.textContent = `[room: ${ROOM_ID}] 出題中 [${data.question.id} / ${typeText}] ・ テーマ: ${currentState.theme} ・ 位置: ${currentState.position} ・ サイズ: ${sizeText}`;
        }
        if (qLabel) {
          qLabel.textContent = data.question.question;
        }
      }
    }

    function onQuestionSelectChange() {
      const selId = document.getElementById('questionSelect').value;
      const found = latestQuestions.find(q => q.id === selId);
      if (found) {
        renderStatusButtons(found.type);
      }
    }

    function onQuestionTypeInputChange() {
      const isQuiz = document.getElementById('qTypeInput').value === 'quiz';
      document.getElementById('quizAnswerWrap').style.display = isQuiz ? 'block' : 'none';
      if (isQuiz) {
        syncAnswerSelectOptions();
      }
    }

    function getOptionInputs() {
      return [...document.querySelectorAll('#optionsList .opt-item input[type="text"]')];
    }

    function getOptionValues() {
      return getOptionInputs()
        .map(inp => inp.value.trim())
        .filter(Boolean);
    }

    function syncAnswerSelectOptions(preferredAnswer) {
      const ansSel = document.getElementById('qAnswerSelect');
      if (!ansSel) return;
      const targetVal = typeof preferredAnswer === 'string' ? preferredAnswer : ansSel.value;
      const opts = getOptionValues();

      ansSel.innerHTML = '<option value="">（正解を選択してください）</option>';
      opts.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        ansSel.appendChild(o);
      });

      if (targetVal && opts.includes(targetVal)) {
        ansSel.value = targetVal;
      } else {
        ansSel.value = '';
      }
    }

    function refreshOptionRowMeta() {
      const rows = [...document.querySelectorAll('#optionsList .opt-item')];
      rows.forEach((row, idx) => {
        const numEl = row.querySelector('.opt-num');
        const delBtn = row.querySelector('.btn-del-opt');
        if (numEl) numEl.textContent = `${idx + 1}`;
        if (delBtn) delBtn.disabled = rows.length <= 2;
      });
      syncAnswerSelectOptions();
    }

    function addOptionRow(initialValue = '', focusNew = false) {
      markEditing(true);
      const list = document.getElementById('optionsList');
      const row = document.createElement('div');
      row.className = 'opt-item';

      const numSpan = document.createElement('span');
      numSpan.className = 'opt-num';

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '選択肢を入力';
      input.value = initialValue;
      input.addEventListener('input', () => {
        markEditing(true);
        syncAnswerSelectOptions();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addOptionRow('', true);
        }
      });

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-del-opt';
      delBtn.title = 'この選択肢を削除';
      delBtn.textContent = '×';
      delBtn.onclick = () => {
        markEditing(true);
        if (list.querySelectorAll('.opt-item').length <= 2) return;
        row.remove();
        refreshOptionRowMeta();
      };

      row.appendChild(numSpan);
      row.appendChild(input);
      row.appendChild(delBtn);
      list.appendChild(row);

      refreshOptionRowMeta();
      if (focusNew) {
        input.focus();
      }
    }

    function setOptionRows(optionsArr, selectedAnswer = '') {
      const list = document.getElementById('optionsList');
      list.innerHTML = '';
      const items = Array.isArray(optionsArr) && optionsArr.length >= 2
        ? optionsArr
        : (Array.isArray(optionsArr) && optionsArr.length === 1 ? [optionsArr[0], ''] : ['', '']);
      items.forEach(opt => addOptionRow(opt, false));
      syncAnswerSelectOptions(selectedAnswer);
    }

    document.addEventListener('DOMContentLoaded', () => {
      syncRoomInputAndUrl();
      renderContextBadge();
      rememberRoom(ROOM_ID);
      renderStatusButtons('poll');
      renderThemeChips();
      renderPositionButtons();
      renderSizeButtons();
      setOptionRows(['', ''], '');
      onQuestionTypeInputChange();
    });

    function syncObsAppearanceInputs(state) {
      if (isObsAppearanceDirty || !state) return;
      if (state.theme && THEME_OPTIONS.some(t => t.key === state.theme)) {
        selectedTheme = state.theme;
        renderThemeChips();
      }
      if (state.position && POSITION_SLOTS.some(p => p.key === state.position)) {
        selectedPosition = state.position;
        renderPositionButtons();
      }
      if (state.size === 'normal' || state.size === 'compact' || state.size === 'large') {
        selectedSize = state.size;
        renderSizeButtons();
      }
    }

    async function applyObsAppearance() {
      const theme = selectedTheme || 'dark';
      const position = selectedPosition || 'bottom-right';
      const size = selectedSize || 'normal';
      const res = await postGas({ action: 'set_state', roomId: ROOM_ID, adminId: ADMIN_ID, theme, position, size });
      isObsAppearanceDirty = false;
      setLog(res.ok ? `[room: ${ROOM_ID}] OBS表示を「${theme} / ${position} / ${SIZE_LABELS[size] || '通常'}」に更新しました。` : res.error);
      loadAll();
    }

    function toggleAccordion(forceOpen) {
      const card = document.getElementById('questionAccordion');
      const btn = card.querySelector('.acc-toggle');
      const nextOpen = typeof forceOpen === 'boolean' ? forceOpen : !card.classList.contains('open');
      card.classList.toggle('open', nextOpen);
      btn.setAttribute('aria-expanded', String(nextOpen));
      if (!nextOpen) {
        markEditing(false);
      }
    }

    function renderAdminCountdown() {
      const badgeEl = document.getElementById('adminTimerReadout');
      const liveEl = document.getElementById('liveTimerLabel');
      if (currentState.status === 'VOTING' && currentState.deadlineAt) {
        const remainSec = Math.max(0, Math.ceil((Number(currentState.deadlineAt) - Date.now()) / 1000));
        const txt = `残り ${remainSec}秒`;
        if (badgeEl) badgeEl.textContent = txt;
        if (liveEl) liveEl.textContent = txt;
      } else {
        if (badgeEl) badgeEl.textContent = '';
        if (liveEl) liveEl.textContent = '';
      }
    }

    function refreshEditTargetSelect() {
      const editSel = document.getElementById('editTargetSelect');
      if (!editSel) return;
      const prevVal = editSel.value;
      editSel.innerHTML = '<option value="__NEW__">＋ 新しい質問を作成</option>';
      latestQuestions.forEach(q => {
        const opt = document.createElement('option');
        opt.value = q.id;
        opt.textContent = `編集: [${q.type}] ${q.id} - ${q.question}`;
        editSel.appendChild(opt);
      });
      if ([...editSel.options].some(o => o.value === prevVal)) {
        editSel.value = prevVal;
      }
    }

    function onSelectEditTarget() {
      markEditing(true);
      const val = document.getElementById('editTargetSelect').value;
      if (val === '__NEW__') {
        resetEditorForm();
        return;
      }
      const q = latestQuestions.find(item => item.id === val);
      if (!q) return;
      document.getElementById('qIdInput').value = q.id;
      document.getElementById('qTypeInput').value = q.type || 'poll';
      document.getElementById('qTextInput').value = q.question || '';
      onQuestionTypeInputChange();
      setOptionRows(q.options || [], q.answer || '');
    }

    function resetEditorForm() {
      document.getElementById('editTargetSelect').value = '__NEW__';
      document.getElementById('qIdInput').value = '';
      document.getElementById('qTypeInput').value = 'poll';
      document.getElementById('qTextInput').value = '';
      setOptionRows(['', ''], '');
      onQuestionTypeInputChange();
      markEditing(false);
    }

    async function saveQuestion() {
      const qType = document.getElementById('qTypeInput').value;
      const optionsArr = getOptionValues();
      const answerVal = qType === 'quiz' ? document.getElementById('qAnswerSelect').value.trim() : '';

      const payload = {
        action: 'upsert_question',
        roomId: ROOM_ID,
        adminId: ADMIN_ID,
        question: {
          id: document.getElementById('qIdInput').value.trim(),
          type: qType,
          question: document.getElementById('qTextInput').value.trim(),
          options: optionsArr,
          answer: answerVal
        }
      };
      const res = await postGas(payload);
      setLog(res.message || res.error);
      if (res.ok) {
        markEditing(false);
        await loadAll();
        const editSel = document.getElementById('editTargetSelect');
        if ([...editSel.options].some(o => o.value === res.id)) {
          editSel.value = res.id;
        }
      }
    }

    async function deleteSelectedQuestion() {
      const targetId = document.getElementById('editTargetSelect').value;
      if (targetId === '__NEW__') {
        alert('削除する既存質問をドロップダウンから選択してください。');
        return;
      }
      const targetObj = latestQuestions.find(q => q.id === targetId);
      const confirmed = await showConfirmPopup('この質問を削除しますか？（同じadminの全配信から削除されます）', {
        title: '質問の削除確認',
        detail: {
          id: targetId,
          text: targetObj ? targetObj.question : ''
        }
      });
      if (!confirmed) return;
      const res = await postGas({ action: 'delete_question', roomId: ROOM_ID, adminId: ADMIN_ID, id: targetId });
      setLog(res.message || res.error);
      if (res.ok) {
        resetEditorForm();
        await loadAll();
      }
    }

    async function loadAll() {
      const targetRoomAtStart = ROOM_ID;
      try {
        const data = await fetchGas({ roomId: targetRoomAtStart, adminId: ADMIN_ID });
        if (!data.ok || targetRoomAtStart !== ROOM_ID) return;

        currentState = data.state;
        latestQuestions = data.questions || [];
        syncObsAppearanceInputs(currentState);
        updateMonitorPanel(data);

        const editSel = document.getElementById('editTargetSelect');
        const accordionOpen = document.getElementById('questionAccordion').classList.contains('open');
        if (!isEditingQuestionForm || !accordionOpen) {
          refreshEditTargetSelect();
        } else if (editSel) {
          const prevVal = editSel.value;
          const opts = ['<option value="__NEW__">＋ 新しい質問を作成</option>'];
          latestQuestions.forEach(q => {
            opts.push(`<option value="${escapeHtml(q.id)}">編集: [${escapeHtml(q.type)}] ${escapeHtml(q.id)} - ${escapeHtml(q.question)}</option>`);
          });
          editSel.innerHTML = opts.join('');
          if ([...editSel.options].some(o => o.value === prevVal)) {
            editSel.value = prevVal;
          }
        }

        const sel = document.getElementById('questionSelect');
        const prevSelected = sel.value;
        sel.innerHTML = '';
        latestQuestions.forEach(q => {
          const opt = document.createElement('option');
          opt.value = q.id;
          opt.textContent = `[${q.type}] ${q.id}: ${q.question}`;
          sel.appendChild(opt);
        });
        if (data.state.questionId !== lastQuestionId) {
          sel.value = data.state.questionId;
          lastQuestionId = data.state.questionId;
        } else if ([...sel.options].some(o => o.value === prevSelected)) {
          sel.value = prevSelected;
        } else if ([...sel.options].some(o => o.value === data.state.questionId)) {
          sel.value = data.state.questionId;
        }

        const selectedObj = latestQuestions.find(q => q.id === sel.value) || data.question;
        renderStatusButtons(selectedObj ? selectedObj.type : 'poll');

        const prev = document.getElementById('previewArea');
        prev.innerHTML = (data.results || []).map(r => `
          <div class="result-item">
            <div class="result-top">
              <span>${escapeHtml(r.label)}</span>
              <span class="result-num">${r.count}票 (${r.pct}%)</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${r.pct}%"></div>
            </div>
          </div>
        `).join('');

        renderAdminCountdown();
      } catch (e) {
        console.error(e);
      }
    }

    async function applyQuestion() {
      const questionId = document.getElementById('questionSelect').value;
      const res = await postGas({ action: 'set_state', roomId: ROOM_ID, adminId: ADMIN_ID, questionId });
      setLog(res.ok ? `[room: ${ROOM_ID}] 出題を「${questionId}」に切り替えました。` : res.error);
      loadAll();
    }

    async function setStatus(status) {
      const res = await postGas({ action: 'set_state', roomId: ROOM_ID, adminId: ADMIN_ID, status });
      setLog(res.ok ? `[room: ${ROOM_ID}] ステータスを「${STATUS_LABELS[status] || status}」に変更しました。` : res.error);
      loadAll();
    }

    async function startTimedVoting() {
      const durationSec = Number(document.getElementById('timerSec').value);
      const res = await postGas({ action: 'set_state', roomId: ROOM_ID, adminId: ADMIN_ID, status: 'VOTING', durationSec });
      setLog(res.ok ? `[room: ${ROOM_ID}] ${durationSec}秒タイマーで受付を開始しました。` : res.error);
      loadAll();
    }

    async function clearCurrentVotes() {
      const questionId = document.getElementById('questionSelect').value;
      const selectedObj = latestQuestions.find(q => q.id === questionId);
      const confirmed = await showConfirmPopup(`配信「${ROOM_ID}」の現在選択中の質問の投票ログを削除しますか？`, {
        title: '投票ログの削除確認',
        detail: {
          id: questionId,
          text: selectedObj ? selectedObj.question : ''
        }
      });
      if (!confirmed) return;
      const res = await postGas({ action: 'clear_votes', roomId: ROOM_ID, adminId: ADMIN_ID, questionId });
      setLog(res.message || res.error);
      loadAll();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    loadAll();
    setInterval(loadAll, CONFIG.POLL_INTERVAL_MS);
    setInterval(renderAdminCountdown, 200);
  </script>
</body>
</html>
