<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配信投票 管理パネル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans JP", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      background: #090d16;
      color: #f8fafc;
      padding: 20px;
    }

    .app-shell {
      max-width: 1240px;
      margin: 0 auto;
    }

    /* 上部タイトルバー */
    .header-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #141c2b;
      border: 2px solid #2b3a55;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 20px;
    }

    .header-title {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.02em;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .copy-btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 8px;
      background: #1e293b;
      color: #f8fafc;
      border: 2px solid #475569;
      cursor: pointer;
    }
    .copy-btn:hover {
      border-color: #38bdf8;
      background: #263449;
    }

    /* 左右2カラムレイアウト */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (min-width: 960px) {
      .main-layout {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
      }
      .monitor-column {
        position: sticky;
        top: 20px;
      }
    }

    .column-stack {
      display: grid;
      gap: 20px;
    }

    /* カード共通 */
    .card {
      background: #141c2b;
      border: 2px solid #2b3a55;
      border-radius: 12px;
      padding: 20px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #233047;
    }

    .card-title {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      color: #7dd3fc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 800;
    }

    .type-badge {
      font-size: 13px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 6px;
      background: #1e3a8a;
      color: #dbeafe;
      border: 1px solid #60a5fa;
    }
    .type-badge.quiz {
      background: #831843;
      color: #fce7f3;
      border-color: #f472b6;
    }

    /* フォームパーツ */
    .field {
      margin-bottom: 16px;
    }
    .field:last-child {
      margin-bottom: 0;
    }

    .lbl {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    select, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      padding: 11px 14px;
      border-radius: 8px;
      background: #0b101b;
      color: #ffffff;
      border: 2px solid #475569;
    }

    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .inline-select-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    @media (max-width: 520px) {
      .inline-select-row {
        grid-template-columns: 1fr;
      }
    }

    /* ステータスボタンの均等グリッド */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button.btn {
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      padding: 13px 16px;
      border-radius: 8px;
      border: 2px solid transparent;
      cursor: pointer;
      color: #ffffff;
      background: #2563eb;
      text-align: center;
    }
    button.btn:hover:not(:disabled) {
      filter: brightness(1.12);
    }

    button.btn-green { background: #059669; }
    button.btn-amber { background: #d97706; }
    button.btn-sky { background: #0284c7; }
    button.btn-red { background: #dc2626; }
    button.btn-gray { background: #334155; border-color: #64748b; }

    button.btn.is-current {
      border-color: #ffffff;
      outline: 3px solid #38bdf8;
    }

    /* タイマー行 */
    .timer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .timer-row select {
      width: auto;
      min-width: 115px;
    }

    .timer-badge {
      font-size: 16px;
      font-weight: 800;
      color: #fde047;
      padding: 6px 12px;
      border-radius: 8px;
      background: #0b101b;
      border: 1px solid #eab308;
    }
    .timer-badge:empty {
      display: none;
    }

    /* テーマチップボタン群 */
    .theme-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button.theme-chip {
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      color: #f1f5f9;
      background: #0b101b;
      border: 2px solid #334155;
      border-radius: 999px;
      padding: 8px 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
    }

    button.theme-chip:hover {
      border-color: #94a3b8;
      background: #172236;
    }

    button.theme-chip:active {
      transform: scale(0.98);
    }

    button.theme-chip.is-active {
      color: #ffffff;
      background: #1e2d47;
      border-color: var(--chip-color, #38bdf8);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.15);
    }

    .chip-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--chip-color, #38bdf8);
      border: 2px solid rgba(255, 255, 255, 0.55);
      flex-shrink: 0;
    }

    /* OBS表示位置 3x3 グリッドボタン */
    .pos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button.pos-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      color: #e2e8f0;
      background: #0b101b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 10px 8px;
      cursor: pointer;
      text-align: center;
      line-height: 1.25;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
    }

    button.pos-btn:hover {
      border-color: #38bdf8;
      background: #172236;
      color: #ffffff;
    }

    button.pos-btn:active {
      transform: scale(0.98);
    }

    button.pos-btn.is-active {
      color: #ffffff;
      background: #1d4ed8;
      border-color: #ffffff;
      outline: 2px solid #38bdf8;
    }

    .pos-spacer {
      background: rgba(15, 23, 42, 0.35);
      border: 1px dashed #233047;
      border-radius: 8px;
      min-height: 40px;
    }

    /* OBS表示サイズ切替ボタン */
    .size-switch-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button.size-btn {
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      color: #e2e8f0;
      background: #0b101b;
      border: 2px solid #334155;
      border-radius: 8px;
      padding: 11px 14px;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.08s ease;
    }

    button.size-btn:hover {
      border-color: #38bdf8;
      background: #172236;
      color: #ffffff;
    }

    button.size-btn:active {
      transform: scale(0.98);
    }

    button.size-btn.is-active {
      color: #ffffff;
      background: #0284c7;
      border-color: #ffffff;
      outline: 2px solid #38bdf8;
    }

    .divider {
      margin: 18px 0;
      border: 0;
      border-top: 2px solid #233047;
    }

    /* 操作ログ */
    .log-panel {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #0b101b;
      border-left: 5px solid #38bdf8;
      color: #f8fafc;
      font-size: 14px;
      font-weight: 700;
    }

    /* 右カラム：現在の状態ボックス */
    .live-card {
      background: #182338;
      border: 2px solid #3b82f6;
    }

    .live-status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .state-pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      background: #334155;
      color: #ffffff;
    }
    .state-pill.voting { background: #047857; border: 2px solid #34d399; }
    .state-pill.waiting { background: #b45309; border: 2px solid #fbbf24; }
    .state-pill.closed { background: #334155; border: 2px solid #94a3b8; }
    .state-pill.result { background: #0369a1; border: 2px solid #38bdf8; }
    .state-pill.answer { background: #9d174d; border: 2px solid #f472b6; }

    .live-metrics {
      display: flex;
      gap: 16px;
      font-size: 16px;
      font-weight: 800;
    }

    .live-question-box {
      background: #0b101b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
    }

    .live-q-meta {
      font-size: 13px;
      font-weight: 700;
      color: #93c5fd;
      margin-bottom: 4px;
    }

    .live-q-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      word-break: break-word;
    }

    /* 集計プレビュー */
    .result-item {
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      background: #0b101b;
      border: 1px solid #334155;
    }
    .result-item:last-child {
      margin-bottom: 0;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 700;
    }

    .result-num {
      font-size: 15px;
      font-weight: 800;
      color: #7dd3fc;
      white-space: nowrap;
    }

    .bar-track {
      width: 100%;
      height: 14px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      transition: width 0.3s ease;
    }

    /* 選択肢の個別入力行 */
    .opt-list {
      display: grid;
      gap: 10px;
      margin-bottom: 10px;
    }

    .opt-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .opt-num {
      font-size: 15px;
      font-weight: 800;
      color: #7dd3fc;
      background: #0b101b;
      border: 2px solid #3b82f6;
      border-radius: 8px;
      min-width: 38px;
      height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .opt-item input[type="text"] {
      flex: 1;
    }

    button.btn-del-opt {
      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
      padding: 11px 14px;
      border-radius: 8px;
      background: #334155;
      color: #fecaca;
      border: 2px solid #ef4444;
      cursor: pointer;
    }
    button.btn-del-opt:hover:not(:disabled) {
      background: #dc2626;
      color: #ffffff;
    }
    button.btn-del-opt:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* アコーディオン */
    .acc-card {
      padding: 0;
      overflow: hidden;
    }
    button.acc-toggle {
      width: 100%;
      font-family: inherit;
      background: #141c2b;
      color: #7dd3fc;
      border: none;
      padding: 18px 20px;
      font-size: 17px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      text-align: left;
    }
    button.acc-toggle:hover {
      background: #1b263b;
    }
    .acc-body {
      display: none;
      padding: 20px;
      border-top: 2px solid #233047;
    }
    .acc-card.open .acc-body {
      display: block;
    }
    .acc-arrow {
      transition: transform 0.2s ease;
    }
    .acc-card.open .acc-arrow {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- トップバー -->
    <header class="header-bar">
      <h1 class="header-title">配信投票・クイズ 管理パネル</h1>
      <div class="header-actions">
        <button type="button" class="copy-btn" onclick="copyPageUrl('obs.html')">OBS用URLをコピー</button>
        <button type="button" class="copy-btn" onclick="copyPageUrl('index.html')">回答者用URLをコピー</button>
      </div>
    </header>

    <!-- メイン2カラム -->
    <div class="main-layout">
      <!-- 左カラム：操作パネル -->
      <div class="column-stack">
        <!-- 1. 出題する質問の選択 -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title"><span class="step-num">1</span>出題する質問の選択</h2>
          </div>
          <div class="field">
            <label class="lbl" for="questionSelect">登録済みの質問</label>
            <div class="inline-select-row">
              <select id="questionSelect" onchange="onQuestionSelectChange()"></select>
              <button type="button" class="btn" onclick="applyQuestion()">出題を切り替える</button>
            </div>
          </div>
        </section>

        <!-- 2. ステータス・テーマ・表示位置・サイズ -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title"><span class="step-num">2</span>ステータス・OBS表示操作</h2>
            <span id="statusModeTag" class="type-badge">アンケート</span>
          </div>

          <div class="field">
            <span class="lbl">表示・受付ステータス</span>
            <div id="statusBtnRow" class="status-grid"></div>
          </div>

          <hr class="divider" />

          <div class="field">
            <label class="lbl" for="timerSec">制限時間タイマー付き開始</label>
            <div class="timer-row">
              <select id="timerSec">
                <option value="15">15秒</option>
                <option value="30" selected>30秒</option>
                <option value="45">45秒</option>
                <option value="60">60秒</option>
              </select>
              <button type="button" id="timedVoteBtn" class="btn btn-green" onclick="startTimedVoting()">タイマー付きで投票開始</button>
              <span id="adminTimerReadout" class="timer-badge"></span>
            </div>
          </div>

          <hr class="divider" />

          <div class="field">
            <span class="lbl">テーマ（OBS＋回答者同期・ワンクリック切替）</span>
            <div id="themeChipGrid" class="theme-chip-grid" role="group" aria-label="テーマ選択"></div>
          </div>

          <hr class="divider" />

          <div class="field">
            <span class="lbl">OBS表示位置（3×3配置・ワンクリック切替）</span>
            <div id="posGrid" class="pos-grid" role="group" aria-label="OBS表示位置"></div>
          </div>

          <hr class="divider" />

          <div class="field">
            <span class="lbl">OBS表示サイズ（ワンクリック切替）</span>
            <div id="sizeSwitchRow" class="size-switch-row" role="group" aria-label="OBS表示サイズ">
              <button type="button" id="sizeBtnNormal" class="size-btn is-active" onclick="selectSizeButton('normal')">通常サイズ</button>
              <button type="button" id="sizeBtnLarge" class="size-btn" onclick="selectSizeButton('large')">拡大表示（大）</button>
            </div>
          </div>

          <div id="actionLog" class="log-panel">操作結果がここに表示されます。</div>
        </section>

        <!-- 3. 質問の作成・編集・削除 -->
        <section id="questionAccordion" class="card acc-card">
          <button type="button" class="acc-toggle" onclick="toggleAccordion()" aria-expanded="false" aria-controls="questionAccordionPanel">
            <span style="display:flex;align-items:center;gap:8px;">
              <span class="step-num">3</span>質問の作成・編集・削除
            </span>
            <span class="acc-arrow">▼</span>
          </button>

          <div id="questionAccordionPanel" class="acc-body" onfocusin="markEditing(true)">
            <div class="field">
              <label class="lbl" for="editTargetSelect">編集対象</label>
              <div class="inline-select-row">
                <select id="editTargetSelect" onchange="onSelectEditTarget()">
                  <option value="__NEW__">＋ 新しい質問を作成</option>
                </select>
                <button type="button" class="btn btn-red" onclick="deleteSelectedQuestion()">削除</button>
              </div>
            </div>

            <div class="inline-select-row field">
              <div>
                <label class="lbl" for="qIdInput">質問ID（空欄で自動採番）</label>
                <input id="qIdInput" type="text" placeholder="例: q3" />
              </div>

              <div>
                <label class="lbl" for="qTypeInput">種別</label>
                <select id="qTypeInput" onchange="onQuestionTypeInputChange()">
                  <option value="poll">アンケート（poll）</option>
                  <option value="quiz">クイズ（quiz）</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label class="lbl" for="qTextInput">質問文</label>
              <input id="qTextInput" type="text" placeholder="例: 次の配信でやってほしい企画は？" />
            </div>

            <div class="field">
              <span class="lbl">選択肢（1つずつ別枠・2つ以上）</span>
              <div id="optionsList" class="opt-list"></div>
              <button type="button" class="btn btn-gray" onclick="addOptionRow('', true)">＋ 選択肢を追加</button>
            </div>

            <div id="quizAnswerWrap" class="field" style="display: none;">
              <label class="lbl" for="qAnswerSelect">クイズの正解（quizの場合のみ）</label>
              <select id="qAnswerSelect"></select>
            </div>

            <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;">
              <button type="button" class="btn btn-green" onclick="saveQuestion()">質問を保存する</button>
              <button type="button" class="btn btn-gray" onclick="resetEditorForm()">入力をクリア</button>
            </div>
          </div>
        </section>
      </div>

      <!-- 右カラム：常時監視エリア -->
      <div class="column-stack monitor-column">
        <!-- 現在の配信状態 -->
        <section class="card live-card">
          <div class="card-header">
            <h2 class="card-title">現在の配信状態</h2>
            <span id="liveTimerLabel" class="timer-badge"></span>
          </div>

          <div class="live-status-row">
            <span id="liveStatusBadge" class="state-pill waiting">待機中</span>
            <div class="live-metrics">
              <span id="liveVotesLabel">総票数: 0 票</span>
            </div>
          </div>

          <div class="live-question-box">
            <div id="liveQuestionMeta" class="live-q-meta">出題中の質問</div>
            <div id="liveQuestionLabel" class="live-q-title">読み込み中...</div>
          </div>
        </section>

        <!-- リアルタイム集計 -->
        <section class="card">
          <div class="card-header">
            <h2 class="card-title">リアルタイム集計結果</h2>
            <button type="button" class="btn btn-red" style="padding:8px 12px;font-size:13px;" onclick="clearCurrentVotes()">票をリセット</button>
          </div>
          <div id="previewArea">読み込み中...</div>
        </section>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    let lastQuestionId = '';
    let latestQuestions = [];
    let currentState = { status: 'WAITING', deadlineAt: 0, theme: 'dark', position: 'bottom-right', size: 'normal' };
    let isObsAppearanceDirty = false;
    let isEditingQuestionForm = false;

    const THEME_OPTIONS = [
      { key: 'dark',      label: 'ダークモダン',       color: '#38bdf8' },
      { key: 'yellow',    label: 'サンシャインイエロー', color: '#facc15' },
      { key: 'neon',      label: 'ネオンアーケード',     color: '#ec4899' },
      { key: 'pop',       label: 'ライトポップ',       color: '#2563eb' },
      { key: 'cyber',     label: 'サイバーグリーン',   color: '#10b981' },
      { key: 'sakura',    label: 'サクラパステル',     color: '#fb7185' },
      { key: 'broadcast', label: 'TVニュース風',       color: '#ef4444' }
    ];

    const POSITION_SLOTS = [
      { key: 'top-left',      label: '↖ 左上' },
      { key: 'top-center',    label: '↑ 上部中央' },
      { key: 'top-right',     label: '↗ 右上' },
      { key: null,            label: '' },
      { key: 'center',        label: '◎ 中央' },
      { key: null,            label: '' },
      { key: 'bottom-left',   label: '↙ 左下' },
      { key: 'bottom-center', label: '↓ 下部中央' },
      { key: 'bottom-right',  label: '↘ 右下' }
    ];

    let selectedTheme = 'dark';
    let selectedPosition = 'bottom-right';
    let selectedSize = 'normal';

    const STATUS_LABELS = {
      WAITING: '待機中（非表示）',
      VOTING: '受付中',
      CLOSED: '受付終了',
      RESULT: '結果表示中',
      ANSWER: '正解発表中'
    };

    const BUTTON_CONFIGS = {
      poll: [
        { status: 'WAITING', label: '非表示（待機）', cls: 'btn-amber' },
        { status: 'VOTING', label: '投票受付中（無制限）', cls: 'btn-green' },
        { status: 'CLOSED', label: '投票受付終了', cls: 'btn-gray' },
        { status: 'RESULT', label: 'アンケート結果表示', cls: 'btn-sky' }
      ],
      quiz: [
        { status: 'WAITING', label: '非表示（待機）', cls: 'btn-amber' },
        { status: 'VOTING', label: '回答受付中（無制限）', cls: 'btn-green' },
        { status: 'CLOSED', label: '回答受付終了', cls: 'btn-gray' },
        { status: 'RESULT', label: '集計結果表示', cls: 'btn-sky' },
        { status: 'ANSWER', label: 'クイズ正解表示', cls: 'btn-green' }
      ]
    };

    function renderThemeChips() {
      const grid = document.getElementById('themeChipGrid');
      if (!grid) return;

      grid.innerHTML = '';
      THEME_OPTIONS.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'theme-chip' + (selectedTheme === item.key ? ' is-active' : '');
        btn.style.setProperty('--chip-color', item.color);
        btn.setAttribute('aria-pressed', String(selectedTheme === item.key));

        const dot = document.createElement('span');
        dot.className = 'chip-dot';

        const txt = document.createElement('span');
        txt.textContent = item.label;

        btn.appendChild(dot);
        btn.appendChild(txt);
        btn.onclick = () => selectThemeChip(item.key);
        grid.appendChild(btn);
      });
    }

    async function selectThemeChip(themeKey) {
      selectedTheme = themeKey;
      isObsAppearanceDirty = true;
      renderThemeChips();
      await applyObsAppearance();
    }

    function renderPositionButtons() {
      const grid = document.getElementById('posGrid');
      if (!grid) return;

      grid.innerHTML = '';
      POSITION_SLOTS.forEach(slot => {
        if (!slot.key) {
          const spacer = document.createElement('div');
          spacer.className = 'pos-spacer';
          spacer.setAttribute('aria-hidden', 'true');
          grid.appendChild(spacer);
          return;
        }

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pos-btn' + (selectedPosition === slot.key ? ' is-active' : '');
        btn.textContent = slot.label;
        btn.setAttribute('aria-pressed', String(selectedPosition === slot.key));
        btn.onclick = () => selectPositionButton(slot.key);
        grid.appendChild(btn);
      });
    }

    async function selectPositionButton(posKey) {
      selectedPosition = posKey;
      isObsAppearanceDirty = true;
      renderPositionButtons();
      await applyObsAppearance();
    }

    function renderSizeButtons() {
      const normalBtn = document.getElementById('sizeBtnNormal');
      const largeBtn = document.getElementById('sizeBtnLarge');
      if (normalBtn) {
        normalBtn.classList.toggle('is-active', selectedSize === 'normal');
        normalBtn.setAttribute('aria-pressed', String(selectedSize === 'normal'));
      }
      if (largeBtn) {
        largeBtn.classList.toggle('is-active', selectedSize === 'large');
        largeBtn.setAttribute('aria-pressed', String(selectedSize === 'large'));
      }
    }

    async function selectSizeButton(sizeKey) {
      selectedSize = sizeKey === 'large' ? 'large' : 'normal';
      isObsAppearanceDirty = true;
      renderSizeButtons();
      await applyObsAppearance();
    }

    function setLog(message) {
      const el = document.getElementById('actionLog');
      if (el && message) {
        el.textContent = message;
      }
    }

    function copyPageUrl(filename) {
      const url = new URL('./' + filename, window.location.href).href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url)
          .then(() => setLog(`${filename} のURLをコピーしました: ${url}`))
          .catch(() => setLog(`URL: ${url}`));
      } else {
        setLog(`URL: ${url}`);
      }
    }

    function markEditing(editing) {
      isEditingQuestionForm = Boolean(editing);
    }

    function renderStatusButtons(type) {
      const normalizedType = type === 'quiz' ? 'quiz' : 'poll';
      const tag = document.getElementById('statusModeTag');
      if (tag) {
        tag.textContent = normalizedType === 'quiz' ? 'クイズ' : 'アンケート';
        tag.className = 'type-badge' + (normalizedType === 'quiz' ? ' quiz' : '');
      }

      const timedBtn = document.getElementById('timedVoteBtn');
      if (timedBtn) {
        timedBtn.textContent = normalizedType === 'quiz'
          ? 'タイマー付きで回答開始'
          : 'タイマー付きで投票開始';
      }

      const row = document.getElementById('statusBtnRow');
      if (!row) return;

      const defs = BUTTON_CONFIGS[normalizedType];
      row.innerHTML = '';
      defs.forEach(def => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = def.label;
        const classes = ['btn'];
        if (def.cls) classes.push(def.cls);
        if (currentState && currentState.status === def.status) classes.push('is-current');
        btn.className = classes.join(' ');
        btn.onclick = () => setStatus(def.status);
        row.appendChild(btn);
      });
    }

    function updateMonitorPanel(data) {
      const st = (data.state && data.state.status) || 'WAITING';
      const badge = document.getElementById('liveStatusBadge');
      if (badge) {
        badge.textContent = STATUS_LABELS[st] || st;
        badge.className = 'state-pill ' + st.toLowerCase();
      }

      const vLabel = document.getElementById('liveVotesLabel');
      if (vLabel) {
        vLabel.textContent = `総票数: ${Number(data.totalVotes || 0)} 票`;
      }

      const metaEl = document.getElementById('liveQuestionMeta');
      const qLabel = document.getElementById('liveQuestionLabel');
      if (data.question) {
        if (metaEl) {
          const typeText = data.question.type === 'quiz' ? 'クイズ' : 'アンケート';
          const sizeText = (currentState.size || selectedSize) === 'large' ? '拡大' : '通常';
          metaEl.textContent = `出題中 [${data.question.id} / ${typeText}] ・ テーマ: ${currentState.theme} ・ 位置: ${currentState.position} ・ サイズ: ${sizeText}`;
        }
        if (qLabel) {
          qLabel.textContent = data.question.question;
        }
      }
    }

    function onQuestionSelectChange() {
      const selId = document.getElementById('questionSelect').value;
      const found = latestQuestions.find(q => q.id === selId);
      if (found) {
        renderStatusButtons(found.type);
      }
    }

    function onQuestionTypeInputChange() {
      const isQuiz = document.getElementById('qTypeInput').value === 'quiz';
      document.getElementById('quizAnswerWrap').style.display = isQuiz ? 'block' : 'none';
      if (isQuiz) {
        syncAnswerSelectOptions();
      }
    }

    function getOptionInputs() {
      return [...document.querySelectorAll('#optionsList .opt-item input[type="text"]')];
    }

    function getOptionValues() {
      return getOptionInputs()
        .map(inp => inp.value.trim())
        .filter(Boolean);
    }

    function syncAnswerSelectOptions(preferredAnswer) {
      const ansSel = document.getElementById('qAnswerSelect');
      if (!ansSel) return;
      const targetVal = typeof preferredAnswer === 'string' ? preferredAnswer : ansSel.value;
      const opts = getOptionValues();

      ansSel.innerHTML = '<option value="">（正解を選択してください）</option>';
      opts.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        ansSel.appendChild(o);
      });

      if (targetVal && opts.includes(targetVal)) {
        ansSel.value = targetVal;
      } else {
        ansSel.value = '';
      }
    }

    function refreshOptionRowMeta() {
      const rows = [...document.querySelectorAll('#optionsList .opt-item')];
      rows.forEach((row, idx) => {
        const numEl = row.querySelector('.opt-num');
        const delBtn = row.querySelector('.btn-del-opt');
        if (numEl) numEl.textContent = `${idx + 1}`;
        if (delBtn) delBtn.disabled = rows.length <= 2;
      });
      syncAnswerSelectOptions();
    }

    function addOptionRow(initialValue = '', focusNew = false) {
      markEditing(true);
      const list = document.getElementById('optionsList');
      const row = document.createElement('div');
      row.className = 'opt-item';

      const numSpan = document.createElement('span');
      numSpan.className = 'opt-num';

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '選択肢を入力';
      input.value = initialValue;
      input.addEventListener('input', () => {
        markEditing(true);
        syncAnswerSelectOptions();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addOptionRow('', true);
        }
      });

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'btn-del-opt';
      delBtn.title = 'この選択肢を削除';
      delBtn.textContent = '×';
      delBtn.onclick = () => {
        markEditing(true);
        if (list.querySelectorAll('.opt-item').length <= 2) return;
        row.remove();
        refreshOptionRowMeta();
      };

      row.appendChild(numSpan);
      row.appendChild(input);
      row.appendChild(delBtn);
      list.appendChild(row);

      refreshOptionRowMeta();
      if (focusNew) {
        input.focus();
      }
    }

    function setOptionRows(optionsArr, selectedAnswer = '') {
      const list = document.getElementById('optionsList');
      list.innerHTML = '';
      const items = Array.isArray(optionsArr) && optionsArr.length >= 2
        ? optionsArr
        : (Array.isArray(optionsArr) && optionsArr.length === 1 ? [optionsArr[0], ''] : ['', '']);
      items.forEach(opt => addOptionRow(opt, false));
      syncAnswerSelectOptions(selectedAnswer);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderStatusButtons('poll');
      renderThemeChips();
      renderPositionButtons();
      renderSizeButtons();
      setOptionRows(['', ''], '');
      onQuestionTypeInputChange();
    });

    function syncObsAppearanceInputs(state) {
      if (isObsAppearanceDirty || !state) return;
      if (state.theme && THEME_OPTIONS.some(t => t.key === state.theme)) {
        selectedTheme = state.theme;
        renderThemeChips();
      }
      if (state.position && POSITION_SLOTS.some(p => p.key === state.position)) {
        selectedPosition = state.position;
        renderPositionButtons();
      }
      if (state.size === 'normal' || state.size === 'large') {
        selectedSize = state.size;
        renderSizeButtons();
      }
    }

    async function applyObsAppearance() {
      const theme = selectedTheme || 'dark';
      const position = selectedPosition || 'bottom-right';
      const size = selectedSize || 'normal';
      const res = await postGas({ action: 'set_state', theme, position, size });
      isObsAppearanceDirty = false;
      setLog(res.ok ? `OBS表示を「${theme} / ${position} / ${size === 'large' ? '拡大' : '通常'}」に更新しました。` : res.error);
      loadAll();
    }

    function toggleAccordion(forceOpen) {
      const card = document.getElementById('questionAccordion');
      const btn = card.querySelector('.acc-toggle');
      const nextOpen = typeof forceOpen === 'boolean' ? forceOpen : !card.classList.contains('open');
      card.classList.toggle('open', nextOpen);
      btn.setAttribute('aria-expanded', String(nextOpen));
      if (!nextOpen) {
        markEditing(false);
      }
    }

    function renderAdminCountdown() {
      const badgeEl = document.getElementById('adminTimerReadout');
      const liveEl = document.getElementById('liveTimerLabel');
      if (currentState.status === 'VOTING' && currentState.deadlineAt) {
        const remainSec = Math.max(0, Math.ceil((Number(currentState.deadlineAt) - Date.now()) / 1000));
        const txt = `残り ${remainSec}秒`;
        if (badgeEl) badgeEl.textContent = txt;
        if (liveEl) liveEl.textContent = txt;
      } else {
        if (badgeEl) badgeEl.textContent = '';
        if (liveEl) liveEl.textContent = '';
      }
    }

    function refreshEditTargetSelect() {
      const editSel = document.getElementById('editTargetSelect');
      if (!editSel) return;
      const prevVal = editSel.value;
      editSel.innerHTML = '<option value="__NEW__">＋ 新しい質問を作成</option>';
      latestQuestions.forEach(q => {
        const opt = document.createElement('option');
        opt.value = q.id;
        opt.textContent = `編集: [${q.type}] ${q.id} - ${q.question}`;
        editSel.appendChild(opt);
      });
      if ([...editSel.options].some(o => o.value === prevVal)) {
        editSel.value = prevVal;
      }
    }

    function onSelectEditTarget() {
      markEditing(true);
      const val = document.getElementById('editTargetSelect').value;
      if (val === '__NEW__') {
        resetEditorForm();
        return;
      }
      const q = latestQuestions.find(item => item.id === val);
      if (!q) return;
      document.getElementById('qIdInput').value = q.id;
      document.getElementById('qTypeInput').value = q.type || 'poll';
      document.getElementById('qTextInput').value = q.question || '';
      onQuestionTypeInputChange();
      setOptionRows(q.options || [], q.answer || '');
    }

    function resetEditorForm() {
      document.getElementById('editTargetSelect').value = '__NEW__';
      document.getElementById('qIdInput').value = '';
      document.getElementById('qTypeInput').value = 'poll';
      document.getElementById('qTextInput').value = '';
      setOptionRows(['', ''], '');
      onQuestionTypeInputChange();
      markEditing(false);
    }

    async function saveQuestion() {
      const qType = document.getElementById('qTypeInput').value;
      const optionsArr = getOptionValues();
      const answerVal = qType === 'quiz' ? document.getElementById('qAnswerSelect').value.trim() : '';

      const payload = {
        action: 'upsert_question',
        question: {
          id: document.getElementById('qIdInput').value.trim(),
          type: qType,
          question: document.getElementById('qTextInput').value.trim(),
          options: optionsArr,
          answer: answerVal
        }
      };
      const res = await postGas(payload);
      setLog(res.message || res.error);
      if (res.ok) {
        markEditing(false);
        await loadAll();
        const editSel = document.getElementById('editTargetSelect');
        if ([...editSel.options].some(o => o.value === res.id)) {
          editSel.value = res.id;
        }
      }
    }

    async function deleteSelectedQuestion() {
      const targetId = document.getElementById('editTargetSelect').value;
      if (targetId === '__NEW__') {
        alert('削除する既存質問をドロップダウンから選択してください。');
        return;
      }
      if (!confirm(`質問「${targetId}」を削除しますか？`)) return;
      const res = await postGas({ action: 'delete_question', id: targetId });
      setLog(res.message || res.error);
      if (res.ok) {
        resetEditorForm();
        await loadAll();
      }
    }

    async function loadAll() {
      try {
        const data = await fetchGas();
        if (!data.ok) return;

        currentState = data.state;
        latestQuestions = data.questions || [];
        syncObsAppearanceInputs(currentState);
        updateMonitorPanel(data);

        const editSel = document.getElementById('editTargetSelect');
        const accordionOpen = document.getElementById('questionAccordion').classList.contains('open');
        if (!isEditingQuestionForm || !accordionOpen) {
          refreshEditTargetSelect();
        } else if (editSel) {
          const prevVal = editSel.value;
          const opts = ['<option value="__NEW__">＋ 新しい質問を作成</option>'];
          latestQuestions.forEach(q => {
            opts.push(`<option value="${escapeHtml(q.id)}">編集: [${escapeHtml(q.type)}] ${escapeHtml(q.id)} - ${escapeHtml(q.question)}</option>`);
          });
          editSel.innerHTML = opts.join('');
          if ([...editSel.options].some(o => o.value === prevVal)) {
            editSel.value = prevVal;
          }
        }

        const sel = document.getElementById('questionSelect');
        const prevSelected = sel.value;
        sel.innerHTML = '';
        latestQuestions.forEach(q => {
          const opt = document.createElement('option');
          opt.value = q.id;
          opt.textContent = `[${q.type}] ${q.id}: ${q.question}`;
          sel.appendChild(opt);
        });
        if (data.state.questionId !== lastQuestionId) {
          sel.value = data.state.questionId;
          lastQuestionId = data.state.questionId;
        } else if ([...sel.options].some(o => o.value === prevSelected)) {
          sel.value = prevSelected;
        } else if ([...sel.options].some(o => o.value === data.state.questionId)) {
          sel.value = data.state.questionId;
        }

        const selectedObj = latestQuestions.find(q => q.id === sel.value) || data.question;
        renderStatusButtons(selectedObj ? selectedObj.type : 'poll');

        const prev = document.getElementById('previewArea');
        prev.innerHTML = (data.results || []).map(r => `
          <div class="result-item">
            <div class="result-top">
              <span>${escapeHtml(r.label)}</span>
              <span class="result-num">${r.count}票 (${r.pct}%)</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:${r.pct}%"></div>
            </div>
          </div>
        `).join('');

        renderAdminCountdown();
      } catch (e) {
        console.error(e);
      }
    }

    async function applyQuestion() {
      const questionId = document.getElementById('questionSelect').value;
      const res = await postGas({ action: 'set_state', questionId });
      setLog(res.ok ? `出題を「${questionId}」に切り替えました。` : res.error);
      loadAll();
    }

    async function setStatus(status) {
      const res = await postGas({ action: 'set_state', status });
      setLog(res.ok ? `ステータスを「${STATUS_LABELS[status] || status}」に変更しました。` : res.error);
      loadAll();
    }

    async function startTimedVoting() {
      const durationSec = Number(document.getElementById('timerSec').value);
      const res = await postGas({ action: 'set_state', status: 'VOTING', durationSec });
      setLog(res.ok ? `${durationSec}秒タイマーで受付を開始しました。` : res.error);
      loadAll();
    }

    async function clearCurrentVotes() {
      if (!confirm('現在選択中の質問の投票ログを削除しますか？')) return;
      const questionId = document.getElementById('questionSelect').value;
      const res = await postGas({ action: 'clear_votes', questionId });
      setLog(res.message || res.error);
      loadAll();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    loadAll();
    setInterval(loadAll, CONFIG.POLL_INTERVAL_MS);
    setInterval(renderAdminCountdown, 200);
  </script>
</body>
</html>
